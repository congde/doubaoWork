# HTTP only. Copy to /etc/nginx/conf.d/agentc.conf
# Independent site for /workspace/doubaoWork
# plcInc stays on plccodeinfo.com and is not served here.

server {
    listen 80;
    listen [::]:80;
    server_name www.agentc.com.cn;
    return 301 http://agentc.com.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name agentc.com.cn;

    root /workspace/doubaoWork;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
        if_modified_since off;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
        if_modified_since off;
    }

    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=60";
        types { application/pdf pdf; }
        default_type application/pdf;
    }

    # Old Chinese paths: nginx rewrite matches decoded $uri.
    rewrite ^/resources/章节技能_即用版/打开这里\.html$ /resources/skill-kit/index.html permanent;
    rewrite ^/resources/章节技能_即用版/15章技能_单章合集\.zip$ /resources/skill-kit/packs/all-skills.zip permanent;
    rewrite ^/resources/章节技能_即用版/单章下载/(.*)$ /resources/skill-kit/packs/$1 permanent;
    rewrite ^/resources/章节技能_即用版/?$ /resources/skill-kit/index.html permanent;
    rewrite ^/resources/章节技能_即用版/(.*)$ /resources/skill-kit/$1 permanent;
    rewrite ^/resources/思维导图与章节技能/打开这里\.html$ /resources/companion/index.html permanent;
    rewrite ^/resources/思维导图与章节技能/?$ /resources/companion/index.html permanent;
    rewrite ^/resources/思维导图与章节技能/(.*)$ /resources/companion/$1 permanent;
    rewrite ^/resources/豆包工作全面思维导图/打开全面思维导图\.html$ /resources/overview/index.html permanent;
    rewrite ^/resources/豆包工作全面思维导图/?$ /resources/overview/index.html permanent;
    rewrite ^/resources/豆包工作全面思维导图/(.*)$ /resources/overview/$1 permanent;
    rewrite ^/resources/豆包Word整体思维导图/打开全书思维导图\.html$ /resources/book-map/index.html permanent;
    rewrite ^/resources/豆包Word整体思维导图/?$ /resources/book-map/index.html permanent;
    rewrite ^/resources/豆包Word整体思维导图/(.*)$ /resources/book-map/$1 permanent;
    rewrite ^/appendices/附录-20条指令模版\+20个常见问题解答\+24个核心术语速查\.pdf$ /appendices/book-appendix.pdf permanent;

    # Same legacy URLs when the client sends percent-encoded $request_uri.
    if ($request_uri ~ "^/resources/%E7%AB%A0%E8%8A%82%E6%8A%80%E8%83%BD_%E5%8D%B3%E7%94%A8%E7%89%88/(%E6%89%93%E5%BC%80%E8%BF%99%E9%87%8C\.html)?(\?|$)") {
        return 301 /resources/skill-kit/index.html;
    }
    if ($request_uri ~ "^/resources/%E7%AB%A0%E8%8A%82%E6%8A%80%E8%83%BD_%E5%8D%B3%E7%94%A8%E7%89%88/%E5%8D%95%E7%AB%A0%E4%B8%8B%E8%BD%BD/(.*)$") {
        return 301 /resources/skill-kit/packs/$1;
    }
    if ($request_uri ~ "^/resources/%E6%80%9D%E7%BB%B4%E5%AF%BC%E5%9B%BE%E4%B8%8E%E7%AB%A0%E8%8A%82%E6%8A%80%E8%83%BD/(%E6%89%93%E5%BC%80%E8%BF%99%E9%87%8C\.html)?(\?|$)") {
        return 301 /resources/companion/index.html;
    }
    if ($request_uri ~ "^/resources/%E8%B1%86%E5%8C%85%E5%B7%A5%E4%BD%9C%E5%85%A8%E9%9D%A2%E6%80%9D%E7%BB%B4%E5%AF%BC%E5%9B%BE/(%E6%89%93%E5%BC%80%E5%85%A8%E9%9D%A2%E6%80%9D%E7%BB%B4%E5%AF%BC%E5%9B%BE\.html)?(\?|$)") {
        return 301 /resources/overview/index.html;
    }
    if ($request_uri ~ "^/resources/%E8%B1%86%E5%8C%85Word%E6%95%B4%E4%BD%93%E6%80%9D%E7%BB%B4%E5%AF%BC%E5%9B%BE/(%E6%89%93%E5%BC%80%E5%85%A8%E4%B9%A6%E6%80%9D%E7%BB%B4%E5%AF%BC%E5%9B%BE\.html)?(\?|$)") {
        return 301 /resources/book-map/index.html;
    }

    location / {
        add_header Cache-Control "public, max-age=120";
        try_files $uri $uri/ =404;
    }
}
