# HTTP only. Copy to /etc/nginx/conf.d/agentc.conf
# Independent site for /workspace/doubaoWork
# plcInc stays on plccodeinfo.com and is not served here.

server {
    listen 80;
    listen [::]:80;
    server_name www.agentc.com.cn;
    return 301 http://agentc.com.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name agentc.com.cn;

    root /workspace/doubaoWork;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
        if_modified_since off;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        etag off;
        if_modified_since off;
    }

    location / {
        add_header Cache-Control "public, max-age=120";
        try_files $uri $uri/ =404;
    }
}
