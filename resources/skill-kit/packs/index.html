<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>技能文件包 · 豆包工作</title>
  <link rel="stylesheet" href="../../../site.css">
  <style>.wrap{max-width:860px;margin:0 auto;padding:12px 4vw 64px} ul{padding-left:20px;line-height:2}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="../../../index.html">
    <div class="mark" aria-hidden="true">豆</div>
    <div><strong>豆包工作</strong><small>技能文件包</small></div>
  </a>
  <div class="top-actions"><a href="../index.html">返回随书技能</a></div>
</header>
<div class="page-intro">
  <div class="eyebrow">随书技能</div>
  <h1>技能文件包</h1>
  <p>每个压缩包含技能规则和相关文件。可按技能取用。</p>
  <p class="count" id="skill-more"></p>
</div>
<main class="wrap">
  <ul id="pack-list"></ul>
</main>
<script src="../../../skill-release.js?v=20261001"></script>
<script src="../../../poju-data.js?v=20260918"></script>
<script>
const all = window.POJU_SKILLS || [];
const open = SKILL_RELEASE.filter(all);
const moreEl = document.getElementById('skill-more');
const more = SKILL_RELEASE.readerNote(all.length);
if (moreEl) {
  moreEl.textContent = more;
  moreEl.hidden = !more;
}
const list = document.getElementById('pack-list');
open.forEach(s => {
  const li = document.createElement('li');
  const file = s.zip.split('/').pop();
  li.innerHTML = '<a href="' + encodeURI(file) + '" download>' + s.name + '</a>';
  list.append(li);
});
</script>
</body>
</html>
