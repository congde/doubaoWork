<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>随书技能 · 豆包工作</title>
  <link rel="stylesheet" href="../../site.css">
  <style>
    .wrap{max-width:1240px;margin:0 auto;padding:12px 4vw 64px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
    .toolbar input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:14px;padding:12px 16px;background:#fff}
    .cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
    .cats button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;color:#55677a}
    .cats button.on{background:#0071e3;border-color:#0071e3;color:#fff}
    table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
    th{background:#f4f8fc;text-align:left;padding:12px 16px;font-size:13px;color:var(--muted);font-weight:600}
    td{padding:14px 16px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
    tr:hover td{background:#fafcff}
    .cat{color:var(--accent);font-weight:600;white-space:nowrap}
    .name{font-weight:650;min-width:160px}
    .sum{color:var(--muted);line-height:1.7}
    .act{white-space:nowrap}
    .empty{color:var(--muted);padding:28px 0}
    tr.target td{background:#eaf3fd}
  </style>
</head>
<body>
<header class="top">
  <a class="brand" href="../../index.html">
    <div class="mark" aria-hidden="true">豆</div>
    <div><strong>豆包工作</strong><small>随书技能</small></div>
  </a>
  <div class="top-actions"><a href="../../index.html">返回阅读指南</a></div>
</header>
<div class="page-intro">
  <div class="eyebrow">随书技能</div>
  <h1>选一个任务，直接开始。</h1>
  <p>下载技能包后，按说明在支持技能的环境中使用。先看简介，再换成自己的材料。</p>
  <p class="count" id="skill-more"></p>
</div>
<main class="wrap">
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索名称、分类或简介" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="cats" id="cats"></div>
  <table>
    <thead><tr><th>分类</th><th>技能</th><th>简介</th><th></th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <p id="empty" class="empty" hidden>没有找到匹配的技能。</p>
</main>
<script src="../../skill-release.js?v=20261001"></script>
<script src="../../poju-data.js?v=20260918"></script>
<script>
const $ = id => document.getElementById(id);
const all = window.POJU_SKILLS || [];
const open = (window.SKILL_RELEASE ? SKILL_RELEASE.filter(all) : all);
const more = window.SKILL_RELEASE ? SKILL_RELEASE.readerNote(all.length) : '';
if ($('skill-more')) {
  $('skill-more').textContent = more;
  $('skill-more').hidden = !more;
}
let cat = '全部';
const cats = ['全部', ...Array.from(new Set(open.map(s => s.cat)))];
$('cats').innerHTML = cats.map(c => '<button type="button" data-cat="'+c+'">'+c+'</button>').join('');
function packHref(s) {
  return s.zip.replace(/^resources\/skill-kit\//, '');
}
function visible() {
  const q = $('q').value.trim().toLowerCase();
  return open.filter(s => {
    if (cat !== '全部' && s.cat !== cat) return false;
    if (!q) return true;
    return (s.name + ' ' + s.cat + ' ' + s.brief + ' ' + (s.author || '')).toLowerCase().includes(q);
  });
}
function render() {
  const list = visible();
  $('count').textContent = '共 ' + list.length + ' 个';
  document.querySelectorAll('#cats button').forEach(b => b.classList.toggle('on', b.dataset.cat === cat));
  const hash = (location.hash || '').replace(/^#/, '');
  $('tb').innerHTML = list.map(s => `
    <tr id="${s.id}" class="${s.id===hash?'target':''}">
      <td class="cat">${s.cat}</td>
      <td class="name">${s.name}</td>
      <td class="sum">${s.brief}</td>
      <td class="act"><a class="btn" href="${packHref(s)}" download>下载</a></td>
    </tr>`).join('');
  $('empty').hidden = list.length > 0;
  const row = hash && document.getElementById(hash);
  if (row) row.scrollIntoView({block: 'center'});
}
$('q').addEventListener('input', render);
$('cats').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]');
  if (!b) return;
  cat = b.dataset.cat;
  render();
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
