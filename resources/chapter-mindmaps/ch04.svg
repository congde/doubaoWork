<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1315" viewBox="0 0 1800 1315" role="img" aria-label="第4章　文档写作：从材料整理到正式成稿结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1315" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 04 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">文档写作：从材料整理到正式成稿</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="111" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">4.1 先判断豆包工作应该介入哪些环节</tspan></text><rect x="930" y="242" width="806" height="264" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">4.2 从会议记录到可执行的纪要</tspan></text><path d="M 964 329.0 V 476" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.2.1 先确认材料，再设计纪要结构</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.2.2 提炼口头讨论，归纳事实、结论和行动</tspan></text><path d="M 964 440.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.2.3 区分纪要、摘要和对外信息</tspan></text><rect x="64" y="544" width="806" height="315" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="568" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="588" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">4.3 从零散材料到可行方案</tspan></text><path d="M 98 631.0 V 829" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 639.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.3.1 先盘点证据和信息缺口</tspan></text><path d="M 98 690.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.3.2 先审骨架，再分段生成正文</tspan></text><path d="M 98 742.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.3.3 建议与证据应可追溯</tspan></text><path d="M 98 793.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="801.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.3.4 用证据台账控制事实、判断和引用</tspan></text><rect x="930" y="544" width="806" height="264" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="568" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="588" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">4.4 从初稿到定稿：控制修改范围</tspan></text><path d="M 964 631.0 V 778" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 639.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.4.1 修改要求要包含对象、动作和约束</tspan></text><path d="M 964 690.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.4.2 局部修改也要检查连带影响</tspan></text><path d="M 964 742.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">4.4.3 把修改拆成可核对的变更集</tspan></text><rect x="64" y="897" width="806" height="315" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="921" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="941" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">4.5 交付前完成一次系统验收</tspan></text><path d="M 98 984.0 V 1182" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 992.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1000.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.5.1 用5层检查代替笼统校对</tspan></text><path d="M 98 1043.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1051.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.5.2 把成稿连同依据和未决事项一起交付</tspan></text><path d="M 98 1095.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1103.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.5.3 正式文档交付前检查</tspan></text><path d="M 98 1146.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1154.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">4.5.4 完整案例：把一组项目材料整理成决策简报</tspan></text></svg>