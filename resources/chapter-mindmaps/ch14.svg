<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1213" viewBox="0 0 1800 1213" role="img" aria-label="第14章　岗位与业务场景：典型工作的AI协作流程结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1213" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 14 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">岗位与业务场景：典型工作的AI协作流程</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="315" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">14.1 通用交付：让不同成果共享事实与验收规则</tspan></text><path d="M 98 329.0 V 527" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">14.1.1 办公交付链：从事实底稿到方案与汇报</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">14.1.2 软件交付链：生成、测试、审查与文档缺一不可</tspan></text><path d="M 98 440.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">14.1.3 会议交付链：从会后事实到成套成果</tspan></text><path d="M 98 491.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="499.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">14.1.4 把岗位经验整理成一张流程卡</tspan></text><rect x="930" y="242" width="806" height="213"