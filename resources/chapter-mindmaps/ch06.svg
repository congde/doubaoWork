<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" role="img" aria-label="第6章　表格与数据分析：从数据整理到分析结论结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1060" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 06 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">表格与数据分析：从数据整理到分析结论</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="111" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">6.1 选择并理解数据源</tspan></text><rect x="930" y="242" width="806" height="213" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">6.2 数据清洗、合并与批量处理</tspan></text><path d="M 964 329.0 V 425" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">6.2.1 先定义规则，再处理数据</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">6.2.2 跨表合并后，先验证记录没有被遗漏或重复放大</tspan></text><rect x="64" y="493" width="806" height="111" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="517" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="537" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">6.3 数据可视化：让图表服务于问题</tspan></text><rect x="930" y="493" width="806" height="213" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="517" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="537" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">6.4 从分析结果到业务判断</tspan></text><path d="M 964 580.0 V 676" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 588.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="596.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">6.4.1 从事实、假设到可验证的经营判断</tspan></text><path d="M 964 639.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">6.4.2 把原因假设转化为下一轮可以收集证据的问题</tspan></text><rect x="64" y="744" width="806" height="213" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="768" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="788" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">6.5 把口径写进指令，把核验留到交付前</tspan></text><path d="M 98 831.0 V 927" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 839.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="847.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">6.5.1 完整案例：建立可重复生成的经营月报</tspan></text><path d="M 98 890.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="898.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">6.5.2 让交付工作簿既能阅读，也能复算</tspan></text></svg>