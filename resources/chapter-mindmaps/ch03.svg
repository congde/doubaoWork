<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1264" viewBox="0 0 1800 1264" role="img" aria-label="第3章　核心概念：理解智能体的工作方式结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1264" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 03 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">核心概念：理解智能体的工作方式</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="264" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">3.1 智能体怎样完成一项任务</tspan></text><path d="M 98 329.0 V 476" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.1.1 从一句要求到执行的结果</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.1.2 遇到问题时，先判断谁有权决定</tspan></text><path d="M 98 440.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.1.3 上下文与任务状态决定下一步是否可靠</tspan></text><rect x="930" y="242" width="806" height="213" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">3.2 任务在哪里运行，又通过什么工具完成</tspan></text><path d="M 964 329.0 V 425" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.2.1 本地与云端：先看材料、软件和数据边界</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.2.2 浏览器是工具入口，不是第三个运行位置</tspan></text><rect x="64" y="544" width="806" height="264" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="568" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="588" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">3.3 把要求写成可执行、可验收的指令</tspan></text><path d="M 98 631.0 V 778" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 639.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.3.1 四要素共同定义一项任务</tspan></text><path d="M 98 690.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.3.2 按“初始指令—执行确认—结果验收”逐步推进</tspan></text><path d="M 98 742.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.3.3 复杂任务先写“完成定义”，再讨论怎样执行</tspan></text><rect x="930" y="544" width="806" height="315" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="568" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="588" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">3.4 在关键节点监督，并在必要时接管</tspan></text><path d="M 964 631.0 V 829" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 639.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.4.1 看懂过程信息，及时发现偏差</tspan></text><path d="M 964 690.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.4.2 识别必须由人决定的节点</tspan></text><path d="M 964 742.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.4.3 任务失败后先定位，再缩小范围重试</tspan></text><path d="M 964 793.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="801.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">3.4.4 用故障分层决定是改指令、换材料还是换路径</tspan></text><rect x="64" y="897" width="806" height="264" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="921" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="941" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">3.5 管理异步任务，而不是被动等待</tspan></text><path d="M 98 984.0 V 1131" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 992.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1000.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.5.1 用任务结构估计耗时</tspan></text><path d="M 98 1043.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1051.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.5.2 让任务状态和交付结果可追溯</tspan></text><path d="M 98 1095.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1103.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">3.5.3 用任务交接卡避免“系统完成、工作失联”</tspan></text></svg>