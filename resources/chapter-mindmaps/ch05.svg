<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1111" viewBox="0 0 1800 1111" role="img" aria-label="第5章　PPT制作：从汇报目标到现场表达结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1111" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 05 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">PPT制作：从汇报目标到现场表达</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="213" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">5.1 先定义一次汇报，而不是先规定页数</tspan></text><path d="M 98 329.0 V 425" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.1.1 用4个要点确定表达方向</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.1.2 把制作要求写成验收条件</tspan></text><rect x="930" y="242" width="806" height="111" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">5.2 根据材料完整度选择生成路径</tspan></text><rect x="64" y="493" width="806" height="366" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="517" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="537" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">5.3 把大纲变成页面叙事与视觉系统</tspan></text><path d="M 98 580.0 V 829" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 588.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="596.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.3.1 先搭建叙事骨架</tspan></text><path d="M 98 639.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.3.2 让标题表达结论，让视觉承担证据</tspan></text><path d="M 98 691.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="699.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.3.3 把旧PPT当作规则来源，而不是复制对象</tspan></text><path d="M 98 742.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.3.4 控制信息密度和强调层级</tspan></text><path d="M 98 794.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="802.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">5.3.5 为每页的关键数据和结论保留证据入口</tspan></text><rect x="930" y="493" width="806" height="264" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="517" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="537" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">5.4 从页面初稿到可交付的PPT</tspan></text><path d="M 964 580.0 V 727" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 588.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="596.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">5.4.1 局部修改之前先判断影响范围</tspan></text><path d="M 964 639.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">5.4.2 按“事实—叙事—视觉—现场”完成验收</tspan></text><path d="M 964 691.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="699.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">5.4.3 把在真实设备上演练纳入制作流程</tspan></text><rect x="64" y="897" width="806" height="111" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="921" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="941" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">5.5 综合案例：制作全套活动物料</tspan></text></svg>