<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-label="第11章　连接飞书：让企业上下文进入任务结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1050" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 11 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">连接飞书：让企业上下文进入任务</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="213" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">11.1 为什么企业上下文会影响豆包工作</tspan></text><path d="M 98 329.0 V 425" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.1.1 上下文包含3个层面</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.1.2 上下文质量比上下文数量更重要</tspan></text><rect x="930" y="242" width="806" height="111" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">11.2 在授权边界内接入企业上下文</tspan></text><rect x="64" y="493" width="806" height="315" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="517" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="537" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">11.3 从典型任务到团队知识</tspan></text><path d="M 98 580.0 V 778" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 588.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="596.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.3.1 周报、会议和日程3类常见任务</tspan></text><path d="M 98 639.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.3.2 把公开内容研究沉淀为团队数据</tspan></text><path d="M 98 691.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="699.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.3.3 让任务成果成为下一次输入</tspan></text><path d="M 98 742.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">11.3.4 给团队知识设置状态、责任人和失效条件</tspan></text><rect x="930" y="493" width="806" height="111" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="517" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="537" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">11.4 团队协作中的权限与治理</tspan></text></svg>