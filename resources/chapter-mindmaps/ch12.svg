<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-label="第12章　生态扩展：从技能复用到多智能体协作结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1050" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 12 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">生态扩展：从技能复用到多智能体协作</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="264" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">12.1 技能：把跑通的业务流程沉淀为可复用能力</tspan></text><path d="M 98 329.0 V 476" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.1.1 从选择预置技能到创建自定义技能</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.1.2 配置实例：项目周报校验技能</tspan></text><path d="M 98 440.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.1.3 技能发布前要通过正常测试、边界测试和失败测试</tspan></text><rect x="930" y="242" width="806" height="315" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">12.2 连接器：在授权范围内接入外部系统</tspan></text><path d="M 964 329.0 V 527" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">12.2.1 连接器的用途与边界</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">12.2.2 MCP与授权管理</tspan></text><path d="M 964 440.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">12.2.3 配置实例：只读接入客户资料</tspan></text><path d="M 964 491.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="499.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">12.2.4 把连接器当作会失败、会变化的外部依赖</tspan></text><rect x="64" y="595" width="806" height="315" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="619" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="639" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">12.3 工作伙伴与工作小队：从专业分工到协同执行</tspan></text><path d="M 98 682.0 V 880" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 690.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="698.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.3.1 工作伙伴：角色分工、适用任务与入口选择</tspan></text><path d="M 98 741.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="749.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.3.2 工作小队：让多个智能体围绕同一交付协作</tspan></text><path d="M 98 793.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="801.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.3.3 配置实例：新品方案工作小队</tspan></text><path d="M 98 844.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="852.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">12.3.4 用共享任务书和冲突规则控制协作成本</tspan></text><rect x="930" y="595" width="806" height="111" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="619" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="639" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">12.4 生态选型：从最小可用配置开始</tspan></text></svg>