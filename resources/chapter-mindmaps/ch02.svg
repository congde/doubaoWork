c50" font-size="23" font-weight="400"><tspan x="992" dy="0">2.4.3 把材料整理成一个可交接的任务包</tspan></text><rect x="64" y="846" width="806" height="417" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="870" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="890" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">2.5 第五步：完成并验收任务</tspan></text><path d="M 98 933.0 V 1233" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 941.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="949.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.1 准备材料并下达任务</tspan></text><path d="M 98 992.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1000.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.2 观察执行并处理确认</tspan></text><path d="M 98 1044.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1052.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.3 验收结果并处理常见故障</tspan></text><path d="M 98 1095.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1103.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.4 整理任务验收卡</tspan></text><path d="M 98 1147.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1155.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.5 把第一次成功变成可以重复的流程</tspan></text><path d="M 98 1198.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1206.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">2.5.6 从练习材料切换到真实工作</tspan></text></svg>