<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1213" viewBox="0 0 1800 1213" role="img" aria-label="第13章　安全与隐私：从个人授权到组织治理结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1213" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 13 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">安全与隐私：从个人授权到组织治理</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="111" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">13.1 从设备接入到操作审计的安全链</tspan></text><rect x="930" y="242" width="806" height="264" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">13.2 显式授权：把权限拆成可理解的决定</tspan></text><path d="M 964 329.0 V 476" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.2.1 基础权限、关键确认与最小授权</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.2.2 配置实例：周报自动化的最小权限方案</tspan></text><path d="M 964 440.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.2.3 系统权限不等于模型改进设置</tspan></text><rect x="64" y="544" width="806" height="315" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="568" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="588" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">13.3 操作留痕、管理员治理与安全声明</tspan></text><path d="M 98 631.0 V 829" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 639.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.3.1 用日志形成事后追溯能力</tspan></text><path d="M 98 690.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.3.2 如何看待认证、测评与安全声明</tspan></text><path d="M 98 742.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.3.3 后台核验实例：从一次任务反查权限与日志</tspan></text><path d="M 98 793.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="801.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.3.4 数据留存与删除要覆盖所有副本和下游成果</tspan></text><rect x="930" y="544" width="806" height="264" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="568" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="588" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">13.4 异常发生后：先止损，再调查和复盘</tspan></text><path d="M 964 631.0 V 778" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 639.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.4.1 停止任务并确认影响范围</tspan></text><path d="M 964 690.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.4.2 从一次异常修正整条流程</tspan></text><path d="M 964 742.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">13.4.3 通过桌面演练验证停止、通知和恢复路径</tspan></text><rect x="64" y="897" width="806" height="213" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="921" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="941" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">13.5 按组织需求选择配置并完成部署检查</tspan></text><path d="M 98 984.0 V 1080" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 992.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1000.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.5.1 完整部署实例：10人项目组试点</tspan></text><path d="M 98 1043.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1051.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">13.5.2 部署放行清单</tspan></text></svg>