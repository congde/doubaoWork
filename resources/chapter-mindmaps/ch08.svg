<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1264" viewBox="0 0 1800 1264" role="img" aria-label="第8章　操作电脑与浏览器：让跨软件任务保持可控结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1264" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 08 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">操作电脑与浏览器：让跨软件任务保持可控</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="264" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">8.1 任务开始前，先划定权限和数据边界</tspan></text><path d="M 98 329.0 V 476" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.1.1 权限只覆盖完成当前任务所需的范围</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.1.2 不要把风险控制完全交给系统提示</tspan></text><path d="M 98 440.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.1.3 把授权写成任务级权限单</tspan></text><rect x="930" y="242" width="806" height="264" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">8.2 浏览器任务：把页面操作拆成可核对步骤</tspan></text><path d="M 964 329.0 V 476" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">8.2.1 信息收集要保留来源和时间</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">8.2.2 表单任务应把最终提交单独隔离</tspan></text><path d="M 964 440.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">8.2.3 把动态页面和登录会话视为会变化的输入</tspan></text><rect x="64" y="544" width="806" height="264" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="568" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="588" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">8.3 本地文件与跨软件任务：先厘清数据流向</tspan></text><path d="M 98 631.0 V 778" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 639.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.3.1 文件操作必须保留原件和变更记录</tspan></text><path d="M 98 690.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.3.2 跨软件处理要设置中间检查点</tspan></text><path d="M 98 742.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="750.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.3.3 让重复运行安全：幂等、清单与检查点</tspan></text><rect x="930" y="544" width="806" height="213" rx="22" fill="#f7f2fc" stroke="#7855ae" stroke-opacity=".22"/><rect x="930" y="568" width="5" height="40" rx="2" fill="#7855ae"/><text x="960" y="588" fill="#7855ae" font-size="26" font-weight="700"><tspan x="960" dy="0">8.4 根据资源位置选择执行环境和远程入口</tspan></text><path d="M 964 631.0 V 727" fill="none" stroke="#7855ae" stroke-opacity=".3" stroke-width="2"/><path d="M 964 639.0 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="647.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">8.4.1 本地、隔离环境与云端各有边界</tspan></text><path d="M 964 690.5 H 980" fill="none" stroke="#7855ae" stroke-opacity=".4" stroke-width="2"/><text x="992" y="698.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">8.4.2 手机更适合管理任务，不适合替代桌面验收</tspan></text><rect x="64" y="846" width="806" height="315" rx="22" fill="#fff3f6" stroke="#ba516a" stroke-opacity=".22"/><rect x="64" y="870" width="5" height="40" rx="2" fill="#ba516a"/><text x="94" y="890" fill="#ba516a" font-size="26" font-weight="700"><tspan x="94" dy="0">8.5 用试运行、中断、回滚和日志形成安全闭环</tspan></text><path d="M 98 933.0 V 1131" fill="none" stroke="#ba516a" stroke-opacity=".3" stroke-width="2"/><path d="M 98 941.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="949.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.5.1 高影响任务先做预检和小样本试运行</tspan></text><path d="M 98 992.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1000.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.5.2 任务异常时先止损，再决定回滚或重试</tspan></text><path d="M 98 1044.0 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1052.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.5.3 交付时核对结果、影响范围和未完成事项</tspan></text><path d="M 98 1095.5 H 114" fill="none" stroke="#ba516a" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1103.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">8.5.4 完整案例：从网页下载到本地台账的受控流程</tspan></text></svg>