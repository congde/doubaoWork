<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1166" viewBox="0 0 1800 1166" role="img" aria-label="第7章　深度调研与专业分析：从检索到研究报告结构导图"><style>text{font-family:Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif}</style><rect width="1800" height="1166" fill="#fbfcfe"/><text x="64" y="62" fill="#0071b8" font-size="23" font-weight="600"><tspan x="64" dy="0">第 07 章 · 结构导图</tspan></text><text x="64" y="122" fill="#143654" font-size="36" font-weight="700"><tspan x="64" dy="0">深度调研与专业分析：从检索到研究报告</tspan></text><text x="64" y="175" fill="#63778a" font-size="22" font-weight="400"><tspan x="64" dy="0">按小节理解方法，结合正文中的案例与检查项练习。</tspan></text><rect x="64" y="242" width="806" height="366" rx="22" fill="#eef7ff" stroke="#0071b8" stroke-opacity=".22"/><rect x="64" y="266" width="5" height="40" rx="2" fill="#0071b8"/><text x="94" y="286" fill="#0071b8" font-size="26" font-weight="700"><tspan x="94" dy="0">7.1 建立深度调研的五步工作流</tspan></text><path d="M 98 329.0 V 578" fill="none" stroke="#0071b8" stroke-opacity=".3" stroke-width="2"/><path d="M 98 337.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.1.1 从“找资料”转向“回答研究问题”</tspan></text><path d="M 98 388.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.1.2 一条合格的调研指令应写清五类信息</tspan></text><path d="M 98 440.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.1.3 用追问修正证据，而不是只润色文字</tspan></text><path d="M 98 491.5 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="499.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.1.4 明确公开检索、内部信息与人工判断的边界</tspan></text><path d="M 98 543.0 H 114" fill="none" stroke="#0071b8" stroke-opacity=".4" stroke-width="2"/><text x="126" y="551.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.1.5 先画检索地图，再决定什么时候停止</tspan></text><rect x="930" y="242" width="806" height="264" rx="22" fill="#eefaf7" stroke="#008577" stroke-opacity=".22"/><rect x="930" y="266" width="5" height="40" rx="2" fill="#008577"/><text x="960" y="286" fill="#008577" font-size="26" font-weight="700"><tspan x="960" dy="0">7.2 用两个案例完成受控试运行</tspan></text><path d="M 964 329.0 V 476" fill="none" stroke="#008577" stroke-opacity=".3" stroke-width="2"/><path d="M 964 337.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="345.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">7.2.1 校招岗位表：先验证检索与整理链路</tspan></text><path d="M 964 388.5 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="396.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">7.2.2 考研择校表：表格完整不等于信息可信</tspan></text><path d="M 964 440.0 H 980" fill="none" stroke="#008577" stroke-opacity=".4" stroke-width="2"/><text x="992" y="448.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="992" dy="0">7.2.3 用错误样本检验结果，而不是只看整齐的前几行</tspan></text><rect x="64" y="646" width="806" height="417" rx="22" fill="#fff8eb" stroke="#9b6200" stroke-opacity=".22"/><rect x="64" y="670" width="5" height="40" rx="2" fill="#9b6200"/><text x="94" y="690" fill="#9b6200" font-size="26" font-weight="700"><tspan x="94" dy="0">7.3 进阶实战：把考研择校表升级为可信报告</tspan></text><path d="M 98 733.0 V 1033" fill="none" stroke="#9b6200" stroke-opacity=".3" stroke-width="2"/><path d="M 98 741.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="749.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.1 第一步：把目标拆成可核验的调研清单</tspan></text><path d="M 98 792.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="800.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.2 第二步：按信息来源等级进行多渠道检索</tspan></text><path d="M 98 844.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="852.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.3 第三步：筛掉低质材料，建立证据表</tspan></text><path d="M 98 895.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="903.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.4 第四步：用独立来源核对，而不是机械凑够两个信息来源</tspan></text><path d="M 98 947.0 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="955.0" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.5 第五步：生成带证据、限制和待办的报告</tspan></text><path d="M 98 998.5 H 114" fill="none" stroke="#9b6200" stroke-opacity=".4" stroke-width="2"/><text x="126" y="1006.5" fill="#263c50" font-size="23" font-weight="400"><tspan x="126" dy="0">7.3.6 把研究材料写成真正支持决策的报告</tspan></text></svg>