、比例或尺寸和版本；可编辑目录保留设计源文件、网页源代码或视频工程；素材目录保存最终采用的图片、音频、字体和文案，不把大量废弃草稿混入；权利目录记录自有素材授权、第三方许可、人物同意和平台条款核对结果；说明文件则列出生成工具、生成日期、主要人工修改、适用渠道和禁止用途。\n\n生成过程中的指令和版本记录不必全部对外公开，但团队内部应保存足以复现和说明来源的信息。若使用了客户提供的素材，还要注明只能用于当前项目，不能因为它进入工作目录就用于其他生成任务。含个人信息、未发布产品或商业秘密的中间文件，应按组织规则限制访问和到期处理。"}}}]}, "notes": {"plain": {"content": "把多种内容形态组合成一次完整交付时，视觉一致性、事实一致性和素材授权会相互影响。本节先通过学习材料改造案例串联前述方法，再集中说明公开和商用传播前必须检查的合规问题。"}}}]}, "notes": {"plain": {"content": "周五下午，市场团队临时需要一套活动预热材料：一张主视觉、几张社交媒体配图、一段短视频和一个报名页面。生成工具可以很快给出四种成品，但它们可能把活动日期写成不同版本，人物和品牌形象前后不一致，素材能否公开使用也说不清。问题不在于“能不能生成”，而在于怎样让多个产物服务于同一目标，并经得起事实、视觉、技术和权利检查。\n\n多模态生成，是让AI处理文字、图像、音频、视频等不同信息形式。本章围绕图片、海报、漫画、视频、网页和简易应用展开，先把传播目标写成创意任务书，再生成低成本初稿、比较方案并局部修改，最后完成验收和交付。读者要学会的不是追逐某个生成入口，而是把“看起来不错”的结果变成能够使用、维护和说明来源的作品。"}}}]}, "notes": {"plain": {"content": "让AI写一段文字，结果不合适还可以删除重来；让它点击网页、批量处理文件或按时运行任务，错误却可能直接进入真实系统。一次误提交可能覆盖已有记录，一个不完整的结论可能被周期任务反复发送，一项过宽的授权还可能把无关资料带入任务。AI越能“动手”，使用者越不能只看最后的文字是否通顺。\n\n常见的误区，是把更强的执行能力理解为更少的人为介入。真实情况恰好相反：当任务跨越软件、持续运行或产生对外影响时，工作说明必须更具体，检查点必须更清楚，失败后也要知道如何停止、回退和恢复。本篇讨论的不是炫目的自动化演示，而是怎样让执行能力进入可管理的流程。\n\n如果你已经能够用AI完成文档、PPT或数据初稿，希望进一步处理网页、本地文件、跨软件任务、周期流程及多媒体内容，本篇就是下一步。第8章先解决执行环境和文件边界；第9章讨论计划、监控、告警与人工介入；第10章把同样的方法延伸到图片、视频、网页和简易应用。涉及外发、覆盖或账号操作的内容，建议按章节顺序阅读。"}}}, {"id": "ab5a90e5afe750f790fc8d94c4", "title": "第四篇　组织协作与治理篇", "children": {"attached": [{"id": "ch11", "title": "第11章　连接飞书：让企业上下文进入任务", "children": {"attached": [{"id": "8c338e9629905a46802544d404", "title": "11.1　为什么企业上下文会影响AI办公", "children": {"attached": [{"id": "473d6f7ccc54545188f3ce714d", "title": "11.1.1　上下文包含三个层次", "notes": {"plain": {"content": "为了说明“上下文”并不只是一份文档，可以从信息形态与治理层级两个角度观察：前者说明任务可能接触什么，后者说明这些信息属于谁、用于什么范围。\n\n从治理层级看，这些信息又可以归入个人任务、团队协作和组织知识三个范围。表11-1说明每个层次的典型内容、主要作用与风险控制重点。\n\n上下文并非越多越好。资料过期、内容互相冲突或权限过宽，都会降低结果质量并增加风险。真正有价值的上下文应当与当前任务相关、来源可追溯、版本有效且处于授权范围内。\n\n有了相关上下文，还要判断它是否值得使用。飞书连接的优势，在于减少用户反复搬运材料，使已有协作信息能够进入任务链。但这种价值不是自动产生的：团队需要维护文档结构、清理过期资料、标明正式版本，并持续治理共享权限。\n\n竞争产品也可能通过各自的协作平台、连接器或企业知识库获得上下文。因此，评价“是否更懂企业”不能只看接入了哪个平台，还应观察检索是否准确、权限是否清晰、引用能否追溯，以及输出是否能回到团队的正式知识流程中。"}}}, {"id": "c475e53aa6455e4e9a27f88833", "title": "11.1.2　上下文质量比上下文数量更重要", "notes": {"plain": {"content": "连接企业资料后，任务失败的原因可能从“材料太少”变成“材料太多且互相矛盾”。同一个项目可能同时存在立项方案、过程调整、会议纪要和结项报告；如果系统把不同阶段的文档混合使用，就会将已废止的目标、旧预算或早期责任人重新写入当前成果。\n\n高质量上下文至少具有相关、有效、可识别和可追溯四个特征。相关是指材料真正服务于当前问题，而不是因为包含相同关键词就被纳入；有效是指版本和时间仍适用；可识别是指读者能分清正式制度、讨论草稿和个人意见；可追溯是指结论能够返回原消息、文档或会议记录。\n\n任务开始前，可以先要求系统展示候选来源，而不是直接生成结果。展示内容包括标题、所属空间、作者或责任人、更新时间和拟使用原因。用户据此排除旧版、无关项目和不适合进入当前任务的材料，并指定正式版本。若同一事实在多个来源中不一致，应先并列差异，由责任人确认，不能默认采用更新时间最近的一份。"}}}]}, "notes": {"plain": {"content": "企业上下文进入AI任务，需要经过身份确认、权限继承、资料读取和成果回写等环节。连接前后最直接的区别，是任务能否在授权范围内使用组织已有信息，以及成果能否回到协作空间。图11-1从信息来源、协作连续性和权限约束三个方面对比了这种差异；它并不表示连接后AI会自动掌握组织内的全部资料。\n\n模型的通用能力决定它会不会写、会不会分析，工作上下文则决定它是否理解当前组织正在处理什么。企业中的“事实”往往分散在聊天、文档、会议、日程和业务表格中；如果每次任务都从零上传和解释，AI很难形成稳定、贴合实际的输出。"}}}, {"id": "04c391545be758aebc7658c23a", "title": "11.2　在授权边界内接入企业上下文", "notes": {"plain": {"content": "上一节说明了上下文的价值，这一节进一步观察它如何进入日常工作。用户需要关注的不是“登录后AI知道一切”，而是系统在当前身份和权限下能够访问哪些信息，以及这些信息如何被用于某项明确任务。\n\n接入前应先确认身份、权限和数据范围。使用飞书账号后，可用数据可能包括有权访问的聊天、文档、会议纪要和日程。具体范围取决于产品版本、组织配置和用户授权。任务开始前，应说明要使用的空间、群组、文档或时间范围，避免让系统在过大的信息集合中自行寻找。\n\n“用户能看，AI就一定能看”也不能作为默认假设。产品接口、管理员策略和内容类型都可能形成额外限制。可靠做法是先要求系统列出拟使用的来源，再确认后继续处理。\n\n一次完整的接入不只是点击授权按钮，而应覆盖任务前、执行中和交付后三个阶段。表11-2列出每个阶段需要确认的重点，以及应避免的做法。\n\n对于只需要整理信息的任务，应优先采用读取权限；需要写回文档、更新表格或发送消息时，再把写入动作单独列出，并在执行前确认对象和范围。任务结束后，还要检查临时文件、分享链接和不再需要的连接器授权，避免一次任务的权限长期保留。"}}}, {"id": "b04dcc7f6b425ef88ae9f4dd76", "title": "11.3　从典型任务到团队知识", "children": {"attached": [{"id": "ab3159ffcd7754319a9352467a", "title": "11.3.1　周报、会议和日程三类典型任务", "notes": {"plain": {"content": "周报整理可以综合一定时间范围内的项目聊天、会议纪要和日程，但输出应为每项进展保留来源，并把主观计划留给本人确认。会议复盘则适合提取决议、未关闭行动项和反复出现的问题，不能仅根据讨论频次判断风险等级。日程辅助可以寻找空档和提示冲突，但创建、修改或邀请他人之前应等待确认。\n\n示例指令\n\n请基于我有权访问的“项目A”群聊、项目文档和上周会议纪要，整理周报草稿。先列出实际使用的资料及时间范围，再按“已完成、进行中、风险、待确认、下周计划”组织。每项事实注明来源；下周计划只整理已有承诺，不替我新增安排。\n\n这类任务的核心不是“翻记录”本身，而是把分散信息转化为可核对的工作状态。结果生成后，用户仍需检查是否遗漏线下事项、是否误读讨论语气，以及内容是否适合在目标团队中共享。\n\n以项目例会为例，群聊中的讨论、会前文档、会议纪要和任务表往往同时更新。会议开始前，Agent可以按项目和时间范围整理未关闭事项，标出来源冲突和缺少责任人的记录；会议中只记录新的事实、决定和待确认问题，不把所有发言都压缩成“已达成共识”；会议结束后，先由主持人确认决定，再把行动项写入任务表。这样，信息在不同载体之间流动时仍然有一个明确的确认点。"}}}, {"id": "3bb6cb1b8b7a54f0ba94d21e24", "title": "11.3.2　把公开内容研究沉淀为团队数据", "notes": {"plain": {"content": "假设内容团队需要研究一组公开账号，记录账号定位、代表内容、发布时间和公开互动数据，并把分析结果保存到飞书多维表格。这个任务同时涉及网页资料、内容理解、结构化数据和团队协作，适合用来观察上下文如何在不同环节流动。\n\n这项任务按四个阶段推进，阶段之间设置人工检查点。实际耗时取决于样本数量、资料完整度、平台规则和核验深度，应通过试跑记录，而不是预设统一时长。表11-3展示了从确定目标到回写协作空间的完整链路；群聊线索和公开网页都只能在权限与平台规则允许的范围内使用，最终推送也应先经过人工审核。\n\n开始前先确定样本名单、观察时间范围和允许收集的公开字段，并遵守目标平台的访问规则。视频逐字稿只有在产品能够合法访问或用户已取得材料时才处理；无法获取的内容应标记缺失，不通过规避限制的方式抓取。\n\n任务可以分为四步：先建立多维表格字段和样本清单，再逐个整理公开资料；随后抽取内容主题、表达结构和互动特征；最后由团队成员复核异常值和代表案例，并在表格中保留来源链接、采集日期和审核状态。"}}}, {"id": "2f42c6018a1a5137a48e0f3563", "title": "11.3.3　让任务成果成为下一次输入", "notes": {"plain": {"content": "一次任务的结果如果只停留在个人下载目录中，很难形成团队价值。经过核验的方案、报告、数据表和工作方法可以回到飞书文档、知识库或多维表格，成为后续任务的输入。这样的闭环不是“保存所有内容”，而是有选择地沉淀可复用知识。\n\n闭环如何形成。\n\n一个基本闭环包括四步：AI读取已有资料并完成任务，负责人核验和修订结果，确认后的成果进入正式知识空间，后续任务再引用这些成果。文档适合沉淀结论、模板和过程说明；多维表格适合持续积累结构化记录；稳定的方法可以转化为团队模板或技能。\n\n沉淀时应补充标题、责任人、更新时间、适用范围和来源。没有这些元信息，知识库很快会出现多个“最终版”和无法判断真伪的AI文档，反而增加检索成本。\n\n复用价值与沉淀边界。\n\n知识积累可以缩短新人了解背景、团队查找案例和周期任务准备材料的时间，但内容数量并不等于知识质量。以下三类材料不宜直接进入正式知识库：未经核实的AI输出，缺乏长期价值的临时信息，以及需要严格限制访问的敏感资料。"}}}, {"id": "94d87d9752125916a8db9d5dc4", "title": "11.3.4　给团队知识设置状态、责任人和失效条件", "notes": {"plain": {"content": "知识沉淀最危险的误区，是把“已保存”当作“仍然正确”。一个经过核验的方案在项目结束时可能准确，半年后却可能因为产品、组织或政策变化而失效。如果后续任务无法识别时点，正式知识库会给错误信息更强的可信外观。\n\n进入知识空间的内容至少应标明四类元信息：内容负责人决定谁有权确认和更新，适用范围说明面向哪个项目、部门或地区，状态区分草稿、已批准、已归档和已废止，复审或失效条件说明什么时候必须重新核对。动态信息还要记录数据截止日期和来源版本。\n\n复审不等于重新写一遍。负责人可以先让Agent列出自上次确认后发生的来源变化、相关制度更新和被其他文档引用的位置，再判断内容继续有效、需要局部修改还是应当归档。修改后保留版本说明，旧链接如果已经被团队广泛引用，可以显示“已被新版替代”的指向，而不是静默删除。\n\n知识被任务引用时，也要把状态带入结果。草稿只能作为线索，已废止内容不应参与当前结论，超过复审日期的材料应提示人工确认。多个团队对同一术语有不同定义时，不要强行合并成一个模糊解释，而应标明业务范围。"}}}]}, "notes": {"plain": {"content": "接入企业上下文不是终点。只有当分散信息被用于明确任务、形成可核对成果，并在人工确认后回到团队空间，连接才会产生持续价值。下面从常见任务、综合案例和知识沉淀三个层次展开。"}}}, {"id": "cad76ea024405a0ebf3de70e38", "title": "11.4　团队协作中的权限与治理", "notes": {"plain": {"content": "企业上下文能够提高任务相关性，也会放大权限配置不当带来的风险。团队使用时不能只确认“AI能否读取资料”，还要明确访问权限来自哪里、生成内容保存到哪里、管理员能看到哪些记录，以及成员离职或角色变化后权限如何回收。\n\n如果产品继承飞书已有权限，AI原则上只能访问当前账号原本有权查看的内容。但权限继承并不等于可以省略治理：共享范围过大的文档、长期未清理的群组权限和误放入公共知识库的敏感资料，都会沿着既有权限进入任务上下文。组织需要先治理原有信息权限，再讨论AI访问。\n\n关于个人数据、团队数据和不同组织之间的隔离方式，应以产品当期的隐私政策、企业协议和技术说明为准。“数据隔离”是需要核对范围和条件的具体承诺，不能仅凭界面宣传推断。表11-4列出部署前至少需要确认的问题，答案应来自可追溯的产品条款或组织配置。\n\n入口选择应服从工作环境。飞书重度用户可以从协作入口发起需要组织上下文的任务；处理本地文件或个人事务时，独立桌面入口可能更直接。无论从哪个入口开始，都应在任务发起前确认当前登录身份、数据来源和输出位置，避免把个人任务与企业资料混在同一流程中。"}}}]}, "notes": {"plain": {"content": "通用模型能够处理用户主动提供的材料，却未必了解一家组织正在发生什么。企业中的项目进展、协作关系和决策依据，往往分散在聊天记录、共享文档、会议纪要与日程之中。缺少这些上下文，AI即使具备较强的生成能力，也很难形成贴合实际工作的结果。\n\n豆包工作与飞书的连接，正是为了缩短通用能力与企业情境之间的距离。飞书官网对豆包工作的公开说明显示，文档、组织架构、目标与关键成果（Objectives and Key Results，OKR）等工作资产可以在用户本人权限范围内成为任务上下文，生成成果也可以回到飞书继续协作，参见《飞书里的豆包能做什么？》。本章据此分析内容进入、成果回流、知识沉淀和权限边界，不把“连接飞书”理解成默认读取全部组织资料。"}}}, {"id": "ch12", "title": "第12章　生态扩展：从技能复用到多智能体协作", "children": {"attached": [{"id": "6e8361d1ecaf57af9fd6f3b17b", "title": "12.1　技能：把跑通的业务流程沉淀为可复用能力", "children": {"attached": [{"id": "409206999e2f5074860093ad18", "title": "12.1.1　从选择预置技能到创建自定义技能", "notes": {"plain": {"content": "数据清洗、内容策划、文献整理和设计辅助等任务，可以从预置技能开始试用。首次运行仍应查看它会读取什么数据、调用哪些工具以及怎样保存结果，不能因为流程已经打包就省略验收。\n\n当一项任务反复出现、步骤相对稳定且有明确质量标准时，可以制作自定义技能。个人技能保存自己的习惯，团队技能统一多人协作标准，行业技能提供某一领域的通用框架。个人方法升级为团队技能之前，应先经过多次真实任务验证，并指定维护人和版本。\n\n创建技能时，应先写清适用范围和不适用情形，再准备正常、缺字段、格式异常等测试样本。每次修改需要记录版本、变更原因和验证结果；团队技能还应指定维护人和回退版本。只有测试通过后，才将新版本用于定时任务或多人共享流程。"}}}, {"id": "5434829144bb5e34b5d1227297", "title": "12.1.2　配置实例：项目周报校验技能", "notes": {"plain": {"content": "下面以“项目周报校验”为例，把一条已经跑通的人工方法整理成技能配置。这个技能不负责替负责人写主观总结，也不自动发送周报，只负责读取指定材料、形成待确认初稿并报告缺失。表12-1列出该技能需要固定的配置字段、示例值及设置理由。\n\n截至本书操作基线，可以从左侧“技能·连接器·伙伴”进入相关区域。若当前版本提供创建或编辑入口，可按以下顺序配置：先填写名称和适用范围，再录入固定步骤、输出格式与禁止动作；保存为测试版本后，分别使用正常材料、缺少任务清单、指标互相冲突三组样本试跑。三组结果都能按表12-1中的规则停止或交付，才把版本标记为1.0并开放给团队。界面没有独立字段时，也应把这张配置表作为技能说明随版本保存，不能只留下一个难以审查的长指令。\n\n技能发生修改时，不直接覆盖已在运行的版本。先复制为新版本，记录“修改了什么、为什么修改、用哪些样本验证”，通过后再切换；如果定时任务出现异常，可以回退到上一稳定版本，而不是现场继续叠加补丁。"}}}, {"id": "26b1a46488b65e8a8450c9071e", "title": "12.1.3　技能发布前要通过正常、边界和失败测试", "notes": {"plain": {"content": "技能把方法隐藏在一个方便入口之后，也可能把错误稳定地复制给更多人。因此，测试不能只用一份最理想的样本证明“能够运行”，还要主动验证它在材料不完整、规则冲突和工具不可用时是否会安全停止。\n\n正常测试确认标准输入能否得到预期输出，包括文件结构、字段、格式和验收说明；边界测试使用空文件、超大文件、特殊字符、日期边界、重复记录和不同语言，观察规则是否仍然成立；失败测试则故意移除关键材料、撤销权限、提供冲突口径或让目标路径不可写，检查技能是否明确报告问题，而不是生成看似完整的替代结果。\n\n测试样本应脱离真实敏感数据。可以从真实任务抽象字段和结构，再构造允许共享的最小样本；每个样本同时保存预期结果，使新版本能够回归测试。若一个技能只能由创建者凭感觉判断是否通过，就很难成为团队能力。\n\n发布记录至少包含版本号、适用范围、输入变化、规则变化、测试样本、已知限制和回退方法。小的措辞修改也可能改变模型行为，不能因为没有改动字段结构就跳过回归。影响外发、删除、权限或计算口径的修改，应提高版本级别并重新获得责任人批准。"}}}]}, "notes": {"plain": {"content": "生态扩展并不是简单增加功能数量，而是补充方法、数据入口、专业角色或协作机制。图12-1先展示技能、连接器、工作伙伴与工作小队之间的关系。\n\n技能是一组被预先组织好的步骤、模板和质量要求。预置技能提供常见场景的参考流程，自定义技能则用于沉淀个人或团队已经验证的方法。技能数量会随产品更新而变化，选择时应关注维护者、适用范围、所需权限和实际输出，而不是把“数量多”视为价值本身。"}}}, {"id": "803dfc1c5227529db2a1594a03", "title": "12.2　连接器：在授权范围内接入外部系统", "children": {"attached": [{"id": "7afbe5e42ed45187bf3e2d6a8a", "title": "12.2.1　连接器的用途与边界", "notes": {"plain": {"content": "连接器的价值和风险取决于它连接什么系统、允许哪些动作。表12-2按服务类别说明可能的任务，并列出授权前需要核对的事项。\n\n连接器不能自动保证数据正确，也不能绕过外部系统的使用规则。任务应写明数据源、操作对象、输出位置和失败处理；涉及发送、修改或删除时，默认停在执行前确认。"}}}, {"id": "5ec516625f03575db1fbdda28b", "title": "12.2.2　MCP与授权管理", "notes": {"plain": {"content": "部分连接器可以通过模型上下文协议（Model Context Protocol，MCP）等标准方式向AI提供工具。协议标准化有助于系统接入，但“支持同一协议”不等于所有连接器具有相同权限、安全审查和稳定性。普通用户无需理解实现细节，却应能够查看连接器申请的权限和提供方。\n\n连接器授权应遵循最小权限原则：只连接当前任务需要的系统，只开放必要字段或操作，不再使用时及时解除。财务、客户、人事和其他敏感系统在接入前，还应由组织完成供应商评估和合规审批。"}}}, {"id": "d3ec7d0e5b605268848a8d37b1", "title": "12.2.3　配置实例：只读接入客户资料", "notes": {"plain": {"content": "假设销售团队希望读取客户系统中的基础资料，为每周跟进会议生成准备清单，但不允许Agent修改客户记录或自动联系客户。连接器授权页和组织审批单应使用同一组配置字段。表12-3给出这组字段的设置方式和测试方法。\n\n实际配置时，从“技能·连接器·伙伴”进入连接器区域，先核对提供方与所连接的账号，再逐项查看申请权限。授权完成后只运行一个测试客户：先读取允许字段，再主动请求一个禁止字段并尝试一次写入，以验证限制不是停留在说明文字中。测试通过后再扩大到20个对象；任何一步无法确认字段范围、写入能力或日志位置，都不进入正式试点。\n\n连接器停用时，应同时完成三件事：在豆包工作侧解除连接，在外部系统侧撤销令牌或应用授权，检查仍在运行的技能和定时任务是否依赖该连接。只从界面列表中隐藏连接器，不等于访问凭证已经失效。"}}}, {"id": "25618ec7a86858598a9e3b0489", "title": "12.2.4　把连接器当作会失败、会变化的外部依赖", "notes": {"plain": {"content": "连接器接通之后，外部系统仍可能因为令牌过期、接口限流、字段变更、服务中断或组织策略调整而不可用。任务设计如果默认连接永远稳定，就会在失败时把“没有取到数据”误写成“本期没有数据”，或在写入超时后重复创建记录。\n\n接入时应明确一份最小数据契约：使用哪个对象和字段，字段的类型、单位与可空规则是什么，一次允许读取多少，是否支持分页，写入后返回什么标识。外部系统新增字段通常不会影响任务，但删除、改名或改变含义的字段必须触发暂停和重新确认。不能让技能在看不到旧字段时自行寻找名称相近的新字段替代。\n\n读取任务要区分“空结果”和“读取失败”。空结果表示连接正常、查询成功，只是条件下没有记录；读取失败则表示无法确认真实状态。二者在日志、报告和通知中使用不同状态。部分分页失败时，也不能把已经获取的前几页当作完整集合。\n\n写入任务要使用外部系统返回的唯一标识或回执确认结果。网络超时后先查询目标系统，确定记录没有生成再重试；若无法确认，进入待处理状态，由人工检查。更新和删除动作还应记录原值、目标对象和操作人，确保可以恢复或追责。"}}}]}, "notes": {"plain": {"content": "技能回答“怎样做”，连接器回答“可以从哪里取数据、向哪里写结果”。通过连接器，Agent可能访问协作平台、会议、存储、地图或业务系统。具体可用服务随版本、地区和组织配置变化，应以客户端当期列表为准。"}}}, {"id": "e506aa9a6ae950b8a665beb30f", "title": "12.3　工作伙伴与工作小队：从专业分工到协同执行", "children": {"attached": [{"id": "70af093974fe5d9ea0f985b4cc", "title": "12.3.1　角色分工、适用任务与入口选择", "notes": {"plain": {"content": "工作伙伴可以按专业角色理解，但角色名称不能代替能力核验。表12-4从适用任务和验收重点两个方面比较几类常见角色。\n\n专业角色并不意味着结果天然专业。涉及科研、金融、法律、医疗等领域时，输出仍需相应专业人员审核。无法说明方法和证据的“专家结论”，不应因角色名称而获得额外可信度。\n\n普通对话适合探索问题和处理临时需求，工作伙伴更适合边界稳定、方法明确的专业任务。选择前可以先问：是否需要专门工具，是否有固定质量标准，是否会重复使用。如果答案都是否定的，直接对话往往更简单。"}}}, {"id": "e8719dee565355d4ae1cbd1b75", "title": "12.3.2　工作小队：让多个智能体围绕同一交付协作", "notes": {"plain": {"content": "工作小队只适合任务可以清楚分工、子任务能够并行且最终结果可以统一验收的情形。简单任务强行组队会增加沟通、重复和冲突成本。\n\n何时值得组队。\n\n以新品上市方案为例，研究角色可以整理市场与用户资料，数据角色分析规模和历史表现，设计角色形成视觉素材，统筹角色负责检查依赖关系并整合成稿。每个角色都应有明确输入、输出和完成条件；“大家一起想办法”不是可执行的分工。\n\n示例指令\n\n请为“智能水杯新品上市方案”组织工作小队。研究角色输出市场、竞品和用户证据；数据角色只分析我提供的销售与成本数据；设计角色在定位确认后制作三张示意图；统筹角色检查事实冲突并形成方案。各角色先分别提交中间结果，未经我确认不要生成最终对外版本。\n\n协作设计与验收。\n\n小队任务需要处理三类问题：不同角色是否引用同一版本的数据，结论发生冲突时由谁决定，最终文档由谁负责。主任务应保存来源和中间成果，而不是只呈现一份无法追溯的综合文本。"}}}, {"id": "d9a9050039bf5dc3967d5906aa", "title": "12.3.3　配置实例：新品方案工作小队", "notes": {"plain": {"content": "将前述“智能水杯新品上市方案”真正配置为工作小队时，不能只写角色名称。表12-5把每个角色的输入、工具、输出和停止条件固定下来，使统筹角色能够判断子任务是否完成。\n\n配置顺序应遵循依赖关系：研究和数据角色可以并行，设计角色要等定位得到确认，统筹角色最后整合。所有角色共用同一项目名称、时间范围和术语表；中间文件分别保存，不能让统筹角色只接收聊天摘要。试跑时人为放入一处口径冲突，检查数据角色能否停止、统筹角色能否把冲突交给负责人，而不是自行选择一个看似合理的数字。"}}}, {"id": "4693762c179d5653b3dc861035", "title": "12.3.4　用共享任务书和冲突规则控制协作成本", "notes": {"plain": {"content": "多智能体协作最常见的问题不是角色能力不足，而是每个角色对任务的理解略有不同。研究角色采用上季度范围，数据角色使用本季度数据，设计角色又根据早期定位开始制作，最终整合时才发现无法拼合。角色越多，隐含差异越容易被放大。\n\n开始前应建立一份共享任务书，包含项目目标、受众、时间范围、核心术语、输入版本、最终交付物和禁止事项。各角色可以拥有自己的子任务说明，但不能自行修改共享事实。目标或范围发生变化时，由统筹角色更新共享任务书并通知受影响角色，必要时停止已经失效的工作。\n\n中间成果应通过文件或结构化记录交接，而不是只传递一句摘要。研究角色交付来源表和证据状态，数据角色交付计算表、口径和异常，设计角色交付参考与素材权利，统筹角色才能检查内容。摘要可以帮助快速理解，却不能替代承担结论的证据。\n\n冲突规则需要预先确定。事实冲突优先回到来源和时间，口径冲突由业务责任人决定，专业判断冲突应并列呈现各自的依据和风险，视觉偏好冲突由品牌或项目负责人选择。统筹角色可以发现和组织冲突，不能仅为了按时完成而静默采用其中一个结果。"}}}]}, "notes": {"plain": {"content": "工作伙伴是围绕某类专业任务配置的智能体。它可能包含特定指令、工具和输出习惯，使数据分析、资料研究、视觉设计或开发等任务获得更明确的方法框架。角色名称只是入口，真正需要比较的是它的能力范围、工具权限和交付标准。"}}}, {"id": "aca7179938d459d6aed58d7f90", "title": "12.4　生态选型：从最小可用配置开始", "notes": {"plain": {"content": "技能、连接器、工作伙伴和工作小队分别增加方法、数据入口、专业角色和协作复杂度。选型应从一项高频任务开始：先判断内置能力是否足够，只有出现稳定、可描述的缺口时再增加扩展。后面的图表分别给出选择路径和按情境判断的落点。\n\n为了把这条路径用于具体选型，表12-6按使用情境给出建议起点，并列出需要继续增加能力的信号。\n\n每月可以复查三项内容：哪些扩展真正被使用，哪些权限仍然必要，新增能力是否减少了总工作量。套餐和额度也应根据真实用量决定，不应为了使用已购买的功能而制造任务。\n\n生态的价值在于降低重复成本，而不是积累功能。保持配置精简、来源清楚、权限可控，通常比同时启用大量技能和连接器更可靠。\n\n选择扩展能力时，最显眼的是功能和购买价格，容易忽略配置、培训、复核、故障和退出的成本。一个技能如果每次都需要大量人工修正，连接器如果频繁失效，工作小队如果增加多轮协调，即使单次运行很快，也未必降低总工作量。"}}}]}, "notes": {"plain": {"content": "一项项目周报流程由负责人亲自运行时很顺畅，复制给五名同事后却出现了五种结果：有人漏掉风险字段，有人仍在手工搬运客户数据，还有人为了“更智能”同时接入多个工具，反而不知道错误来自哪里。个人偶然跑通一次，并不等于方法已经能够被团队稳定复用。\n\n针对这类问题，可以从四种扩展方式中选择：把验证过的步骤和标准固化下来，称为“技能”；让任务在授权范围内访问外部数据或服务，依靠“连接器”；把一类专业任务交给角色化能力，使用“工作伙伴”；让多个智能体围绕同一成果分工协作，则组成“工作小队”。本章不按功能多少评价这些形态，而是从问题、代价和验收出发，判断什么时候值得增加扩展能力，什么时候保持单一任务反而更可靠。只想复用个人工作方法的读者，可重点阅读12.1和12.4；准备接入业务系统或设计团队协作的读者，还应完整阅读12.2和12.3中的权限、失败与冲突处理。"}}}, {"id": "ch13", "title": "第13章　安全与隐私：从个人授权到组织治理", "children": {"attached": [{"id": "a6a3798f6e9455d7a5e4f956a8", "title": "13.1　从设备接入到操作审计的安全链", "notes": {"plain": {"content": "办公Agent的风险贯穿任务全过程，不能只依靠某一个开关解决。设备身份、访问权限、用量限制、数据保护和操作审计分别控制不同环节，只有组合起来才构成相对完整的防护链。图13-1把这五类检查按任务接入、执行和追溯的顺序排列，便于读者定位安全缺口。\n\n为了把图13-1中的环节转化为可执行的检查，表13-1分别列出每一环节要解决的问题和用户或组织应核对的事项。\n\n这些机制的实际能力应以产品协议、管理员后台和技术说明为准。例如，“使用加密”需要进一步问清是传输、存储还是特定环境；“操作留痕”也要说明记录哪些动作、保存多久、谁有权查看。飞书官网关于豆包工作的公开安全口径，可参见《豆包工作安全吗？企业数据、权限继承与模型训练边界说明》。其中的“沿用用户本人权限”“未经客户授权不用于基础模型训练”等表述仍需结合适用账号、合同和管理员设置理解，不能被扩大为所有场景下的绝对保证。"}}}, {"id": "956d973ef8885e668dce6c52e4", "title": "13.2　显式授权：把权限拆成可理解的决定", "children": {"attached": [{"id": "e1a8a966ec255881a0ad2d0b92", "title": "13.2.1　基础权限、关键确认与最小授权", "notes": {"plain": {"content": "基础权限可能包括屏幕访问、模拟鼠标键盘和指定目录的文件访问。它们决定系统是否能“看见”和“操作”。关键确认则针对发送消息、覆盖文件、删除内容、访问敏感资料或其他不可逆操作，在执行前把决定交还给用户。\n\n授权提示应包含操作对象、影响范围和可撤销性。如果界面只显示笼统的“允许”，用户应先暂停任务，确认实际要做什么。选择“本任务内始终允许”虽然方便，却会扩大后续步骤的自动执行范围，适合规则清楚、对象固定且风险较低的流程。\n\n把上述区分落实到具体设置时，可以归纳为四项原则：\n\n按任务授权：只开放完成当前任务所需的目录、工具和时间范围。\n\n优先只读：能够通过读取完成的任务，不额外授予写入或控制权限。\n\n关键操作单独确认：发送、覆盖、删除和资金相关操作不默认自动执行。\n\n任务结束后复查：检查输出、日志和剩余授权，及时撤销不再使用的连接器。\n\n最小权限并不意味着把所有权限都关闭，而是让权限与任务一一对应。权限过小会导致流程反复中断，权限过大则扩大误操作和数据暴露范围；合理配置需要在小样本试跑中逐步确认。"}}}, {"id": "0e90ea4ab02b5c8fa5436630d4", "title": "13.2.2　配置实例：周报自动化的最小权限方案", "notes": {"plain": {"content": "以第9章的项目周报为例，假设10人项目组每周五生成周报初稿，资料来自固定项目空间，成果先交项目负责人确认，不自动发往外部。管理员后台、连接器授权页和任务设置应能对应到表13-2中的控制项。\n\n配置完成后做四次测试：用正常材料验证能否生成初稿；加入一个无权限文件，确认任务不会读取；把输出目标改到未授权目录，确认写入被拒绝；模拟生成失败，确认维护人能够收到告警。只有四项结果与预期一致，才允许定时运行。所谓最小权限，不是看勾选项是否足够少，而是通过反向测试证明越界操作确实不能发生。"}}}, {"id": "17d6b2a260f15175adae0fdf48", "title": "13.2.3　系统权限不等于模型改进设置", "notes": {"plain": {"content": "“允许操作电脑屏幕”控制的是系统能否观察和操作界面，“帮助模型改进效果”控制的是特定类型的内容数据能否用于模型优化，两者不是同一个开关。关闭前者会限制任务执行，但不自动改变账号的数据训练选择；关闭模型改进也不等于撤销文件、屏幕或连接器权限，更不等于删除历史记录。用户需要分别检查这几类设置。\n\n截至2026年9月3日，豆包官方《帮助模型改进效果FAQ》说明，在隐私保护措施前提下，可能用于模型效果优化的内容数据按类型包括文本对话及回复、上传的图片与文件及相应回复、实时通话和语音输入，以及屏幕共享或视频通话画面。用户可以对相应类型选择退出；关闭后，不再把对应类型的输入内容用于模型效果优化，设置会同步到同一豆包账号。\n\n官方《隐私政策》同时说明，这种用途是“可能使用”，并以安全加密、严格去标识化等措施为前提。因此，不宜笼统表述为“所有隐私数据都会被拿去训练”，也不能把关闭模型改进开关理解为撤销其他系统权限或删除历史数据。"}}}]}, "notes": {"plain": {"content": "授权机制的目的，是让系统在获得足够能力完成任务的同时，不越过用户愿意承担的风险边界。授权至少可以分为基础权限和关键操作确认两个层次。"}}}, {"id": "b5340eea05015ee5a909adfb64", "title": "13.3　操作留痕、管理员治理与安全声明", "children": {"attached": [{"id": "3af83da093bf5604b462ef4c33", "title": "13.3.1　用日志形成事后追溯能力", "notes": {"plain": {"content": "授权解决操作发生前的控制，审计解决操作发生后的核查。有效日志应能回答：谁在什么时间发起了什么任务，系统访问了哪些文件或服务，执行了哪些关键操作，结果保存或发送到了哪里，以及用户何时进行了确认或接管。\n\n判断日志是否足够，不能只看有没有“操作记录”入口，还要核对字段和覆盖范围。最低限度应记录操作时间、发起身份或任务、操作类型、作用对象、结果状态以及确认、中止等关键节点；发生修改时，最好还能追溯变更前后状态。部分日志可能只覆盖特定系统或动作，“可视化”“可回放”也不应被当作默认能力，部署前需要实际测试查询、导出和保留期限。\n\n团队和企业还需要由管理员统一治理。管理能力通常包括成员和设备管理、数据源与连接器范围、风险操作策略、用量配置及审计查看。具体功能会随版本和合同而变化，采购时应以演示环境或书面材料逐项验证。\n\n个人用户同样需要建立基本治理习惯：定期查看已授权目录和连接器，删除不再需要的任务副本，复查异常操作记录，并为重要文件保留独立备份。安全不是安装时完成的一次设置，而是持续维护过程。"}}}, {"id": "2887134a78dd57fdb7848ed610", "title": "13.3.2　如何看待认证、测评与安全声明", "notes": {"plain": {"content": "第三方认证和基准测评可以提供参考，但认证名称本身并不能代替风险评估。引用某项认证时，应同时核对认证机构、证书编号、适用产品与版本、评价范围、有效期以及公开查询方式。无法提供这些信息的“首批”“领先”或“企业级”表述，不宜直接写入正式结论。\n\n认证材料应按表13-3逐项拆解。任何一项无法核对时，只能写成“供应商声明”或“待核验”，不能转写为确定的事实结论。\n\n认证通常只覆盖特定范围：能力测评不一定包含隐私保护，云服务测试也不等于所有连接器都接受相同审查。组织应把认证作为供应商筛选材料之一，再结合数据处理协议、渗透测试、权限设计、事故响应和自身使用场景做判断。\n\n对普通用户而言，更直接的安全证据来自以下可观察机制：目录能否受到限制，关键操作是否需要确认，日志能否查看和导出，账号和设备能否及时退出，以及删除任务后数据如何处理。任何认证都不能替代谨慎授权和人工复核。"}}}, {"id": "3847005dbe2c55e08b56b983aa", "title": "13.3.3　后台核验实例：从一次任务反查权限与日志", "notes": {"plain": {"content": "完成一条测试周报后，管理员不只查看成果，还要把任务记录与授权设置逐项对照。可按下面的顺序核验：\n\n在成员或账号管理中确认发起人属于试点组，且没有临时加入无关角色。\n\n在应用、连接器或数据源授权记录中确认只开放了指定项目空间。\n\n在任务记录中核对实际读取的文件数量、名称和时间，确认没有访问禁止范围。\n\n在操作日志中检查写入目录、文件名和共享范围，并找到项目负责人的确认记录。\n\n在异常或用量记录中确认任务没有重复触发、超出次数或隐式重试。\n\n撤销试点成员权限后再次运行同一测试，确认访问被拒绝且日志留下失败记录。\n\n后台字段名称可能因组织版本而不同，但证据必须回答同样的问题：谁以什么身份，在何时访问了哪些对象，执行了什么动作，结果去了哪里，谁批准了关键步骤。如果管理后台只能给出汇总数量，无法还原到具体对象，应把这一限制写入风险评估，并通过更小的数据范围和更严格的人工确认补偿。"}}}, {"id": "65e84a8fc351583ea11962882a", "title": "13.3.4　数据留存与删除要覆盖所有副本和下游成果", "notes": {"plain": {"content": "用户在界面中删除一条任务记录，并不必然说明相关数据已经从所有位置立即消失。输入文件可能被复制到工作目录，生成结果可能同步到协作空间，日志、备份和外部系统也可能按各自规则保留。判断删除能力时，需要先画清数据实际去了哪里。\n\n一次任务可能产生原始上传、处理副本、中间文件、最终成果、分享链接、操作日志和自动备份。每类对象都应有用途、保存位置、访问者、保留期限和删除方式。组织账号还要核对合同终止、成员离职、管理员导出和监管留存等场景，不能把个人界面的删除入口当作全部答案。\n\n不再需要的数据应按制度处理，但删除也不能破坏必要的审计和业务恢复。比如，客户报告可以删除临时转写和中间截图，正式成果按合同归档，操作日志按安全策略保留；具体期限由业务、法律和安全责任人共同确定。需要长期保留的材料应减少敏感字段并限制访问，不是无限期留在个人任务目录。\n\n删除后最好进行验证：工作目录和回收站是否仍有副本，共享链接是否失效，外部连接器中是否创建过记录，定时任务会不会再次生成同类数据。供应商无法提供明确删除范围和时间时，应把不确定性纳入风险判断，并减少进入该环境的数据。"}}}]}, "notes": {"plain": {"content": "授权解决任务开始前和执行中的边界问题，任务结束后还需要依靠日志、管理员治理和外部证据完成追溯。本节先说明操作记录应回答哪些问题，再讨论如何审视认证、测评和安全宣传，避免把名称或口号误当成完整保障。"}}}, {"id": "4f73bbc93d8e52ebb137de1f54", "title": "13.4　异常发生后：先止损，再调查和复盘", "children": {"attached": [{"id": "35be31dc25da51ba86d742c3ba", "title": "13.4.1　停止任务并确认影响范围", "notes": {"plain": {"content": "发现异常后，应立即暂停相关任务；必要时断开连接器、撤销授权或退出关联账号。如果任务仍可能继续发送、修改或删除内容，应优先切断执行路径。此时不要急于清理全部记录，因为任务日志、文件版本和发送状态是判断影响范围的重要依据。\n\n随后确认四项事实：异常从何时开始，涉及哪些账号、文件和外部对象，哪些操作已经真正完成，哪些仍处于草稿或待提交状态。覆盖文件时先检查历史版本和备份；错误发送时确认接收对象、内容和撤回条件；疑似数据泄露时避免继续复制敏感材料进行排查。\n\n个人用户至少应保留任务时间、操作对象和异常截图。组织场景则应按照既有安全流程联系管理员、信息安全、法务或业务负责人，不能由任务发起者独自决定是否需要通报。"}}}, {"id": "1eef09553a73518089dbdf9f43", "title": "13.4.2　从一次异常修正整条流程", "notes": {"plain": {"content": "恢复文件或停止外部影响后，还要找到异常为何没有被前面的控制发现。是数据范围写得过大，权限没有及时回收，指令缺少停止条件，还是高影响操作没有设置人工确认？复盘的目标不是简单归咎于用户或系统，而是把原因转化为可执行的改进。\n\n一份基本的事件记录应包含发生时间、发现方式、影响对象、已采取措施、恢复状态、根本原因和后续负责人。涉及长期自动化时，还应暂停同类任务，检查是否共享同一错误规则；涉及团队模板或技能时，修订版本后再恢复使用，避免错误继续复制。\n\n只有当业务恢复、影响范围确认、相关人员得到通知并且控制措施已经更新，异常处置才算结束。日志在这一过程中既是追溯依据，也是改进流程的材料。"}}}, {"id": "2e7243a05c785a3a86b1bda91b", "title": "13.4.3　通过桌面演练验证停止、通知和恢复路径", "notes": {"plain": {"content": "应急流程如果从未演练，真正发生异常时往往会发现权限找不到、日志无法导出、责任人已经变化或备份不可用。小型桌面演练不需要制造真实事故，只需用测试账号和模拟数据，验证团队能否按既定顺序完成处置。\n\n可以设计一个场景：周报自动化意外选择了错误项目目录，并准备把含内部测试数据的草稿写入共享空间。演练从告警出现开始，不让任务真正外发。参与者需要暂停任务、撤销连接、确认已读取和已写入对象、保存必要日志、通知业务与安全负责人，并从备份或版本记录恢复正确状态。\n\n观察重点不是谁操作最快，而是信息是否足够。告警能否说明任务和影响对象，值班人员是否知道谁有权停用，管理员能否找到授权和日志，业务负责人能否判断数据敏感度，恢复后能否证明错误草稿没有继续共享。任何一步依赖某个成员的个人记忆，都应转化为可查的流程或清单。\n\n演练结束后记录发现的问题、改进措施、负责人和完成期限。例如，日志只有汇总数量，就需要增加目标目录的记录；撤销连接后定时任务仍不断重试，就要同步暂停下游任务；备份无法打开，则要修正备份和恢复测试。改进完成后再做一次短回归演练，确认问题真正解决。"}}}]}, "notes": {"plain": {"content": "权限、确认和审计能够降低风险，却不能保证异常永远不会发生。任务读取了错误目录、覆盖了文件、把内容发给错误对象，或者连接器出现异常访问时，处理顺序比解释原因更重要：先停止影响继续扩大，再保留证据、通知相关人员并恢复业务。"}}}, {"id": "76015c7280a35b78b6ad5eabe9", "title": "13.5　按组织需求选择配置并完成部署检查", "children": {"attached": [{"id": "f863bdcb569a5cca86c0290462", "title": "13.5.1　完整部署实例：10人项目组试点", "notes": {"plain": {"content": "一个可控试点不从“给10个人开通账号”开始，而从业务场景和停止条件开始。本例选择周报初稿，因为输入固定、结果容易核对、外部影响有限。表13-5把完整部署分为五个阶段，并标明每一阶段的责任与通过标准。\n\n试点应预先写明停止条件，例如连续两次读取错误项目、出现未经确认的外部发送、关键日志无法取得或人工返工超过原流程。触发条件后先暂停，不用“再观察一段时间”替代止损。决定扩大使用时，也只增加已经验证的成员和数据范围，不一次开放到整个组织。\n\n版本名称和具体功能可能调整，因此本节不对个人版、团队版或企业版作固定功能承诺。采购与部署应以当期合同、产品文档和组织自身的安全评估为准。"}}}, {"id": "eb6be3739d5c58b3893483f1e0", "title": "13.5.2　部署放行清单", "notes": {"plain": {"content": "试点进入扩大使用前，应由业务负责人、安全或合规负责人和系统管理员分别确认表13-6，不用一次笼统的“同意上线”代替具体责任。\n\n任何一项尚未明确，都应保留试点范围或暂停上线。通过清单也不是永久放行；场景、数据源、成员、连接器或产品条款发生变化时，需要重新核验受影响项目。\n\n治理规则只有进入具体工作才会显出是否有效。同一项读取、生成或写入能力，放在销售跟进、财务分析、内容发布和招聘筛选中，会产生完全不同的影响与责任。第14章将把本章的安全门槛带入岗位流程，观察它们怎样约束真实交付。"}}}]}, "notes": {"plain": {"content": "个人、团队和大型企业在协作人数、数据敏感度和合规责任上差异明显，不宜仅按版本名称选择产品。更稳妥的方法是先列出需求，再核对当前套餐或企业方案是否满足。\n\n团队与企业方案的名称、功能和服务承诺具有版本及合同属性。选型时不直接比较宣传页上的版本名称，而从权限、数据、审计和运行保障等方面核对真实需求。表13-4按组织规模列出三类使用情境的核对重点。\n\n在这些标签之外，表13-4回到个人、小型团队和受监管组织的真实需求，分别比较权限、审计、数据、成本与运行保障，作为选型核对依据。"}}}]}, "notes": {"plain": {"content": "一个周报任务只需要读取项目资料，却申请了整个文档目录；它只应生成草稿，却同时获得了写回协作平台的权限。最终结果即使没有出错，也不能证明这样的配置安全，因为真正的问题藏在任务尚未触发的路径里：它还可能读到什么、写到哪里，发生异常时能否及时停止和追查。\n\n因此，安全不是任务结束后的附加检查，而是从设备接入、权限授予、数据流转到操作留痕和异常恢复的一连串决定。本章将把笼统的“安全可信”拆成可以核对的机制，说明个人、团队与企业分别要确认什么。个人读者可先掌握13.1、13.2和13.4中的基本防护与止损方法；负责团队部署、审计或合规的读者还应完整阅读13.3和13.5。"}}}]}, "notes": {"plain": {"content": "一个人使用AI时，最常问的是“结果好不好”；当一个团队开始共同使用，问题很快会变成“它读取的是哪一版资料”“谁允许它访问这个空间”“生成结果写回哪里”“方法失效后由谁维护”。个人试用中可以靠经验补救的细节，进入组织后都可能变成版本冲突、权限风险和责任空白。\n\n市面上大量内容教个人怎样写提示词，却很少说明一项能力怎样被团队重复使用。组织真正需要的，不是每位成员各自保存一套“神奇指令”，而是让资料来源、授权范围、配置版本、交付位置和责任人都能够被说明、复核和调整。本篇要解决的，是AI从个人技巧变成组织能力时必须补上的治理条件。\n\n本篇面向准备在团队中引入AI的业务负责人、项目管理者、知识管理人员，以及参与权限、安全和技术支持的同事。第11章讲企业上下文怎样在授权范围内进入任务；第12章辨析技能、连接器、工作伙伴和工作小队各自解决什么问题；第13章处理授权、审计、异常处置和部署检查。普通成员可先掌握任务边界与授权原则，管理和技术角色则应完整阅读三章。"}}}, {"id": "808e3e2301995fc4a61a21617b", "title": "第五篇　岗位实践与展望篇", "children": {"attached": [{"id": "ch14", "title": "第14章　岗位与业务场景：典型工作的AI协作流程", "children": {"attached": [{"id": "465ea7e224e45ccb97bb34d963", "title": "14.1　通用交付：让不同成果共享事实与验收规则", "children": {"attached": [{"id": "b49951ef65195ad1bad260082f", "title": "14.1.1　办公交付链：从事实底稿到方案与汇报", "notes": {"plain": {"content": "工作汇报。\n\n汇报质量首先取决于日常材料是否完整。AI可以从周报、会议纪要和项目记录中提取目标、进展、问题和数据，但“这项成果为什么重要”仍需由汇报人解释。把材料积累与临时写作分开，可以减少汇报前依赖回忆和补造细节的情况。\n\n示例指令\n\n请基于本季度周报和项目纪要生成季度汇报初稿。按“目标—完成情况—关键成果—问题与原因—下季度计划”组织；所有数字标注来源，没有材料依据的内容列入“待补充”，不要自行推断。先输出大纲，确认后再形成正文。\n\n项目方案。\n\n方案不是篇幅更长的文案，而是对问题、约束、选择和风险的系统表达。适合交给AI的部分包括整理背景、搭建结构、汇总备选方案和统一格式；目标取舍、资源承诺及最终推荐仍应由项目负责人确认。\n\n示例指令\n\n请读取工作目录中的需求记录、预算表和会议纪要，起草项目实施方案。先列出已确认事实、待确认问题和三种备选路径，再按“背景—目标—范围—方案比较—推荐方案—里程碑—资源—风险”生成大纲。没有证据支持的数字不得写入正文。"}}}, {"id": "43c25662bcb3570d84a03f76b5", "title": "14.1.2　软件交付链：生成、调试、审查与文档缺一不可", "notes": {"plain": {"content": "程序开发也是一种从需求到正式交付的知识工作。AI可以根据明确要求生成样板代码、测试用例和接口调用，也可以解释错误、辅助定位问题并起草技术文档；但需求理解、架构取舍、安全审查和上线责任仍应由开发团队承担。\n\n程序开发可以按表14-2划分为四个相互衔接的环节。生成代码之后必须经过真实环境测试，自动审查也不能替代同事评审和安全测试，文档则应与最终实现保持一致。\n\n采用AI生成或修改代码时，应限定仓库与文件范围，说明语言、版本、接口和测试要求，并要求系统报告改动内容。涉及依赖安装、数据迁移、生产配置或安全敏感代码时，需要更严格的人工复核和回退方案。"}}}, {"id": "8e26f189cb3455df8122901c8e", "title": "14.1.3　会议交付链：从会后事实到成套成果", "notes": {"plain": {"content": "假设一次跨部门项目会议结束后，需要在当天形成正式纪要、行动项台账、管理层摘要和内部同步PPT。这个任务不是把同一段文字改成四种格式，而是让四类成果共享同一组经过确认的事实，同时分别服务于执行、决策和沟通。\n\n第一步，盘点会议议程、录音或转写、参会人名单及会前材料，列出缺失和冲突信息。第二步，从记录中提取议题、明确决议、不同意见和待确认事项；没有责任人或截止时间的行动项不得补造。第三步，由会议负责人确认决议和行动项，再以确认结果为唯一事实底稿。第四步，从底稿分别生成正式纪要、可持续更新的行动台账、只保留关键结论与风险的管理层摘要，以及面向执行团队的同步PPT。第五步，逐份检查受众、权限、来源、文件名和版本，并把未决事项随交付物一起说明。\n\n示例指令\n\n请先读取本次会议议程、转写记录和会前材料，列出实际使用的文件及时间。第一轮只输出“明确决议、行动项、不同意见、待确认问题”，每一项附原文依据；不要自行补充负责人、日期或结论。待我确认事实底稿后，再分别生成正式纪要、行动项表、管理层一页摘要和10页以内的内部同步PPT。各文件使用同一项目名称和版本日期，保存到指定输出目录，不覆盖原始材料。"}}}, {"id": "4daf67976fd155b78f934b3f79", "title": "14.1.4　把岗位经验整理成一张流程卡", "notes": {"plain": {"content": "把前面案例迁移到其他岗位时，不应从“这个岗位可以使用哪些AI功能”开始，而应先选择一项边界清楚的真实工作，画出当前流程。流程卡只需要回答七个问题：任务由什么触发，输入从哪里来，哪些步骤重复发生，哪些节点需要专业判断，输出交给谁，常见异常是什么，完成由什么证据证明。\n\n以季度汇报为例，触发条件是季度结束，输入包括周报、财务数据和项目纪要，重复步骤是材料归集、数据整理和页面初稿，专业判断集中在成果价值、问题原因和资源诉求，输出交给管理层，常见异常是口径不一致与材料迟到，完成证据则是经过负责人确认的PPT及来源清单。只有这些信息明确，才知道AI应介入哪里。\n\n接下来标出三类边界。第一类是可直接委托的规则工作，例如按字段汇总、查找引用和套用已批准版式；第二类是可以辅助但必须确认的判断工作，例如提出原因假设、比较备选方案和生成对外文案；第三类是不得自动完成的责任动作，例如批准预算、评价人员、签订合同和正式发布。岗位不同，分类结果也不同，不能用一张通用清单代替。"}}}]}, "notes": {"plain": {"content": "本节安排的是三条并列的交付链，而不是把PPT、程序开发和会议纪要拼成一个案例：办公交付链关注纪要、方案与汇报如何共享事实，软件交付链关注代码、测试、审查与文档如何共同完成，会议交付链关注一次会议如何形成面向不同受众的成套成果。第5章讨论的是同一活动内容在海报、网页和PPT之间的媒介适配；本节进一步讨论事实、责任和验收规则怎样跨交付物保持一致。\n\n为了让不同岗位采用同一套分析尺度，表14-1先从输入、可委托工作、人工关口和交付物四个方面给出全章场景地图。\n\n产品经理是把这些通用能力串成流程的典型岗位。需求收集、需求分析、产品需求文档（Product Requirements Document，PRD）、评审跟进和上线复盘构成一条连续链路。AI可以辅助整理和起草，但优先级、范围承诺和上线决定仍由负责人承担。"}}}, {"id": "c3f9c8f05a045c2b8f88354184", "title": "14.2　销售与客户拓展：把对话转化为下一步行动", "children": {"attached": [{"id": "fb7ba3d3213c5c7c9cae057747", "title": "14.2.1　端到端案例：从沟通记录到客户跟进", "notes": {"plain": {"content": "客户跟进卡应区分事实、判断和建议。客户明确说过的话属于事实，意向等级是基于材料的判断，下一步动作则是建议；三者混在一起，会让销售团队误把模型推测当成客户承诺。\n\n示例指令\n\n请分析这份客户沟通记录，提取核心诉求、关注点、明确异议、双方已承诺事项和待办。为每条信息附上原文依据；意向度只作为“分析建议”，说明判断理由。输出客户跟进卡，并把负责人、截止时间不明确的事项标注为“待确认”。\n\n在获得人工确认后，可以把待办写入任务系统或日程，并依据产品资料生成FAQ、异议处理思路和会议准备清单。任何涉及报价、合同条件和对外发送的内容，都应停在提交前由销售人员复核。AI负责让信息完整、格式一致，人负责关系、承诺和临场判断。\n\n一条完整的线索跟进流程可以这样运行：沟通结束后，先保存有权使用的聊天记录或会议纪要；Agent提取客户背景、明确诉求、异议、已承诺事项和缺失信息，形成待确认的跟进卡；销售人员补充线下情况并确认下一步动作；系统再根据确认内容生成会议邀请草稿、产品资料清单和下次沟通提纲；下一次交流后，将新事实增量写入原跟进记录，而不是另建一份互不关联的总结。"}}}, {"id": "414359d664995475832a5589b6", "title": "14.2.2　让每次客户接触都回到同一条事实链", "notes": {"plain": {"content": "客户跟进容易产生多份互相矛盾的记录：会议纪要写了一个日期，销售在群里又给出另一承诺，客户系统只保留一句摘要。建立事实链的做法是为每个客户机会维护一个经过确认的当前状态，并把每次新增沟通作为事件追加，而不是反复重写历史。\n\n每次接触后，Agent先提取明确陈述、待确认事项、双方承诺和下一步草案，并附原文位置。销售人员核对后，只有经过确认的内容进入客户系统；意向等级、成交概率和风险判断使用独立字段，说明依据与更新时间，不能伪装成客户原话。\n\n报价、折扣、交付日期和功能承诺应与正式产品及审批记录核对。若客户提出的新需求超出当前材料，跟进卡只记录“客户提出”，不能自动写成“公司可以支持”。对外邮件或会议邀请先生成草稿，收件人、附件、金额和承诺由销售负责人确认后发送，并保留发送版本。\n\n下一次会议准备时，系统读取当前状态和未完成行动，不重新从全部聊天中猜测。已经关闭或被后续事实替代的事项保留历史状态，防止旧承诺再次出现。销售流程由此从“每次写一份总结”转变为可追溯的连续记录，AI承担整理，人继续承担关系与承诺。"}}}]}, "notes": {"plain": {"content": "销售资料往往散落在聊天、电话纪要、邮件和客户系统中。AI更适合整理信息和维护行动清单，而不应替销售人员判断关系强弱或直接作出承诺。本节把客户诉求提取、跟进安排和销售素材放在同一条流程中。"}}}, {"id": "4ea04aa111295c82a540eedce9", "title": "14.3　运营与财务：从数据台账到经营诊断", "children": {"attached": [{"id": "768064022f485163bff6203e9e", "title": "14.3.1　从经销台账到经营与财务分析", "notes": {"plain": {"content": "经销数据。\n\n订单、库存、回款和沟通记录来自不同系统时，应先建立统一字段和关联键，再进行对账。AI可以标记缺失、重复、逾期和无法匹配的记录，但不能为了让表格“完整”而自动填补未知数据。\n\n示例指令\n\n请读取「订单」「库存」「回款」三个文件，以经销商编号和订单编号为关联键，生成统一台账。保留原始记录，无法关联的行单独输出；按合同约定标记逾期回款，但不要自动认定违约。先处理一个区域作为样本，确认口径后再处理全部数据。\n\n预警规则需要由业务部门定义，包括时间范围、金额阈值、例外情况和通知对象。AI可以按规则持续检查，却不应把异常标记直接等同于责任结论。\n\n销售运营。\n\n经营诊断应从“发生了什么”逐步走向“可能为什么”和“可以做什么”。AI可以计算目标完成率、趋势和渠道差异，并根据数据提出原因假设；业务人员需要结合市场活动、客户结构和组织变化验证这些假设。\n\n示例指令"}}}, {"id": "3f3bd2dd5a6f521da642566baa", "title": "14.3.2　让经营分析回到对账、解释和行动三条线", "notes": {"plain": {"content": "运营与财务数据常在同一份报告中出现，但三类工作不能混成一步。对账线确认数据是否完整一致，解释线区分事实与原因假设，行动线才决定由谁采取什么措施。前一条线没有通过，后面的结论就只能保持待确认。\n\n对账从总量和明细两个方向进行。订单、出库、开票和回款之间应说明关联关系，匹配失败和跨期记录单独列出；汇总金额一致后，再抽查大额、负值、零值和期末边界。Agent可以执行规则，却不能用删除异常行的方式让勾稽关系看起来成立。\n\n解释阶段先写数据事实，例如“库存周转天数较上月增加”，再列可能原因和缺失证据。季节变化、促销结束、补货提前和统计口径调整都可能产生相同现象。业务负责人补充现场信息后，才能决定哪些解释进入正式报告。\n\n行动阶段把建议转化为负责人、时间、验证指标和停止条件。对于异常金额，优先核对源单据；对于经营问题，可以设计小范围调整。涉及正式账目、客户扣款或人员责任时，必须走既有审批和专业复核。报告交付时保留数据快照、处理日志、对账结果和未决事项，使下一周期能够比较真实变化，而不是重复争论口径。"}}}]}, "notes": {"plain": {"content": "经销管理解决的是数据归集和异常发现，销售运营解决的是指标解释和行动选择。两者共用同一条数据链，因此没有必要拆成两个孤立的大节：只有先统一口径和台账，后续诊断才有可靠基础。\n\n运营与财务共用数据整理和异常识别能力，但对数据解释和正式结论的责任不同。表14-3把三类子场景放在同一条数据链中，便于确定自动处理的边界。"}}}, {"id": "d23b7ea58a825828b5ee6fb317", "title": "14.4　内容运营：把创作链变成可复盘流程", "children": {"attached": [{"id": "423724f89948538fae07ff8b55", "title": "14.4.1　端到端案例：从选题研究到多模态成稿", "notes": {"plain": {"content": "一条完整流程可以从近期内容数据和用户反馈中寻找问题，再由编辑确定选题角度。随后，AI整理资料、起草结构和制作配图，编辑则负责事实核查、观点立场和最终表达。\n\n示例指令\n\n请基于近30天账号数据、评论反馈和我提供的行业资料，整理10个候选选题。每个选题说明目标读者、要解决的问题、已有证据和可能的同质化风险。不要直接追逐单一平台热度；我确认选题后，再分别生成文章大纲、配图需求和短视频分镜。\n\n定时任务可以周期性汇总阅读、互动和转化数据，但复盘不能只看总量。需要同时观察内容主题、标题方式、发布时间和受众反馈，并记录哪些变化来自外部事件。AI负责整理模式，内容负责人决定下一轮实验，不把相关性直接解释为因果关系。\n\n如果一次活动需要同时发布长文、海报和短视频，内容团队可以先建立一份发布底稿。底稿只保留已确认的活动名称、对象、日期、地点、权益、报名方式和必要限制，每项信息指定负责人；创作任务从底稿派生，而不是让不同人员分别从聊天记录中复制。选题和角度确认后，长文承担完整解释，海报突出识别与行动，短视频负责建立场景和兴趣，三种媒介不必重复同样的信息密度。"}}}, {"id": "bb8e37392e485fa9a9b9174028", "title": "14.4.2　视觉设计：让AI扩展方案，不替代设计判断", "notes": {"plain": {"content": "设计任务可以把AI用于概念探索、情绪板、配色与构图参考，也可以辅助生成界面组件、图标、版式和不同尺寸的素材。开始前应明确品牌规范、使用媒介、尺寸、版权与可编辑格式，避免生成大量方向相近却无法交付的图片。\n\n设计工作可以分成创意探索、设计细化和素材处理三个层次，各层验收标准不同。表14-6列出每个层次的AI工作、设计师检查事项和交付证据。\n\n设计师仍需负责审美取舍、品牌一致性和最终文件质量。带有商标、人物肖像、字体或第三方素材的作品，在公开或商业使用前必须再次核对权利范围。"}}}, {"id": "4a693ed170295592804158b0cf", "title": "14.4.3　把内容复盘设计成可以推翻假设的实验", "notes": {"plain": {"content": "内容数据容易诱发过度解释。一篇文章阅读量高，可能来自选题、标题、渠道推荐、发布时间或外部事件；只比较两篇内容就宣布某种形式有效，下一轮往往难以复现。复盘应先提出假设，再说明怎样收集能够支持或推翻它的证据。\n\n例如，团队假设“具体案例比概念介绍更能促进课程报名”，可以选择相近受众和渠道的内容，控制发布时间与推广资源，预先确定观察指标和周期。阅读量只能说明曝光，收藏、落地页访问和有效报名分别反映不同阶段；如果指标没有变化，就应接受假设暂未得到支持。\n\nAgent适合归集多渠道数据、统一主题标签和发现异常，但标签规则、样本可比性与业务解释必须由编辑确认。表现较差的内容不应自动删除，表现较好的形式也不宜无限复制。每轮实验只改变少数关键因素，记录外部事件和执行差异，才能逐步积累真正可用的内容经验。\n\n复盘结论进入下一轮选题时，要注明适用范围和有效期。平台机制、用户结构和传播环境都会改变，过去的高表现规律不是永久规则。把不确定性保留下来，比用单次相关性制造“爆款公式”更有价值。"}}}]}, "notes": {"plain": {"content": "内容运营同时包含选题、资料、观点、文案、视觉、发布和复盘。AI可以缩短资料收集和初稿制作时间，但持续产出并不等于批量生成：没有明确受众和编辑判断，越快的生产只会带来越多同质内容。\n\n内容策划、数据分析和用户增长必须形成闭环：策划提出要验证的受众与问题，数据分析解释实际反馈，增长动作再把结论转化为下一轮实验。市场调研、竞品分析和营销策划也应接在同一条证据链上；市场规模测算、优势、劣势、机会与威胁分析（Strengths, Weaknesses, Opportunities and Threats，SWOT）、关键意见领袖（Key Opinion Leader，KOL）筛选和投资回报率（Return on Investment，ROI）评估，都需要明确数据源、时间范围与判断口径。\n\n内容运营应把选题、制作、发布和复盘连成闭环，而不是只增加内容数量。表14-5为每个阶段规定输入、AI任务和编辑检查，后续案例在此基础上展开。"}}}, {"id": "4f8c7d6bddd65f4dbfd973de87", "title": "14.5　人才与教育：效率必须服从公平和专业责任", "children": {"attached": [{"id": "6d51c94e37ea56b4b2c0dd7061", "title": "14.5.1　人才与教育：整理材料，不替代专业判断", "notes": {"plain": {"content": "人力资源。\n\nAI可以从简历中提取经历、技能和项目，按统一字段生成候选人比较表，也可以根据岗位要求提供面试问题建议。筛选标准应与岗位直接相关，并定期检查是否对性别、年龄、地域等无关特征产生系统性偏差。\n\n示例指令\n\n请根据岗位说明提取候选人的相关经验、技能证据和待核实问题，生成面试准备表。不得根据性别、年龄、婚育、照片等信息评分；不自动淘汰候选人，不给出录用结论。处理完成后删除临时副本，并保留字段提取和人工复核记录。\n\n教育培训。\n\n课件模板复刻、练习题初稿和成绩数据整理适合批量处理，但课程目标、难度梯度、课堂互动和个体支持仍需教师设计。学情分析尤其要避免给学生贴上固定标签；分层只能用于调整教学，不应成为限制机会的结论。\n\n示例指令\n\n请基于课程目标、已确认课件模板和三组不同基础的学习者情况，分别生成课件大纲与练习建议。保持版式一致，但调整案例、解释深度和练习难度。所有学情结论标注数据范围，不对单个学生作能力定性，最终内容由教师审核。"}}}, {"id": "5eebfad9913c52b5b2e8d51974", "title": "14.5.2　高影响场景要检查标准、差异和申诉路径", "notes": {"plain": {"content": "当结果会影响录用、培训机会或学习支持时，普通的“人工最终确认”仍不够。组织还要确认使用标准是否与任务相关，系统是否对相似材料给出稳定处理，哪些群体可能受到不利影响，以及当事人怎样更正事实或提出异议。\n\n招聘材料结构化时，可以用一组经脱敏的样本比较字段提取是否一致，检查系统有没有把照片、姓名、年龄或学校声誉转化为隐含评分。教育场景则要避免把一次作业、单一考试或缺失数据解释为稳定能力。无法说明来源和理由的标签不进入正式记录。\n\n人工复核者需要看到原始证据和系统处理过程，而不只是一个分数或推荐。发现事实错误时应能够更正，重大决定仍按组织制度由有权人员作出并记录依据。使用者还要知道AI参与了哪些环节，避免把技术输出包装成完全客观的专业判断。\n\n定期抽查不同群体和边界样本，记录纠正率、申诉和实际影响。若流程无法提供解释、更正或停止机制，就不应因为节省时间而进入高影响决定。技术可以协助准备材料，但机会与权益必须由清楚、可质疑的制度保护。"}}}]}, "notes": {"plain": {"content": "简历与学情材料都包含个人信息，也都会影响他人的机会。它们可以使用相似的整理、比较和生成能力，却必须比普通办公任务设置更严格的数据边界和人工复核。本节分别讨论人力资源与教育培训两个场景。\n\n人力资源和教育任务可以共用材料整理能力，但数据范围、决定权和解释责任必须单独规定。表14-7用于在任务开始前划清边界。"}}}]}, "notes": {"plain": {"content": "工具的能力只有进入具体岗位和业务流程，才会形成可衡量的工作价值。文档、演示文稿、数据分析、调研、自动化与协作连接并不是彼此孤立的功能；在真实场景中，它们往往围绕同一个目标连续组合，并受到行业知识、组织规范和责任边界的共同约束。\n\n本章选择多类具有代表性的岗位与业务场景，观察豆包工作的不同能力如何被重新组织为完整流程。各案例既呈现任务从输入到交付的关键步骤，也分析人工判断应当介入的位置。更重要的是，这些案例提供了一种通用思路：先拆解工作，再匹配能力，由此形成适合具体职责的协作方式。"}}}, {"id": "ch15", "title": "第15章　未来展望：从生成内容到完成工作", "children": {"attached": [{"id": "77bb4aadad3858ee84eef0e37b", "title": "15.1　人机分工：从操作软件到管理任务", "children": {"attached": [{"id": "83d505e5d62053f0bab9c2e9ba", "title": "15.1.1　执行边界正在重新划分", "notes": {"plain": {"content": "人机分工不能只用“谁更高效”来判断，还要区分执行、判断和责任。表15-1沿着一项工作的主要环节说明双方更适合承担的部分。"}}}, {"id": "a4e1a345023d5433b14da994c5", "title": "15.1.2　人的价值转向目标、标准与责任", "notes": {"plain": {"content": "当执行成本下降后，提出什么问题、什么结果算好、哪些风险不可接受，会变得更加重要。使用者需要把隐性的经验转化为可以说明的目标和验收标准，同时保留在关键节点否决、修正和承担责任的能力。\n\n因此，AI素养不只是会写指令，还包括任务拆解、证据判断、数据意识、权限管理和结果沟通。不会操作某个按钮可以通过界面学习解决，缺乏目标与判断则会让更强的执行能力放大错误方向。\n\n可以用“造工具、会用工具、不会用工具”概括三种参与状态。图15-1提醒我们：技术变化不仅催生开发工具的新角色，也要求更多专业人员学会选择和管理工具。不过，这三类不是固定身份，更不代表能力高低；同一个人可能在熟悉领域善用AI，在陌生领域仍处于学习阶段。\n\n工具使用能力必须与专业判断结合。图15-2以杠杆关系说明AI工具与行业经验如何相互作用。领域知识帮助使用者识别错误、提出约束和制定验收标准；反过来，AI也可以辅助查找资料和比较方案，但不能自动赋予经验或承担专业责任。"}}}, {"id": "31468ea42ff25ba7b2685b6867", "title": "15.1.3　从岗位名称回到任务组合", "notes": {"plain": {"content": "讨论“某个岗位会不会被AI改变”时，岗位名称往往过于笼统。同一岗位同时包含信息搜集、材料整理、专业判断、关系沟通、责任签署和异常处置，不同任务受到技术影响的程度并不相同。更实用的方法，是把岗位拆成具体任务，再判断哪些步骤可以重组。\n\n可以连续记录两周工作，给每项任务标注频率、耗时、输入稳定性、判断强度、错误后果和交付对象。高频、规则清楚、结果容易核验的步骤适合优先试点；低频但材料整理繁重的任务可以让AI辅助准备；涉及价值判断、个人权益、谈判和正式承诺的部分，则保留人类主导。\n\n拆解后会发现，改变常常发生在任务之间的接口。例如，分析人员不再手工复制每张表，却需要定义统一口径并审查异常；项目经理减少整理会议记录的时间，却要更清楚地确认决议和责任人；设计师可以快速探索更多视觉方向，同时要加强品牌、事实和权利审核。工作并非只是“少做一部分”，而是把注意力移动到定义和验收。"}}}]}, "notes": {"plain": {"content": "前面的章节展示了AI如何进入文件、数据、调研和协作流程。把这些场景放在一起，可以看到人的工作并没有消失，而是从亲自完成每个步骤，逐渐转向定义目标、提供上下文、控制风险和验收结果。"}}}, {"id": "50607e88736f534c8e4d59c5a4", "title": "15.2　效率不只来自提速，更来自重构工作流程", "children": {"attached": [{"id": "e920f64c05b45838a14e019e4f", "title": "15.2.1　先识别效率来源，再建立可比较的基线", "notes": {"plain": {"content": "效率提升通常来自五种变化。第一，批量检索和整理减少了重复阅读；第二，初稿生成降低了从空白开始的成本；第三，并行任务缩短了必须串行等待的时间；第四，定时流程减少了重复触发和搬运；第五，模板、技能和知识库使已经验证的方法可以复用。\n\n这些变化并不保证最终交付一定更快。如果输入材料混乱、任务目标反复变化，或产出需要大量事实纠错，前期节省的时间可能在返工中被抵消。速度只能与质量、风险和成本一起衡量。\n\n评估一项AI流程，可以先记录人工完成同类任务的基线，再比较试运行后的总投入。至少应统计准备材料、运行等待、人工修改、事实核验和异常处理的时间，同时记录错误率、返工次数和资源消耗。表15-2把这些指标转化为评估时需要回答的问题。\n\n只有在同类任务上持续观察，才适合形成“节省多少”的结论。对于决策、谈判、创意方向等任务，价值也未必表现为时间缩短，可能体现为获得更多备选方案或更充分的证据。"}}}, {"id": "5fe531b0b3965acf93538bb400", "title": "15.2.2　用对照、周期和质量阈值形成可信评估", "notes": {"plain": {"content": "一次表现出色的演示不能说明流程已经稳定，一次失败也不能说明方法没有价值。效果评估需要尽量选择可比任务，观察多个周期，并在开始前定义质量底线。否则，团队很容易只记住最快的一次，把准备和返工排除在外。\n\n建立基线时，选取任务范围、材料规模和交付标准相近的历史记录；没有历史数据时，可以先完整执行一次人工流程。记录从收到材料到通过验收的总时长，其中区分准备、执行、等待、复核和返工。质量则记录事实错误、格式问题、遗漏和一次验收通过率，不能只让参与者主观评分。\n\n试点期间保持核心条件可比。若AI版本同时获得了更完整的数据、更宽松的截止时间或更少的输出要求，结果不能直接与人工基线比较。无法完全控制的现实变化应记录在案，结论写成条件性判断。对创意和决策辅助任务，可以增加方案覆盖、证据充分度和使用者采纳等指标，不勉强折算为节省分钟数。\n\n质量阈值先于速度收益。例如，财务汇总要求关键金额零差错，研究报告要求重要主张可追溯，客户邮件要求收件人和承诺全部核对。试点如果没有达到门槛，即使更快也不能扩大；达到门槛后，再比较人工投入、成本和可复用性。"}}}]}, "notes": {"plain": {"content": "关于AI办公的讨论常使用“数倍提效”这样的概括，但单一倍数很容易误导。效率取决于任务类型、材料质量、返工次数、核验成本和使用者熟练程度，同一工具在不同组织中可能得到完全不同的结果。"}}}, {"id": "a7de95b76620531893ee6c7009", "title": "15.3　AI办公成熟度：从个人使用到组织能力", "children": {"attached": [{"id": "18498db2489757f4beb527dee1", "title": "15.3.1　五级成熟度模型", "notes": {"plain": {"content": "为便于把图15-3中的层级用于自我评估，表15-3进一步说明各等级的主要特征和常见问题。\n\n个人不必追求最高等级。对于任务较少的自由职业者，稳定的L2或L3可能已经足够；大型组织如果直接追求复杂系统，却没有清晰数据和流程，反而会把原有混乱自动化。\n\n评估时应看多数真实任务处于哪一层，而不是看是否体验过某个高级功能。从L1到L2，重点是选择边界清楚的任务并建立验收习惯；从L2到L3，重点是把重复方法沉淀为模板和可撤销流程；从L3到L4，需要治理数据、权限、连接器和知识回流；进入组织级，则必须补充制度、培训、审计与持续评估。\n\n每次升级都应由稳定需求推动。先在低风险场景证明质量和收益，再扩大数据范围和自动化程度，比一次部署大量功能更可靠。\n\n进阶时可以设置三个相互独立的闸门。质量闸门确认结果连续达到最低标准，风险闸门确认权限、日志和恢复机制与影响相匹配，价值闸门确认成果确实被使用且总成本下降。只有三个闸门同时通过，才扩大运行频率、数据范围或外部动作；其中任何一项退化，都可以保持当前层级或降级。"}}}, {"id": "0fc82c91357051cd9c0d00142c", "title": "15.3.2　成熟度提升依赖一套轻量运行机制", "notes": {"plain": {"content": "组织从零散试用走向稳定流程，通常不缺更多工具，而缺少谁选择场景、谁维护规则、谁批准权限、谁处理异常的运行机制。没有这些角色，成功经验停留在个人，失败则无人复盘，成熟度很难真正提升。\n\n轻量机制可以从四个角色开始。业务负责人定义问题和验收结果，流程维护人管理模板、技能和运行记录，数据或系统负责人确认来源与权限，安全或合规角色按风险参与。小团队可以由一人兼任多个角色，但责任不能消失，也不能默认全部交给工具管理员。\n\n组织还需要一个可见的场景清单。每个场景记录用途、使用人、数据等级、依赖工具、当前阶段、负责人、效果和风险。新需求先与现有场景比较，避免不同部门为同一流程重复建设；停用的任务及时撤销权限，防止清单只增不减。\n\n模板、技能和自动化进入共享前，应通过最低测试并有版本。重大变化采用小范围发布，保留回退方式；模型、连接器、数据字段或产品条款变化时，找到受影响的场景重新验证。培训则围绕真实任务、失败样本和验收方法展开，不把“会使用某个按钮”当作完成。"}}}]}, "notes": {"plain": {"content": "成熟度模型的作用不是给个人或企业贴标签，而是帮助识别下一步最值得建设的能力。等级越高，并不意味着使用的工具越多，而是流程、数据、权限和责任越稳定。"}}}, {"id": "c88ead4dbe4a5dbfa27c7372f6", "title": "15.4　从生成内容到交付完整工作结果", "children": {"attached": [{"id": "6a8d3e0e03665e389d1b335e5d", "title": "15.4.1　完成工作意味着更长的责任链", "notes": {"plain": {"content": "任务链越长，系统获得的权限越多，错误影响也越可能扩散。生成一段错误文字通常可以在发布前发现；自动修改文件、填写系统或发送消息，一旦出错则可能影响他人。因此，Agent能力增长必须同时伴随状态可见、关键确认、日志留存和失败恢复。\n\n对组织而言，经验可以被写入模板、技能和知识库，从个人习惯转化为团队流程。但这也意味着错误方法可能被重复执行。任何能够规模化复用的流程，都应明确负责人、版本、适用范围和退出机制。\n\n第一，提升任务设计能力。把目标、数据源、交付标准和操作边界说清楚，是管理AI执行的基础。第二，建立经过核验的积累机制，让文档、数据和方法能够复用，又能定期失效和更新。第三，守住判断与责任：AI可以提供执行和建议，最终方向、授权和对外结果仍由人或组织负责。\n\n评估效率时可以从五个维度记录变化，所有结论都应与人工基线比较，并同时检查质量和风险。表15-5列出可以记录的指标以及常见误判。"}}}, {"id": "60cbb21d2596538a8b86cfa244", "title": "15.4.2　自动程度越高，升级与退出规则越要明确", "notes": {"plain": {"content": "从内容片段走向稳定流程，不应只有一条不断提高自动程度的单向道路。业务、数据和风险会变化，原来适合自动执行的步骤可能需要重新加入确认；工具效果不稳定时，也应能够退回到人工或半自动方式。\n\n每项流程可以设置升级条件：连续多个周期达到质量阈值，输入和权限保持稳定，异常能够被发现和恢复，责任人同意减少某个确认点。升级只改变一个环节，例如从手动触发改为定时生成待确认稿，而不是同时开放自动发送和更多数据范围。\n\n与升级条件对应，还要预设降级和停止条件。关键事实错误、越权访问、重复外发、日志缺失、维护人离开或业务不再使用，都应触发暂停。暂停后保留最后状态和输入，由人工完成必要交付；原因解决并重新测试前，不自动恢复。\n\n退出能力也是完成工作的组成部分。组织要能导出成果、保留必要记录、撤销账号和连接器、停止下游任务，并通知依赖者。一个只能不断增加能力、无法安全关闭的流程，不论演示多么自动，都不具备长期可管理性。"}}}]}, "notes": {"plain": {"content": "“生成内容”以一段文字、一张图或一份初稿为终点；“完成工作”则要求系统跨越多个步骤，把结果保存、交付或写回业务流程。两者之间的差别，是办公Agent出现的核心背景。\n\n从生成内容走向完成工作，可以用四个层次观察。它们描述的是责任链和执行范围的变化，不对应固定的效率百分比。表15-4列出了每个层次中系统承担的工作、人的责任和验收对象。"}}}, {"id": "e642eac7536452a690e37afd1e", "title": "15.5　真正的改变，从一个可验证的流程开始", "notes": {"plain": {"content": "面对快速变化的产品和能力，最容易出现的两种偏差，一种是因为担心不确定而迟迟不开始，另一种是一次引入过多功能，希望立即改造所有工作。更可行的路径，是选择一个高频、边界清楚、错误容易恢复的真实任务，用完整闭环验证价值。\n\n作为试点起点的任务，可以是一份每周都要整理的报告、一组需要反复清洗的数据，或一次来源明确的资料汇总。开始前先记录人工流程的真实基线，包括准备材料、执行、核验和返工所需的时间；再写清数据范围、交付标准、禁止操作和人工确认点。首次运行只处理小样本，至少经过数次同类任务后，再判断这项任务是否值得沉淀为模板、技能或自动化流程。\n\n试点的结论不只有“推广”或“失败”。如果生成速度很快但核验成本过高，可以缩小AI承担的环节；如果结果可靠却准备材料过于麻烦，应优先改善数据和归档；如果流程有效但风险较高，则要增加只读权限、审批和日志。一次试点真正的成果，是弄清什么条件下可用、由谁负责，以及出现异常时怎样停止。"}}}]}, "notes": {"plain": {"content": "一份月度经营报告从两天缩短到两小时，听起来像是明确的效率提升；如果数据准备仍然混乱、审核者增加了一轮复算、错误结论险些进入会议，答案就没有那么简单。AI改变了某个步骤的速度，不等于整条工作流程已经改善，更不等于人的判断和责任可以随之减少。\n\n前十四章已经把AI放进文档、数据、调研、电脑操作、自动化和组织协作等具体场景。本章不再预测哪些岗位会被替代，而是回到三个今天就能回答的问题：人的工作重心发生了什么变化，效率怎样衡量才不忽略质量与风险，个人经验怎样成为可持续的组织能力。由生成内容走向完成工作，既是技术能力的变化，也是工作方法和管理方式的重新设计。"}}}]}, "notes": {"plain": {"content": "当团队已经会用AI写文档、做分析和生成内容，新的困惑反而会出现：为什么材料产出更多，项目推进却没有明显变快？为什么节省了起草时间，审核和返工却在增加？为什么个人觉得好用的流程，一扩大到团队就频繁出错？这些问题说明，工具层面的成功不会自动变成岗位价值。\n\n许多关于AI未来的讨论，要么只列举“哪些岗位会被替代”，要么只展示某个环节节省了多少时间，却忽略了工作是一条相互依赖的流程。起草更快，不代表审批更快；内容更多，不代表决策更好；自动化范围更大，也不代表责任可以交给系统。本篇不预测遥远的职业结局，而是回到今天可以观察和改造的工作现场。\n\n本篇适合希望把AI能力嵌入具体岗位的专业人员、团队负责人和管理者。第14章覆盖通用办公、销售、运营、财务、内容、设计、开发、人力资源和教育等场景，说明如何拆解输入、判断、执行和交付；第15章讨论人机分工、效率基线、能力成熟度与组织试点。读者可以先选最接近自己的岗位案例，再用第15章的方法评估是否值得扩大。"}}}, {"id": "1c66cbc195695509b56498c840", "title": "结语　把能力留在流程里", "notes": {"plain": {"content": "一本实战书是否有价值，不取决于读者记住了多少功能，而取决于合上书后能否独立完成一项真实任务。产品入口可能调整，模型能力可能升级，今天熟悉的按钮也可能在下一次更新中改变。如果学习只停留在界面和指令，经验很容易随版本一起失效；如果掌握的是目标拆解、材料组织、权限控制、过程核验和成果交付，工具变化反而会成为可以吸收的新条件。\n\n这也是本书始终坚持的一项取舍：把“会生成”与“能交付”分开。生成一段文字、一张图或一份表格，只说明系统完成了局部动作；真正完成工作，还要回答材料是否可信、结论是否成立、格式是否可用、影响是否可控，以及谁愿意为对外结果负责。越过这些问题追求自动化，通常只会把原有流程中的含糊和错误放大。\n\n本书同样有明确边界。它讨论的是通用办公任务中的方法与实践，不代替法律、财务、医疗、人事等领域的专业判断，也不能覆盖每一种组织制度、数据环境和产品版本。书中的案例适合用来理解流程，不能直接证明某个组织一定获得相同效果；指令模板能够缩短起步时间，却不能替代真实材料、业务规则和验收标准。遇到来源不清、权限不明或后果难以恢复的任务，暂停并请求专业复核，比得到一个看似完整的答案更重要。"}}}, {"id": "528c4ed92ff051f086107d8e3a", "title": "附录导读　把附录当作工作台，而不是答案库", "notes": {"plain": {"content": "正文到这里已经结束。后面的三个附录不承担新的知识主线，也不建议从头到尾机械通读；它们更像一组随任务取用的工作材料，帮助读者在实践中快速找到起点、核验条件和排查路径。\n\n准备发起具体任务时，可以先查附录A，从相近的指令模板中提取任务骨架，再补入真实材料、权限范围和验收标准；对产品能力、数据安全、套餐或故障仍有疑问时，查附录B；需要定位书内配套内容、安排练习或回查术语时，再使用附录C。\n\n附录中的模板、快捷操作和回答都不是脱离情境的标准答案。复制一条模板之前，先确认它服务于什么任务；执行一个操作之前，先确认对象和影响范围；引用一项产品说明之前，先确认核验日期和当前版本。凡是涉及发送、发布、覆盖、删除、敏感数据或外部账号的动作，都应回到正文中的原则：限定范围、保留预览、人工确认、记录结果。\n\n如果附录与最新界面不一致，应以官方信息和实际环境为准，并把差异记录下来。能够根据新条件修订模板、更新步骤和重新验收，本身就是把书中方法转化为长期能力的一部分。"}}}, {"id": "008315f83b6f534d8cf1434777", "title": "附录A　常用指令模板20条", "children": {"attached": [{"id": "e610c3048ee1506d8ef6ee7382", "title": "A.1　文档写作类（2条）", "notes": {"plain": {"content": "会议纪要整理与周报生成\n\n适用场景： 例会、周会或项目会结束后，需要形成会议纪要，并据此整理周报、月报或向上汇报材料。\n\n请整理会议记录【粘贴内容或指定文件路径】，先输出结构化会议纪要，包括议题与背景、讨论要点、已确认结论和行动项。行动项请用表格列出任务、负责人、截止时间、优先级和原文依据；缺少负责人或期限时标注“待确认”，不得自行补写。再结合【本周其他工作材料】生成一页以内的周报，结构为本周完成、关键数据、问题与风险、下周计划。数字只使用材料中能够追溯的内容，并标注来源位置。\n\n使用要点： 先把会议事实固定下来，再生成周报，避免两份材料出现不同口径。行动项表格应由参会负责人确认后再进入任务系统。\n\n方案撰写与工作汇报\n\n适用场景： 立项方案、季度汇报、工作报告、正式邮件或对外文稿的起草与润色。\n\n请为【项目名称／汇报主题】起草方案。第一轮只输出大纲：背景与目标、三个备选方案及比较、推荐方案、实施计划、资源需求、风险和待决事项；等待我确认后再写全文。全文要求结论先行，所有数字注明来源，没有依据的内容标记“待补充”，语言正式简洁，控制在【N】字以内。最后提炼一段面向【收件人／汇报对象】的汇报要点，但不要替我发送。"}}}, {"id": "be4cff0f18835977875582900a", "title": "A.2　会议与沟通类（2条）", "notes": {"plain": {"content": "会前准备与会后闭环\n\n适用场景： 主持或深度参与会议，需要会前明确目标、会中控制议程、会后跟踪结果。\n\n请为【会议主题】准备全流程会议材料。会前生成会议目标、议题清单、每项议题的背景与期望结论、参会人分工和时间安排，并附一份会议纪要模板。会后读取【会议记录】，提取已确认结论、分歧、待确认事项和行动项；行动项按任务、负责人、截止时间、优先级和依赖关系输出。最后起草一条给未参会同事的同步消息，只陈述已经确认的事实和需要其反馈的事项，发送前等待我确认。\n\n使用要点： 会议纪要不能把讨论意见写成正式决议。责任人、截止时间和对外同步内容应逐项核对。\n\n访谈提纲与沟通话术\n\n适用场景： 客户访谈、专家访谈、员工沟通、跨部门协商或向上汇报。\n\n请围绕【访谈目标】为【客户／专家／员工／上级】设计沟通方案。先给出破冰问题、5～8个核心问题、每个问题的追问方向和收尾问题；如果材料中存在分歧，再按“确认共同目标—陈述可核验事实—说明影响—提出选项—约定下一步”提供沟通话术。另将关键信息压缩为3分钟向上汇报版本，依次说明结论、关键数据、风险、需要的支持和请示事项。"}}}, {"id": "d07512b41a89530e8d1ed99390", "title": "A.3　PPT制作类（2条）", "notes": {"plain": {"content": "PPT大纲与初稿生成\n\n适用场景： 从零开始制作项目汇报、产品介绍、培训课件或内部分享。\n\n请为【主题】规划一份面向【受众】、用于【场合】的PPT。第一步只给出汇报目标、叙事结构和逐页大纲，篇幅约【N】页，每页标题采用结论式表达，并注明所需数据或素材。待我确认大纲后，再生成逐页内容：每页只表达一个核心观点，正文控制在可演示的密度，并为每页补充2～3句演讲备注和与下一页的衔接语。无法从材料确认的内容标记“待补充”。\n\n使用要点： 页数不是目标，受众需要做出什么判断或行动才是目标。先确认结构，再制作页面。\n\nPPT美化与数据可视化\n\n适用场景： 已有PPT初稿，需要精简文字、统一风格或改造数据页与对比页。\n\n请审阅PPT【文件路径】，先列出需要修改的页面和原因，等待确认后再调整。文字页应压缩为结论标题和必要要点；数据页根据问题选择趋势、对比或构成图表，并在图前写明要回答的问题，在图后写一句有数据依据的结论；产品对比页按统一维度呈现，不补写材料中没有的价格或能力。全篇统一标题层级、字体、配色和页边距，保留原始文件并输出新版本。"}}}, {"id": "cf98bc7ea4275945b5b3d6f358", "title": "A.4　表格与数据处理类（2条）", "notes": {"plain": {"content": "数据清洗与汇总透视\n\n适用场景： 对Excel、WPS表格、CSV或数据库导出数据进行清洗、汇总、透视和核对。\n\n请读取【文件或目录】，先报告工作表、字段、记录数、时间范围和明显异常，不修改原件。根据我确认的规则处理缺失值、重复项、异常值及日期、数字和文本格式，并输出清洗规则记录。随后按【维度】汇总【指标】，保留合计、口径和单位；需要透视时说明行维度、列维度和值字段。若合并多张表，先检查关联键和关系类型，输出匹配、未匹配及可能重复放大的数量，最后生成清洗副本和差异清单。\n\n使用要点： 清洗规则、输入快照和处理日志要一并保存，便于复算。不要在未确认业务含义时擅自填补空值。\n\n数据分析与图表结论\n\n适用场景： 分析经营数据的趋势、差异和异常，并形成可复核的图表与结论。\n\n请基于【数据文件】完成分析。先确认指标定义、时间范围、单位和分母，再分析整体趋势、同比或环比、关键分组差异及异常点。每张图先说明要回答的问题，再选择合适图形，并标注数据来源和截止日期。结论分为数据事实、原因假设和建议三层；原因没有证据时不得写成确定结论。最后输出关键数字复算表、待补证据和不超过3条的下一步建议。"}}}, {"id": "4e2b6e00f8105363977d6138b6", "title": "A.5　调研与分析类（2条）", "notes": {"plain": {"content": "深度调研与专题报告\n\n适用场景： 围绕行业、市场、政策或技术问题开展资料检索并形成研究报告。\n\n请围绕【研究问题】开展调研，时间范围为【范围】，面向【决策对象】。先提出检索计划和来源优先级，再收集官方文件、权威机构报告、论文或一手材料。报告包括现状与规模、主要参与者、关键趋势、驱动因素、争议与不确定性，以及对【公司／岗位】的启示。每个关键结论注明来源、发布日期和访问日期，区分事实、来源观点和作者推断；无法交叉验证的内容单列，不纳入确定结论。\n\n使用要点： 多个网页转述同一消息不等于多源验证。来源质量和证据链比材料数量更重要。\n\n竞品分析与用户调研\n\n适用场景： 比较竞品、整理用户反馈，并评估某项产品或项目设想。\n\n请完成【竞品名称】与【用户反馈材料】的联合分析。竞品部分按产品定位、目标用户、核心能力、价格口径、优势、限制和信息日期进行比较；用户部分提取高频诉求、抱怨、使用场景和原文证据，不把少量评论外推为全部用户。对关键信息进行来源交叉核验并标注可信度。最后从市场需求、资源条件、成本收益和风险四方面评估【项目设想】，给出“可试点／需补证据／暂不推进”的判断及理由。"}}}, {"id": "ed1754a1e515592fa022229416", "title": "A.6　内容创作类（2条）", "notes": {"plain": {"content": "新媒体图文创作\n\n适用场景： 为公众号、小红书、朋友圈或其他平台准备同一主题的差异化内容。\n\n请基于【主题／产品资料】分别起草三类内容：公众号文章采用问题切入、方法与案例、总结和行动提示的结构；小红书笔记突出可验证的体验与实用步骤；朋友圈文案提供活动型、信息型和个人表达型三个版本。各版本分别遵守【字数、语气和禁用词】要求，不虚构使用体验、用户评价或效果数据。另提供10个标题候选，并说明每个标题对应的读者利益点。\n\n使用要点： 不同平台需要重新组织表达，不能只改标题。发布前检查事实、商标、图片权利和广告合规要求。\n\n短视频脚本与内容拆解\n\n适用场景： 起草短视频脚本、分析参考内容、改写文案或提炼产品卖点。\n\n请为【主题】制作【时长】短视频脚本，包含开场、信息展开、案例或证据、结尾行动提示，并逐段给出画面、口播和字幕建议。对参考内容【链接／材料】只分析标题、结构、节奏、情绪和转化设计，不复制原文表达。根据产品资料提炼功能、用户收益、适用条件和限制，生成三个不同语气的文案版本。任何性能、销量或效果结论都必须来自已提供且可核验的材料。"}}}, {"id": "10c3bcaf05bf5c1ba4e4a4c252", "title": "A.7　营销与运营类（2条）", "notes": {"plain": {"content": "营销方案与投放文案\n\n适用场景： 策划营销活动、设计渠道策略并准备投放素材。\n\n请为【产品／活动】制定营销方案，依次说明目标、受众、渠道、内容、预算口径、效果指标、时间表和风险。按【用户分层依据】描述各层特征与运营策略，不根据敏感属性进行不当差别对待。为【渠道】分别起草三个广告文案版本，所有价格、优惠、效果和适用条件必须引用已确认材料。最后生成一周内容日历。先交付方案和文案预览，未经我确认不得发布、投放或修改线上内容。\n\n使用要点： 指标应能在活动后复盘，文案必须与实际权益一致。涉及预算和发布的动作始终保留人工确认。\n\n活动复盘与数据运营\n\n适用场景： 活动结束后复盘、形成数据日报、设计增长试验或规划客户触达。\n\n请基于【活动目标、投入和结果数据】完成复盘，输出目标达成、渠道表现、投入产出、异常、亮点、问题和下次改进清单。为【业务问题】提出不超过3个可验证假设，分别写明证据、试验方法、样本范围、成功指标、观察周期和停止条件。若需要周期报告，只先给出任务配置草案，包括触发时间、数据源、输出位置、告警和人工确认点；未经确认不要创建定时任务或发送客户消息。"}}}, {"id": "85313a89bfdf511eaed719bf01", "title": "A.8　销售与客户类（2条）", "notes": {"plain": {"content": "销售话术与异议应答\n\n适用场景： 为一线销售准备开场、价值说明、异议处理、回访和报价沟通材料。\n\n请基于已确认的产品资料【粘贴】起草销售沟通方案。按【客户类型】提供开场方式；用通俗语言说明产品价值、适用条件和限制；针对【常见异议】按“确认顾虑—核对事实—回应价值—约定下一步”给出话术；再设计回访提纲。报价部分只能引用【已批准价目表】，分别给出推荐方案和备选方案，注明有效期、包含内容和待确认条款。所有内容仅生成草稿，不代替销售人员作出承诺。\n\n使用要点： 不制造稀缺、不虚构案例、不承诺未经批准的价格或效果。客户意向和承诺必须回到原始沟通记录。\n\n客户跟进与分级\n\n适用场景： 整理客户沟通、规划跟进节奏并降低遗漏风险。\n\n请读取【客户沟通记录】，为每位客户生成跟进卡，区分客户原话、销售判断、已承诺事项、待确认问题和下一步建议，并保留来源位置。根据组织已批准的【分级标准】进行分组，说明每项判断依据，不使用与业务无关的敏感信息。生成待跟进清单和提醒配置草案，列出负责人、期限和触发条件；任何外发消息、报价、权益或客户系统写入都要等待负责人确认。"}}}, {"id": "9c747a3bc2965e79aa1b877836", "title": "A.9　行政与人事类（2条）", "notes": {"plain": {"content": "招聘材料与流程支持\n\n适用场景： 起草岗位说明、整理简历、设计面试问题和准备入职通知。\n\n请根据【岗位需求】起草职位说明，明确岗位职责、必要条件、可培养条件、工作地点和投递方式。读取候选材料时，只提取与岗位直接相关且材料中明确提供的信息，并按统一字段形成汇总表；不得推断年龄、健康、婚育、民族等敏感属性，不自动淘汰或作出录用建议。根据岗位能力和候选材料生成面试问题，并标注每个问题要验证的事实。入职通知只起草模板，日期、薪酬、地点和联系人由人力资源（Human Resources，HR）负责人确认后发送。\n\n使用要点： AI可协助整理材料，招聘评价与录用决定必须由具备权限的人承担，并保留公平性复核。\n\n制度文件与绩效沟通\n\n适用场景： 起草制度、准备绩效面谈、培训通知、请假回复或离职交接清单。\n\n请基于【现行制度、法律意见和业务要求】起草【制度名称】修订稿，结构包括目的、适用范围、职责、执行规则、例外、申诉或反馈渠道、生效日期和版本记录；有冲突或依据不足之处单列。根据【已经确认的绩效事实】设计面谈提纲，区分成绩、具体事例、需要改进的行为、双方约定和后续支持，不推断个人动机。另起草培训通知或交接清单，发布和权限回收前等待负责人确认。"}}}, {"id": "3c91d591290552b98a91dc1f6b", "title": "A.10　个人效率与生活事务类（2条）", "notes": {"plain": {"content": "日程规划与学习计划\n\n适用场景： 安排个人时间、制定学习目标、整理读书笔记或汇总沟通记录。\n\n请基于【日程与任务清单】按重要性、紧急度、期限和精力要求排序，识别冲突、通勤和缓冲时间，提出可调整项，但不要自行取消或移动日程。为【学习目标】设计4周计划，包含每周主题、每日30～60分钟任务、练习成果和每周复盘。对【书籍／课程材料】生成核心观点、证据、疑问和应用计划；对沟通记录只提取已确认事项、待办、分歧和下一步建议。\n\n使用要点： 计划要为突发任务留出余量，并定期根据完成情况调整。自动读取日历或消息前先确认授权范围。\n\n决策辅助与个人事务规划\n\n适用场景： 比较选项、梳理个人收支、规划旅行或安排一般性的健康习惯。\n\n请比较【选项A】与【选项B】，先使用我提供的【决策标准与权重】逐项列出证据、未知项和风险，再给出条件式建议。对个人收支【材料】只做分类、预算和现金流梳理，不提供投资或借贷决策。旅行计划注明日期、预算、交通和需要实时核验的价格。健康习惯只提供一般性的运动、饮食和作息记录方案；涉及症状、诊断、药物或高强度训练时，明确建议咨询合格专业人员。"}}}]}, "notes": {"plain": {"content": "“提示词”是日常说法，本书统一使用“指令”一词。本附录依据办公场景收录20条可直接改写的指令模板，分为10类，每类2条。模板不是无需判断的口令：使用前应把【】中的占位内容替换为真实信息，补齐数据来源、输出格式、操作边界和验收标准；涉及事实、数据、人员评价、对外发送或系统写入时，必须保留人工复核与确认。"}}}, {"id": "784ff01a5d9452f3a4a9ae7961", "title": "附录B　常见问题与排查：20问", "children": {"attached": [{"id": "fbd036181afd50619cd4127e37", "title": "B.1　产品与版本（3问）", "notes": {"plain": {"content": "豆包工作是什么？和豆包App是什么关系？\n\n豆包App更偏向聊天、问答和内容生成，豆包工作更强调围绕目标读取材料、拆分步骤、调用办公工具并形成交付物。两者可能共享账号或部分能力，但入口、权限、运行环境和可用功能会随版本变化。判断任务应使用哪一个入口，不看名称相近与否，而要看是否需要访问文件、调用工具、跨步骤执行和保留过程证据。\n\n豆包工作支持哪些系统？有移动端吗？必须和飞书一起使用吗？\n\n桌面端支持范围和最低系统要求应以当前官方下载页为准。移动端、远程查看或远程操作能力可能受版本、账号和地区影响，使用前应在客户端核验。豆包工作可以处理本地办公任务；只有任务需要飞书中的聊天、文档、组织或日程上下文时，才需要完成相应账号连接和授权。\n\n豆包工作会取代Office或WPS吗？\n\n更准确的理解是协作而非取代。豆包工作可以辅助整理、生成或修改DOCX、XLSX、PPTX等文件，但正式编辑、复杂版式、公式兼容、打印和团队审阅仍可能依赖Office、WPS或其他专业软件。最终文件应在收件人实际使用的软件中打开检查。"}}}, {"id": "f955e266e8b65d6e8fc49fa0e3", "title": "B.2　安装与登录（2问）", "notes": {"plain": {"content": "怎样下载安装？需要什么电脑配置？\n\n应从豆包官网或产品当前公布的正式入口下载安装包，并核对域名、发布主体和安装包签名。具体支持的系统版本、芯片、内存和存储空间以当期下载页为准，不宜把某一版的最低配置写成长期结论。安装前还应确认组织是否允许使用该软件，以及终端安全策略是否需要管理员批准。\n\n登录需要什么账号？换电脑后怎样恢复？\n\n可用登录方式以当前客户端显示为准，个人入口和组织入口的数据边界可能不同。换电脑时，应先区分云端账号内容与只保存在本地的文件、目录授权和软件配置；即使使用同一账号，也不能默认所有历史任务和本地材料都会自动同步。迁移前应备份文件，登录后重新检查授权目录和外部系统连接。"}}}, {"id": "6bd80f58d126517282646fc932", "title": "B.3　功能使用（6问）", "notes": {"plain": {"content": "怎样让AI操作电脑？怎样控制风险？\n\n只有在产品提供相应能力且用户明确授权时，系统才能读取屏幕、操作浏览器或访问本地文件。开始前要限定应用、目录、账号和动作范围，先用少量无敏感数据试跑。删除、覆盖、发送、发布、付款、审批等高影响动作应设置为执行前确认；发现异常时立即暂停并接管。\n\n怎样让AI定时执行任务？\n\n如果当前版本支持周期任务，应明确触发时间与时区、数据来源、处理规则、输出位置、接收人、失败告警和人工检查点。首次运行先用小样本和测试位置验证，未经确认不要直接发送到群聊、客户或正式系统。长期任务还需要负责人、停用条件和定期复查日期。\n\n怎样生成和修改文档、表格或PPT？\n\n指令至少要说明材料、受众、用途和输出格式。复杂文档或演示文稿先确认大纲；数据任务先确认字段和指标口径；修改已有文件时限定页面、工作表或段落范围，并保留原件。生成后应在Office或WPS中检查内容、公式、图表、字体和分页。"}}}, {"id": "6e7b920724535af4971a618767", "title": "B.4　数据与安全（3问）", "notes": {"plain": {"content": "我的数据会被用于模型改进吗？AI能看到所有聊天记录吗？\n\n不能只凭一句宣传语判断。个人用户应在“设置—隐私与权限”或当前对应入口中检查“帮助模型改进效果”等选项，并阅读适用隐私政策；企业用户还要结合合同、管理员设置和组织制度理解数据用途。关闭相关开关也不等于任何敏感资料都适合上传。系统能够读取哪些内容，取决于账号身份、用户授权、连接范围和原系统权限。\n\n有风险的操作会怎样处理？操作记录能否查看？\n\n使用者应主动把删除、覆盖、发送、发布和系统写入设置为执行前确认，而不能假定所有风险都会被系统自动识别。操作记录、审计范围和保存期限取决于产品版本及组织配置。重要任务应另行保存输入版本、关键确认、输出文件和异常说明，使结果能够追溯。\n\n怎样保护账号？人员离职后怎样处理数据和权限？\n\n使用独立且强的密码，不共享密码或验证码，并定期检查登录设备和已连接应用。产品是否提供固定的双因素认证开关，应以当前账号设置为准。发现异常时立即退出陌生设备、修改凭证并保存记录。人员离职或岗位变化时，应由管理员按组织制度回收账号、目录、群组、连接器和数据访问权限，并确认交付物的归属与保留期限。"}}}, {"id": "cfb8dbf1f562579fb0aa5a9b51", "title": "B.5　套餐与付费（3问）", "notes": {"plain": {"content": "豆包工作怎样收费？是否有免费试用？\n\n套餐名称、价格、额度、试用和活动都属于高频变化信息，应以当前客户端账单页、正式产品页面或写明活动名称与有效期的官方公告为准。不要使用旧截图或第三方文章判断当前权益，也不要把一次性活动写成长期承诺。团队采购还应确认席位、数据条款、发票和退出安排。\n\n学生是否有优惠？\n\n只有当前官方页面明确提供学生认证和对应权益时，才能按页面要求申请。应核对活动时间、适用地区、认证主体、自动续费和取消规则；无法在官方入口确认的信息，不作为购买依据。\n\n套餐能否升级或降级？额度用完怎么办？怎样开具发票？\n\n升级生效时间、降级规则、额度恢复周期和发票入口都可能因套餐与渠道不同而变化，应在操作前查看账单页和适用条款。若额度不足，可先缩小任务、停止低价值周期任务或等待额度恢复，再判断是否需要调整套餐。任何涉及付款或续费的操作都应由账号负责人确认。"}}}, {"id": "462e8e50b22752b786b081c2c5", "title": "B.6　故障排查（2问）", "notes": {"plain": {"content": "回答质量差、执行缓慢或任务卡住怎么办？\n\n质量差时，先检查目标、输入、格式、边界和验收标准是否明确，并要求系统指出缺失信息；执行慢时，把任务拆成可独立验收的小步骤，检查网络、文件大小和外部服务状态；任务卡住时，先暂停，记录停在什么步骤，再检查授权、登录状态、窗口遮挡、文件占用和磁盘空间。不要在状态不明时反复重试高影响动作。\n\n生成的文件打不开，或周期任务没有触发怎么办？\n\n文件打不开时，先确认扩展名与实际格式一致，检查文件大小和生成日志，并在收件人使用的软件中打开；必要时从稳定检查点重新生成，不覆盖唯一原件。周期任务未触发时，依次检查是否启用、时区、触发条件、账号登录、数据源权限、输出目标权限和运行记录。仍无法定位时，保存版本号、时间、步骤和报错截图，再联系官方支持。"}}}, {"id": "acbf7d6a823550328fd92ee7e8", "title": "B.7　进阶使用（1问）", "notes": {"plain": {"content": "怎样让系统更符合我的工作习惯？复杂任务怎样拆解和核验？\n\n把稳定的格式、术语、流程和验收标准写入任务说明或沉淀为经过验证的技能，不要依赖系统“自动记住”。复杂任务先拆成材料确认、计划、执行、检查和交付五个阶段，每阶段都定义产物与检查点。验证结果时，从结论回到来源、原始材料和处理步骤；对关键事实进行交叉核验，对数字抽样复算，并由相应负责人完成最终确认。\n\n排查通用流程\n\n遇到问题时按“现象—环境—复现—定位”四步记录：先写清报错、卡住位置或质量问题；再记录产品版本、系统、网络、账号和输入材料；随后用低风险样本判断问题能否复现；最后检查权限、额度、配置、文件和外部服务。联系支持时提供经过脱敏的版本号、时间、操作步骤和截图，不发送密码、验证码或仍然有效的访问链接。"}}}]}, "notes": {"plain": {"content": "本附录依据补充稿收录豆包工作使用中的20个常见问题（Frequently Asked Questions，FAQ），按产品与版本、安装与登录、功能使用、数据与安全、套餐与付费、故障排查和进阶使用七类编排。回答以本书截至2026年9月3日的核验口径为基线；界面、功能、套餐和活动均可能变化，涉及版本性事实时应以当前客户端、官网、协议和所在组织制度为准。"}}}, {"id": "ceb50f3c29b651eabbbbd783f7", "title": "附录C　学习资源与持续实践", "children": {"attached": [{"id": "db9d10007f295e278f10e0eb11", "title": "C.1　本书可直接使用的配套内容", "notes": {"plain": {"content": "本版书稿能够直接交付的配套内容都在书内，不依赖尚未上线的下载页面。表C-1列出各项内容的位置和使用方式。\n\n本版不设置依赖外部下载页面的案例素材包，也不把尚未上线的资源列为随书权益。读者练习时可使用自行准备的虚拟数据或经过组织允许的脱敏副本，避免因链接失效而无法完成书中任务。"}}}, {"id": "1c2d4c55d5aa5afda463076af1", "title": "C.2　14天实践路线：每天完成一项可验收成果", "notes": {"plain": {"content": "这是一条由14个练习组成的可选路线，不是连续打卡要求，也不是速成承诺。读者可以按章节顺序每天完成一项，也可以根据岗位需要分散到数周进行。每次只完成一个范围可控、结果可检查的任务；涉及敏感资料或高影响操作时，改用虚拟数据或经过批准的脱敏副本。\n\n第1天：判断产品边界。 阅读第1章，列出三个适合交给办公Agent的任务和三个必须保留人工判断的任务。\n\n第2天：完成首次任务。 阅读第2章，在独立工作目录中用无敏感信息的材料生成一份会议纪要，并核对行动项。\n\n第3天：写出任务说明书。 阅读第3章，为一个真实任务写清目标、数据源、输出格式、操作边界和失败处理方式。\n\n第4天：交付一份正式文档。 阅读第4章，把零散记录整理为结构完整、事实可追溯的纪要、方案或报告。\n\n第5天：完成一份演示文稿。 阅读第5章，先确认大纲，再制作并演练一份小型汇报。\n\n第6天：完成一次数据分析。 阅读第6章，使用保留原件的样本数据完成清洗、汇总、可视化和结果核验。"}}}, {"id": "8840c084543a514d89d93cf2cf", "title": "C.3　核心术语速查：先懂大白话，再回到正式名称", "notes": {"plain": {"content": "这一节用于回查，不代替正文中的场景、步骤和边界说明。遇到陌生术语时，可以先看通俗解释，再回到所列章节理解它在真实任务中怎样使用。\n\n人工智能（Artificial Intelligence，AI）。 泛指让计算机完成识别、生成、预测、规划等任务的技术集合。书中谈到的AI并不是一个具有统一意图的“人”，不同模型、工具和产品能力必须分别核验。\n\n生成式AI。 根据输入和既有模式生成文字、图像、音频、视频或代码的系统。它擅长形成候选内容，但输出流畅不等于事实正确，参见第4、7和10章。\n\n大模型。 通过大规模数据和计算训练、能够处理多类语言或内容任务的基础模型。它提供理解与生成能力，但不是实时更新的事实数据库，也不能替代来源核验。\n\n智能体（Agent）。 围绕目标规划步骤，并在条件允许时调用工具推进任务的系统。能执行多步操作不等于可以独立承担判断和责任，参见第1和3章。"}}}]}, "notes": {"plain": {"content": "本附录保留三类可直接使用的内容：书内配套资料、14天实践路线和核心术语速查。它们分别用于快速定位工具、安排练习和回查概念，不代替各章中的场景、步骤与风险边界。"}}}]}, "notes": {"plain": {"content": "依据Word正文标题整理，涵盖五篇、15章、前言、结语与附录。"}}}</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),lookup=new Map(),parents=new Map(),closed=new Set();let matches=[],cursor=-1,w=0,h=0;
function index(n,parent,depth){lookup.set(n.id,n);n.depth=depth;if(parent)parents.set(n.id,parent);for(const c of n.children?.attached||[])index(c,n,depth+1);}index(data,null,0);
function level(max){closed.clear();for(const n of lookup.values())if(n.depth>=max)closed.add(n.id);render();}
function render(){const canvas=$('canvas');canvas.replaceChildren();const coords=[];let y=20;
function place(n){const kids=closed.has(n.id)?[]:n.children?.attached||[];const label=n.title;const height=Math.max(60,Math.ceil(label.length/16)*21+20);let cy;
if(kids.length){const positioned=kids.map(place);cy=(positioned[0].y+positioned[0].height/2+positioned.at(-1).y+positioned.at(-1).height/2)/2-height/2;}else{cy=y;y+=height+18;}
const item={n,x:20+n.depth*330,y:cy,height,width:285};coords.push(item);return item;}place(data);
w=Math.max(...coords.map(p=>p.x+p.width))+40;h=Math.max(y,...coords.map(p=>p.y+p.height))+30;
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',w);svg.setAttribute('height',h);canvas.append(svg);const pos=new Map(coords.map(p=>[p.n.id,p]));
for(const p of coords){const parent=parents.get(p.n.id),a=parent&&pos.get(parent.id);if(a){const line=document.createElementNS(svg.namespaceURI,'path'),x1=a.x+a.width,y1=a.y+a.height/2,x2=p.x,y2=p.y+p.height/2;line.setAttribute('d',`M${x1},${y1} C${x1+22},${y1} ${x2-22},${y2} ${x2},${y2}`);line.setAttribute('stroke','#8caf99');line.setAttribute('stroke-width','2');line.setAttribute('fill','none');svg.append(line);}
const box=document.createElement('div');box.className='node'+(p.n.depth===0?' root':p.n.depth===1?' part':'');box.id='node-'+p.n.id;Object.assign(box.style,{left:p.x+'px',top:p.y+'px',width:p.width+'px',height:p.height+'px'});
if(p.n.children?.attached?.length){const b=document.createElement('button');b.textContent=closed.has(p.n.id)?'+':'−';b.setAttribute('aria-label',(closed.has(p.n.id)?'展开':'折叠')+p.n.title);b.onclick=()=>{closed.has(p.n.id)?closed.delete(p.n.id):closed.add(p.n.id);render();};box.append(b);}
const t=document.createElement('span');t.className='label';t.textContent=p.n.title;t.tabIndex=0;t.onclick=()=>{$('detail-title').textContent=p.n.title;$('excerpt').textContent=p.n.notes?.plain?.content||'此节点下没有摘录，请展开查看下一级内容。';$('info').hidden=false;};t.onkeydown=e=>{if(e.key==='Enter')t.click();};box.append(t);canvas.append(box);}
canvas.style.width=w+'px';canvas.style.height=h+'px';scale();}
function scale(){const s=Number($('zoom').value)/100;$('canvas').style.transform='scale('+s+')';$('space').style.width=w*s+'px';$('space').style.height=h*s+'px';}
function reveal(id){let n=lookup.get(id);if(!n)return;for(let p=parents.get(id);p;p=parents.get(p.id))closed.delete(p.id);render();const box=$('node-'+id);box?.classList.add('hit');box?.scrollIntoView({block:'center',inline:'center'});}
function find(next=false){const q=$('search').value.trim();if(!q){$('status').textContent='输入要查找的标题关键词。';return;}if(!next){matches=[...lookup.values()].filter(n=>n.title.includes(q));cursor=-1;}if(!matches.length){$('status').textContent='没有找到对应标题。';return;}cursor=(cursor+1)%matches.length;reveal(matches[cursor].id);$('status').textContent=`找到 ${matches.length} 项，当前第 ${cursor+1} 项：${matches[cursor].title}`;}
$('chapters').onclick=()=>level(2);$('sections').onclick=()=>level(3);$('all').onclick=()=>level(99);$('zoom').oninput=scale;$('find').onclick=()=>find();$('next').onclick=()=>find(true);$('search').onkeydown=e=>{if(e.key==='Enter')find();};$('close').onclick=()=>{$('info').hidden=true;};level(3);reveal(location.hash.slice(1)||'book');
</script></body></html>
