</style></head><body><header><h1>豆包工作 · Word整本思维导图</h1><p>一张完整导图：5篇 → 15章 → 70个大节 → 169个小节，另含前言、结语和附录，共292个节点。</p></header><div class="toolbar"><button id="chapters">看到章</button><button id="sections">看到大节</button><button id="all">全部展开</button><label>缩放 <input id="zoom" type="range" min="40" max="140" value="85" step="5"></label><input id="search" placeholder="查找标题，例如：会议纪要" aria-label="查找标题"><button id="find">查找</button><button id="next">下一个</button></div><div id="status">点击加减号展开或折叠；点击标题查看对应Word原文摘录。</div><div id="viewport"><div id="space"><div id="canvas"></div></div></div><aside id="info" hidden><button id="close">关闭详情</button><h2 id="detail-title"></h2><p style="color:#688071">Word对应标题下的原文摘录</p><div id="excerpt"></div></aside><footer>来源：豆包工作_AI智能办公实战手册_图表与文字校订版.docx。保留Word正文标题；目录页未重复计入。</footer><script id="data" type="application/json">{"id": "book", "title": "豆包工作：AI智能办公实战手册", "children": {"attached": [{"id": "c372b693634e5c4595fb47d847", "title": "前言　当AI从“能聊天”走向“能干活”", "children": {"attached": [{"id": "f10ac8df3bf6566a832504a37a", "title": "一、这本书为谁而写", "notes": {"plain": {"content": "本书面向需要处理文档、表格、演示文稿、会议材料和公开信息的职场人士，也适合部门负责人、项目管理者以及企业信息技术（Information Technology，IT）、安全和数字化负责人。读者不需要编程基础，但需要带着真实任务练习。\n\n这不是逐项介绍按钮的产品说明书，也不是可以原样复制的“万能提示词”合集。如果期待把判断、授权和责任全部交给AI，本书并不适合；如果希望把模糊需求变成可执行、可检查、可复用的工作流程，可以从书中找到方法和案例。"}}}, {"id": "9daba6b6453b55a2b9baa34733", "title": "二、本书的主线与特色", "notes": {"plain": {"content": "全书分为五篇、15章：第一篇建立产品认知并完成受控试跑；第二篇处理文档、演示文稿、数据和调研等核心交付；第三篇进入跨软件操作、定时任务和多模态创作；第四篇讨论企业上下文、生态扩展与安全治理；第五篇把方法放回岗位流程，并用基线、质量与风险评估真实价值。\n\n本书的特点不是罗列功能，而是始终追问四件事：输入材料是否可信，系统可以操作到哪里，哪个节点必须由人决定，最终成果怎样验收。书中的案例、指令模板、检查表和流程图都围绕这四个问题展开，既帮助个人完成任务，也为团队试点留下治理接口。"}}}, {"id": "7dd9c9b0f4e352d3990b7b14e1", "title": "三、怎样阅读和练习", "notes": {"plain": {"content": "初次接触办公Agent的读者，可以按顺序阅读第1—3章，并完成第2章的会议纪要练习；已有经验的读者可以从当前任务直接进入：文档、演示文稿、数据和调研见第4—7章，跨软件与自动化见第8—9章，团队接入与安全治理见第11—13章，岗位复盘见第14—15章。\n\n附录C.2提供14天可选实践路线，但它不是速成承诺，也不要求连续完成。无论从哪一章开始，都建议先用低风险材料试跑：保留原件，限定目录和权限，在发送、发布、覆盖等动作前人工确认，并按预先约定的标准验收。"}}}, {"id": "50d6b27d03b95d2babdfce78bf", "title": "四、配套资源与勘误", "notes": {"plain": {"content": "附录A提供20条常用指令模板，附录B集中回答20个常见问题，附录C整理书内配套内容、实践路线和核心术语速查。模板只提供任务骨架，使用时仍要补充真实材料、目标受众、权限范围、截止时间和验收标准。\n\n产品界面和规则会持续变化。发现入口失效、版本差异或文字错误时，请通过出版社在成书中最终公布的勘误渠道反馈，并同时提供所在章节、客户端版本、复现步骤和已经脱敏的截图。"}}}, {"id": "7bdb506b177f51ce87b069d056", "title": "五、版本、术语与责任", "notes": {"plain": {"content": "本书以2026年9月3日作为产品事实和操作描述的核查基线。模型名称、按钮位置、套餐、连接器和权限提示仍可能变化，实际使用时应以客户端、官方网站及适用协议的最新说明为准。\n\n本书统一使用“办公Agent”指面向办公任务、能够围绕目标规划步骤并调用工具的智能体系统；“技能”用于复用方法，“连接器”用于接入外部系统，“工作伙伴”强调角色化分工，“工作小队”强调多个智能体协作。“指令”指一次任务说明，“指令模板”指可以重复改写使用的示例。其他英文缩写均在首次出现时说明全称和中文含义。\n\n书中案例用于教学，示例企业、人物和数据不代表真实对象；涉及产品界面、第三方标识、人物肖像、效果数字和认证材料时，应核对来源、授权与适用范围。AI可以参与整理、生成、分析和部分操作，但输入范围、授权决定、结论采纳和对外交付始终由使用者及其所在组织负责。"}}}, {"id": "4e405b39a46a50fb950d320ec1", "title": "六、关于AI辅助与致谢", "notes": {"plain": {"content": "本书在资料整理、语言校对和格式核查环节使用了生成式AI辅助。章节结构、案例取舍、事实核验和最终表述均由作者审阅确认，内容责任不因使用工具而转移。\n\n感谢参与案例验证、内容审阅和出版沟通的编辑与读者。你们对“能否真正完成工作”的持续追问，使这本书没有停留在功能展示，而是回到可靠、可控和可交付的工作方法。\n\n王树江、萧尘、袁从德\n\n2026年9月湖北"}}}]}, "notes": {"plain": {"content": "上午收到会议录音、历史方案和一张数据表，下午就要交出纪要、行动清单和汇报材料。对话式人工智能（Artificial Intelligence，AI）可以生成文字、提炼要点并解释数据，但把零散结果变成能够提交和继续推进的成果，仍需要人寻找材料、核对事实、衔接步骤并承担责任。\n\n智能体（Agent）面向办公任务时，试图缩短的正是“生成内容”与“完成工作”之间的距离。它可以围绕目标规划步骤，在获得授权后使用文件、浏览器、办公软件和协作平台，也会因目标含糊、材料过期、权限过宽或验收缺失而偏离任务。本书将这类系统统一称为“办公Agent”，并不追逐“一句话完成所有工作”的口号，而是提供一条更可靠的主线：目标—上下文—执行—验收—治理。"}}}, {"id": "f916102d22ca5ab3bf72c26b4f", "title": "第一篇　认识与上手篇", "children": {"attached": [{"id": "ch1", "title": "第1章　认识豆包工作：产品定位与能力边界", "children": {"attached": [{"id": "40195d54c5135afda58afeb086", "title": "1.1　AI办公进化史：从聊天机器人到Agent", "children": {"attached": [{"id": "e89a57fbc2215a9ea37bcb4d12", "title": "1.1.1　三次能力跃迁：从回答问题到推进任务", "notes": {"plain": {"content": "办公类AI的发展并不是界线分明的三次替代，而是三类能力不断叠加的过程。表1-1进一步比较各阶段的主要能力、人的工作和典型交付，便于读者理解三次跃迁改变了什么。\n\n第一阶段解决的是“能不能理解并生成内容”。用户通过对话获得文字、图片或建议，但仍要亲自完成资料搬运、排版和软件操作。第二阶段让模型获得了更丰富的输入形式和工具入口，AI开始能够读取文件、检索信息和执行计算，但任务通常仍由人逐步推动。\n\nAgent化执行进一步把这些能力组织成连续流程。用户给出的不再只是某一步指令，而是包含交付标准的任务目标；系统据此规划步骤、调用工具，并在权限允许的范围内推进工作。三个阶段并非彼此排斥：成熟的办公Agent仍然需要对话生成和多模态能力，只是把它们纳入了更完整的任务链。"}}}, {"id": "4d73972696c45aaca82bf4b589", "title": "1.1.2　Agent的核心：目标、工具与反馈闭环", "notes": {"plain": {"content": "如果把Agent的运行机制压缩为一条主线，就是目标进入系统后经过理解、规划和执行，再由交付结果触发核验与调整，如图1-2所示。\n\n传统对话式AI通常以一次输入和一次输出为基本单位，Agent则以任务是否完成为判断标准。它的工作过程可以概括为四个环节：\n\n理解目标：识别任务对象、预期成果和限制条件；信息不足时，应向用户确认。\n\n拆解任务：把复杂目标转化为有先后关系的可执行步骤。\n\n调用工具：根据需要读取文件、检索网页、处理数据或生成文档。\n\n持续校验：根据中间结果调整路径，遇到授权、风险或关键判断时交还给用户。\n\n以会议纪要为例，对话式AI可以根据用户粘贴的文本生成摘要；办公Agent则可能在授权目录中找到原始材料，整理议题和行动项，生成指定格式的文档，并把结果保存到约定位置。两者的区别不在于某一段文字谁写得更好，而在于谁负责衔接任务链。\n\n因此，Agent并不意味着系统可以脱离人独立负责。它更接近一种可被委托的执行机制：AI承担规划和操作，人负责明确目标、控制权限、处理关键选择并验收结果。后续章节中的指令设计、过程接管和安全设置，都建立在这一分工之上。"}}}, {"id": "089a0e844a9d55f4bd94a571b4", "title": "1.1.3　从“生成内容”到“完成工作”，中间还差四道关", "notes": {"plain": {"content": "一段文字已经生成，不等于一项工作已经完成。真实办公任务往往还包含材料确认、格式转换、多人协作和结果发布。只要其中一个环节没有处理好，语言再流畅的内容也可能无法交付。理解Agent价值时，可以把“生成”与“完成”之间的差距拆成四道关。\n\n第一道是输入关。系统是否拿到了正确、完整且允许使用的材料？同名文件、过期版本和口径冲突，都会让后续工作建立在错误基础上。第二道是衔接关。结果是否能够进入下一环节，例如数据表能否被报告引用，报告中的结论能否转化为演示文稿，行动项能否进入团队跟踪工具。第三道是核验关。事实、数字、格式和操作范围是否经过检查，异常是否被明确标出。第四道是责任关。谁批准、谁发送、谁对外解释，必须在交付前清楚，而不能由系统根据上下文猜测。\n\n以“制作月度经营分析”为例，生成模型可以根据一张表写出分析文字；完整任务却至少要经历版本核对、字段解释、数据清洗、指标计算、异常复查、图表制作、管理层摘要和文件归档。若报告还要发给业务负责人，就要增加收件对象、敏感字段和发送前确认。Agent的作用，是把这些步骤组织成可见的任务链；人的作用，是决定口径、边界和最终行动。"}}}]}, "notes": {"plain": {"content": "豆包工作并不是凭空出现的产品。在它背后，大模型负责理解和生成内容；多模态理解让系统不只处理文字，还能读取图片、语音和文件；工具调用则让系统在获得授权后使用搜索、计算和办公软件。把这些能力组织到一条任务链中，才形成了桌面办公Agent。回顾这段演进，可以帮助我们理解一个关键变化：AI的价值重心正在从“生成一段内容”转向“推进一项任务”。"}}}, {"id": "782f11c736065226b88b885392", "title": "1.2　豆包工作的发布背景与产品定位", "children": {"attached": [{"id": "89459a24d5bc556dacffe7691f", "title": "1.2.1　从分散能力到统一任务入口", "notes": {"plain": {"content": "据新华社2026年8月25日报道，豆包工作于当日正式发布。结合发布时的桌面客户端、豆包电脑端工作模式和飞书相关入口，可以看到它同时面向个人桌面任务与团队协作场景。本书记录的是截至2026年9月3日的早期产品形态，不把发布初期展示的入口视为长期不变的产品结构。\n\n在此之前，字节体系内已经存在大模型、智能体编排、开发工具和协同办公等不同产品能力。豆包工作的意义，不只是增加一个品牌，而是尝试把这些能力放在统一的任务入口中：用户不必分别理解模型、工具和工作流，只需要围绕目标组织材料、权限和验收要求。\n\n发布初期的体验权益和套餐安排具有明显时效性，不能作为长期使用判断。读者在安装或订阅前，应以官方页面和客户端显示为准。本书更关注相对稳定的产品逻辑，而不是可能随版本变化的价格与额度。"}}}, {"id": "1f5c87dd82055aa19ef1bb16cb", "title": "1.2.2　产品定位：面向生产力场景的桌面办公Agent", "notes": {"plain": {"content": "根据发布时的产品说明，豆包工作的基本定位是围绕用户目标拆解任务、调用工具，并持续推进较为复杂的工作流程。这里包含三个彼此关联的要点。\n\n首先，它服务于办公任务，而不是以闲聊为主要目的。会议纪要、项目方案、数据分析、演示文稿和资料调研等具有明确交付物的工作，更符合它的使用场景。其次，它以桌面应用为主要形态，因此可以在用户授权后读取指定文件、操作浏览器或调用相关工具。最后，它采用目标驱动的交互方式：用户说明要完成什么、材料在哪里以及结果应达到什么标准，系统负责组织中间步骤。图1-3展示了这种任务入口在桌面界面中的基本形态。\n\n“桌面办公Agent”并不等于无限制地接管电脑。可执行范围取决于产品当前提供的能力、用户主动授予的权限以及具体任务的风险等级。涉及登录、发送、覆盖或删除等操作时，仍应由用户确认。理解这一点，是正确使用产品的前提。"}}}, {"id": "88fd8f4362c050419b48e6c653", "title": "1.2.3　三层认知：助手、工具使用者与受控执行者", "notes": {"plain": {"content": "为了避免把豆包工作简单理解成“更强的聊天窗口”，可以从三个层次认识它。\n\n办公助手：理解自然语言需求，整理信息并生成内容。\n\n工具使用者：根据任务调用文件、浏览器、文档、表格或演示工具。\n\n受控执行者：在授权边界内连续推进任务，并把关键决定和最终验收留给用户。\n\n三个层次并非互相替代，而是从内容支持逐步延伸到受控执行；图1-4呈现了它们之间的递进关系。\n\n这三层能力对应不同的使用责任。重复、耗时、规则相对明确的环节可以更多交给AI，例如资料归类、初稿生成和批量处理；涉及业务判断、价值取舍和对外责任的环节，则应由人把关。所谓“把工作交给AI”，本质上是重新划分执行分工，而不是转移最终责任。"}}}, {"id": "929e9119d80950a1a93ea9b6c2", "title": "1.2.4　产品能力来自模型、工具与工作流的组合", "notes": {"plain": {"content": "模型决定理解、推理和生成的基础水平，工具决定系统能够接触哪些文件、软件与服务，工作流则把多个动作组织成可交付的过程。三者缺一不可：只有模型，产品仍可能停留在对话；只有工具，系统又缺乏对任务的理解和规划；只有流程框架而缺少模型与工具，任务也无法真正执行。\n\n客户端可能根据版本和套餐提供不同的模型或运行模式。一般而言，响应更快的模式适合格式整理、内容改写等轻量任务，推理和工具能力更完整的模式更适合多文件分析、深度调研和跨应用流程。由于模型名称、额度和套餐会随产品更新而变化，使用时应以客户端和官方说明为准，不宜把某个版本名称当成永久不变的能力边界。\n\n从发布时重点展示的功能看，豆包工作的产品方向可以归纳为四类：\n\n局部编辑：对文档、表格、演示文稿或网页中的指定区域进行修改，降低整份内容重新生成带来的返工。\n\n桌面与云端执行：在可观察的环境中运行任务，并为部分长流程提供后台执行能力。"}}}]}, "notes": {"plain": {"content": "理解了Agent的工作逻辑，还需要把这一概念落到具体产品上。豆包工作面向生产力场景，把大模型的理解与生成能力接入桌面环境、文件系统、浏览器和协作平台，使一次自然语言请求有机会被转化为连续的办公操作。要理解这种产品形态，首先需要回到它形成的背景。"}}}, {"id": "9564d43ccee153e29896344c0d", "title": "1.3　豆包工作与豆包：定位和使用边界", "children": {"attached": [{"id": "d78188a20ffd5c5a9dfd0b6801", "title": "1.3.1　从对话支持到任务执行", "notes": {"plain": {"content": "为了避免只凭产品名称判断，表1-3从任务起点、过程、工具使用和交付方式等维度比较两类入口。"}}}, {"id": "491cecb938355ae1b1ed9358c2", "title": "1.3.2　按任务尺度和复杂度选择运行方式", "notes": {"plain": {"content": "判断使用哪个入口，可以先问三个问题：任务是否需要读取或生成文件？是否需要跨网页、软件或协作平台完成多个步骤？是否允许系统在一段时间内持续执行？如果答案大多是否定的，普通对话已经足够；如果答案大多是肯定的，则更适合创建办公任务。\n\n同一项工作也可以分阶段使用两种工具。例如，先在豆包中讨论主题和观点，再把确认后的目标交给豆包工作整理资料并生成正式文档。这样既保留了对话探索的灵活性，也利用了Agent在执行和交付方面的优势。\n\n工作任务通常还会提供侧重速度或侧重复杂推理的不同模式。选择时不必先研究全部技术参数，可以从任务成本出发；表1-4给出了按任务特征判断的基本思路。\n\n这里讨论的是选择方法，而不是固定套餐结论。产品版本和计费方式可能变化，但“轻任务先试跑、复杂任务再升级、高风险任务加强人工控制”的原则相对稳定。"}}}, {"id": "191c143e34ba5488b7999232f5", "title": "1.3.3　用“明确度×影响度”决定委托深度", "notes": {"plain": {"content": "是否把任务交给Agent，不能只看它能不能做，还要看规则是否明确、结果会造成多大影响。可以把任务放进“明确度×影响度”的二维框架中：明确度指输入、步骤和验收标准是否清楚；影响度指结果是否会改变原文件、进入外部系统、影响资金或人员权益。表1-5列出四类典型任务及其合适的委托方式，便于把这两个维度落实到具体选择上。\n\n这个框架解释了为什么同一种技术能力在不同任务中应有不同用法。批量重命名测试目录中的文件与批量重命名正式项目资料，操作动作相似，影响程度却完全不同；根据明确标准检查简历字段与自动决定淘汰候选人，都可能读取同一批材料，但后者涉及人员权益和组织责任。\n\n实际使用时，可以先把任务拆成准备、判断和执行三个部分。Agent负责收集材料、生成草案、检查完整性等准备工作；证据不足或需要权衡的部分由人判断；发送、覆盖、删除和提交等高影响动作单独设置确认点。这样既不会因担心风险而放弃全部自动化，也不会因为系统能够操作就把决定权一并交出去。"}}}, {"id": "e36a6251267058b9acfc591c7f", "title": "1.3.4　从一项真实工作练习分层委托", "notes": {"plain": {"content": "第一次判断委托边界时，可以选择一项熟悉的工作，把它从“一个任务”拆成若干性质不同的环节。以季度业务复盘为例，它至少包含材料收集、数据整理、问题分析、建议形成、汇报制作和正式沟通。若只问“能不能让AI做季度复盘”，答案过于笼统；逐环节判断后，边界会清楚得多。\n\n材料收集和格式统一通常明确度较高，只要目录、时间范围和文件规则清楚，可以在副本上连续执行。数据整理还需要确认字段和口径，适合先试跑再扩大。问题分析涉及原因判断，Agent可以提出线索和反例，但必须保留证据与不确定性。建议形成牵涉业务取舍，应由负责人决定。PPT初稿可以自动生成，正式汇报和资源承诺则不能转交。\n\n拆解时可以给每个环节写四个标记：输入是否稳定，结果能否检查，错误是否容易恢复，是否会影响他人。四项都较明确的环节适合先委托；结果难以检查或一旦出错影响较大的环节，即使技术上能够执行，也应停在草稿、预览或建议状态。"}}}]}, "notes": {"plain": {"content": "豆包与豆包工作共享品牌和部分基础能力，因此容易被理解为同一产品的两个名称。更准确的看法是：豆包偏向通用问答与内容生成，豆包工作偏向桌面环境中的任务执行。二者可以配合使用，但面对的任务尺度和交互方式不同。"}}}, {"id": "508e6f396d76508fad8eadec25", "title": "1.4　与同类产品的比较：从功能清单回到工作上下文", "children": {"attached": [{"id": "6768696b75385d38b5d419ddfe", "title": "1.4.1　主要产品格局与定位差异", "notes": {"plain": {"content": "截至本书成稿时，市场中的代表性产品大致可以按生态入口和主要用户分为以下几类。产品更新速度很快，表1-6用于说明定位差异，不作为永久的功能或排名结论。"}}}, {"id": "c2f11a5060125166b3723225ea", "title": "1.4.2　豆包工作的差异化重点", "notes": {"plain": {"content": "豆包工作的特点可以从三个相互关联的层面理解。第一是桌面执行，它把文件、浏览器和办公产物放入同一任务链；第二是云端与远程形态，使部分长任务可以脱离当前设备持续运行；第三是与飞书的连接，使组织内已有的聊天、文档、会议和日程有机会成为任务上下文。\n\n其中，企业上下文尤其值得关注。通用模型可以写出结构完整的内容，却未必知道一家公司的项目历史、术语、协作关系和决策背景。如果用户每次都要重新上传资料并解释背景，Agent节省的时间会被输入成本抵消。反之，在明确权限的前提下复用既有工作信息，任务结果才可能真正贴近组织实际。\n\n这种差异也有适用条件：企业上下文只有在资料质量较高、权限体系清楚且团队持续沉淀知识时才会形成价值。如果组织并不使用飞书，或信息本身分散、过期，其他生态的产品可能更合适。因此，所谓优势不是脱离场景的产品排名，而是产品能力与用户工作环境之间的匹配程度。"}}}, {"id": "89a7536f47b45f009ad1a71837", "title": "1.4.3　不要看一次演示，用同一项真实任务做选型测试", "notes": {"plain": {"content": "产品演示通常选择材料整齐、路径顺畅的场景，难以反映日常工作中的版本冲突、字段缺失和人工确认。更可靠的选型方法，是挑选一项每周都会发生、耗时可记录、失败后影响可控的真实任务，让候选工具在相同条件下完成小规模试跑。\n\n试跑前先记录人工基线：原来需要多少时间、经历多少次复制粘贴、最常见的错误是什么、最终由谁验收。随后为所有候选工具提供同一组脱敏材料、同一份任务说明和同一套交付标准。评价时不要只比较生成速度，可以从五个维度记录结果。\n\n输入成本：为了让系统理解任务，需要整理多少材料、补充多少背景。\n\n过程稳定性：是否经常找错文件、偏离步骤或在同一位置反复尝试。\n\n结果质量：事实、结构、格式和可编辑性是否达到使用要求。\n\n纠错成本：出现偏差后能否保留正确部分，还是只能全部重来。\n\n治理成本：权限、日志、共享、回收和责任确认是否适合当前组织。\n\n可以采用五级记录，但评分前必须写清每一级的含义。例如，“结果质量5分”可以定义为“无需事实修正，只需常规文字润色”；“过程稳定性2分”可以定义为“出现影响结果的错误，且无法从检查点恢复”。没有定义的总分看起来精确，却很难帮助决策。"}}}]}, "notes": {"plain": {"content": "把豆包工作放入智能办公市场中观察，可以看到不同厂商正在沿着相似方向扩展：从对话生成进入文件处理、桌面操作、流程自动化和企业协作。表面的功能越来越接近，因此，比较产品时不能只计算“会多少功能”，还要看它能否进入用户真实的工作环境。"}}}]}, "notes": {"plain": {"content": "生成文字、回答问题、制作图片，曾是人们对办公类AI最直观的认识。然而，真正把一项工作推进到交付，还要寻找材料、衔接工具、处理异常并核对结果。随着系统逐渐具备任务拆解和工具调用能力，办公智能化开始从“提供内容”走向“推进任务”，豆包工作也由此与传统聊天机器人形成了区别。\n\n理解这种产品不能只看功能清单。本章将沿着AI办公工具的演进，解释Agent的工作逻辑、豆包工作的产品定位与能力边界，再通过同类产品比较说明它更适合处理哪些任务，以及哪些决定仍应由人保留。"}}}, {"id": "ch2", "title": "第2章　快速上手：完成第一个办公任务", "children": {"attached": [{"id": "a91b6837997e56b38101fac652", "title": "2.1　第一步：选择使用入口并完成安装", "children": {"attached": [{"id": "efbd221b42105f13abc3af3e9b", "title": "2.1.1　选择适合自己的入口", "notes": {"plain": {"content": "不同起点对应的建议入口和检查事项见表2-2。该表用于帮助读者确定起步位置，其中的入口名称仍应以当前产品界面为准。\n\n首次安装应从豆包官方桌面端下载页或产品当前公布的其他正式入口获取安装包，不要使用来源不明的网盘、论坛附件或第三方打包版本。判断依据应是doubao.com官方域名、页面发布主体和安装包签名，而不是搜索结果中的宣传标题。\n\n已经安装豆包桌面版的读者，可以先完成更新，再查看是否存在办公任务或工作模式入口。如果当前客户端没有相应功能，不宜根据旧截图反复寻找，应返回官方页面核对版本和开放范围。"}}}, {"id": "13a8b4bb16ee527ba8f247ca7a", "title": "2.1.2　完成安装并确认结果", "notes": {"plain": {"content": "安装过程可以按以下顺序进行：\n\n在官方页面选择与当前操作系统和处理器架构匹配的安装包；\n\n下载完成后，核对文件来源，再按系统提示安装；\n\n首次启动时，阅读系统和客户端显示的权限提示，不急于一次全部允许；\n\n进入登录页面后，确认应用名称、版本信息和更新入口可以正常显示。\n\n不同版本对操作系统和硬件的要求可能变化。安装前应以下载页面列出的当期系统要求为准；企业设备还可能受到软件白名单、代理网络或终端管理策略限制。\n\n安装成功的标准不是“桌面上出现了图标”，而是客户端能够正常启动、进入正式登录页面，并能从设置或关于页面查看版本。如果安装失败，应先记录错误提示，核对安装包与系统是否匹配，再检查磁盘空间、网络和企业设备策略，不要连续下载多个不明版本尝试覆盖安装。"}}}, {"id": "791b674af46251739689811fad", "title": "2.1.3　为首次使用保留一份环境记录", "notes": {"plain": {"content": "产品仍处在持续迭代中，同一个按钮的位置、权限名称或可用入口都可能发生变化。首次安装后花两分钟记录环境，能为后续排错省下大量时间。记录不必包含账号密码或验证码，只需保留与复现有关的信息：客户端版本、操作系统版本、安装来源、登录方式、任务运行环境，以及完成首次测试的日期。\n\n建议把记录保存为练习目录中的环境说明.txt，内容可以采用下面的结构：\n\n这份记录有三个用途。第一，书中界面与当前界面不一致时，可以判断是版本变化还是操作错误；第二，向技术支持反馈问题时，能够提供完整环境，而不是只说“打不开”；第三，团队成员复现实验时，可以看出结果差异是否来自不同版本或权限。环境记录属于运行说明，不应写入账号凭证、个人隐私和企业敏感信息。"}}}]}, "notes": {"plain": {"content": "豆包工作以桌面任务为主要使用场景。开始操作前，应先确认自己的使用起点：尚未安装客户端、已经安装豆包桌面版，或准备通过组织提供的飞书入口使用。入口不同，后续看到的界面和可用能力也可能不同。为避免在演示过程中更换环境，表2-1先固定本章操作基线，后续再按安装、登录、创建、环境设置和验收五个步骤完成练习。\n\n如果读者看到的界面与图示不同，应先在“设置”或“关于”中记录客户端版本，再核对任务入口、运行环境和项目目录三个关键位置；其中任何一项不存在时，先查阅产品官网和当前帮助页面，不要猜测替代按钮。"}}}, {"id": "a897c6931f8054a9a7a842c536", "title": "2.2　第二步：选择与任务匹配的登录身份", "notes": {"plain": {"content": "登录不仅决定“用哪个账号进入”，还会影响系统能够访问哪些资料、成果保存到哪个空间，以及管理员是否能够执行组织级管理。因此，应先判断任务属于个人工作还是企业协作，再选择身份。图2-1并列呈现个人身份与企业身份的资料边界，重点不是入口名称，而是账号所连接的数据空间与组织权限。\n\n客户端可能根据版本和地区提供手机号、豆包体系账号或其他授权登录方式，具体以登录页面为准。表2-3按任务情境归纳身份选择原则，重点是避免个人资料与组织资料混用。\n\n账号体系、跨端权益和组织管理员可见范围会影响数据边界。使用前应阅读当前的账号与隐私说明；账号范围可参见豆包官方发布的《豆包账号服务须知》，个人信息处理规则参见《豆包隐私政策》，企业内部使用还应符合所在组织的制度。\n\n完成这一步后，不要立即导入真实敏感材料。先用一份无敏感信息的练习文件创建任务，确认身份和保存空间正确，再进入后续设置。"}}}, {"id": "96654bc8fb605175b9a8b5a908", "title": "2.3　第三步：创建第一个办公任务", "children": {"attached": [{"id": "899d93c61890593884271e52ce", "title": "2.3.1　沿着任务流程认识界面", "notes": {"plain": {"content": "从任务流程观察界面时，主要需要辨认创建、执行、材料和结果四类区域。表2-4说明它们各自承担的作用，以及首次使用时需要确认的内容。"}}}, {"id": "d2848f7d79245398990311f40f", "title": "2.3.2　照着界面创建练习任务", "notes": {"plain": {"content": "截至本书操作基线，创建练习任务可以按下面的顺序完成。图1-3展示了真实桌面界面的整体位置，图2-2用于说明各区域在任务流程中的分工。\n\n打开豆包工作桌面客户端，确认左下角显示的是本次练习要使用的账号。\n\n在左侧栏单击“新工作任务”，让中央工作区进入空白任务状态。\n\n查看输入框下方的运行环境。如果当前不是“本地电脑”，先切换为“本地电脑”。\n\n单击运行环境旁的“项目”，选择已经建立的“豆包工作”练习目录。不要选择桌面、下载目录或磁盘根目录。\n\n在输入框中粘贴下面的测试指令并发送：\n\n请不要读取或修改任何文件。先把“将会议记录整理成正式纪要”这个任务拆成步骤，并列出开始前需要我提供的信息。\n\n等待系统给出任务计划。此时不要批准文件、浏览器或发送权限；如果系统主动申请与测试无关的权限，拒绝授权并检查指令是否发到了正确任务。\n\n完成标志有三项：左侧任务列表出现新任务，中央区域显示任务计划或待补充信息，底部仍显示“本地电脑”和正确的项目目录。这条测试不追求最终文件，只验证任务入口、运行环境和基本交互是否正常。完成后保留该任务，后续直接在其中继续会议纪要练习。"}}}, {"id": "8733b65b5f755dcea29ecfc350", "title": "2.3.3　区分对话与办公任务", "notes": {"plain": {"content": "对话模式适合解释概念、润色短文本和讨论思路；办公任务适合读取资料、连续调用工具并交付文件。两者不是能力高低之分，而是对应不同的任务尺度。表2-5把常见需求与更合适的使用方式对应起来。\n\n如果当前界面没有明确的模式切换按钮，可以直接寻找“新建任务”“办公任务”或类似入口。功能名称可能改变，但判断标准保持不变：是否需要系统在一段时间内围绕目标连续执行并交付成果。"}}}]}, "notes": {"plain": {"content": "登录后的界面可能与普通对话工具相似，但办公任务的关注点不是“聊了几轮”，而是一个目标如何从创建、执行走向交付。本节不要求读者背下所有区域名称，而是沿着任务流认识界面。图2-2标出任务入口、执行过程和成果区域，读者可以据此理解“发起—观察—验收”的基本顺序；实际界面若因版本不同而变化，应以各区域承担的功能为准。"}}}, {"id": "9d6ce515d8655bc4acca536282", "title": "2.4　第四步：建立独立、可控的工作环境", "children": {"attached": [{"id": "e6381dba3a385329a21a638682", "title": "2.4.1　建立专属工作目录", "notes": {"plain": {"content": "可以为练习任务建立如下目录：\n\n“输入材料”只放本次任务需要读取的文件，“输出成果”用于保存新生成的内容，“原始备份”保留一份不参与处理的副本。首次练习不要使用桌面、下载目录、整个文档目录或磁盘根目录作为授权范围，这些位置通常混有大量与任务无关的个人资料。\n\n目录的价值不只是安全隔离。它还能帮助用户明确数据源和输出位置，减少系统读错同名文件或覆盖原稿的概率。任务完成后，通过比较输入、输出和备份，也更容易检查系统实际改动了什么。"}}}, {"id": "be4e9bbf7e0c5f35bdbfc758f9", "title": "2.4.2　按任务授予必要权限", "notes": {"plain": {"content": "办公任务可能根据需要访问浏览器页面、读取屏幕信息或进行点击和输入；登录、安全验证等步骤仍可能要求用户接管。具体权限名称取决于操作系统和客户端版本，应以弹窗实际说明为准。表2-6用典型操作说明权限需求及首次练习时的授权建议。\n\n在条件允许时，应优先使用只读权限；需要写入时，要求系统另存为新文件。发送消息、覆盖文件、删除内容和涉及账号安全的操作不应默认自动执行。\n\n完成设置后，可用下面的清单进行首次检查：\n\n当前登录身份与任务场景一致；\n\n授权目录只包含本次练习资料；\n\n原始文件已经备份；\n\n输出目录与文件命名规则已经确定；\n\n高风险操作仍需单独确认；\n\n知道从哪里暂停、终止任务或撤销权限。\n\n这些措施能够降低误操作风险，但不能保证任务绝对安全。豆包官方发布的《豆包隐私政策》提示相关功能存在误操作可能，用户应核对网站规则，并在必要时接管。"}}}, {"id": "4c36707919395676a70a6c1fa1", "title": "2.4.3　把材料整理成一个可交接的任务包", "notes": {"plain": {"content": "独立目录解决了“AI可以看哪里”的问题，还需要进一步解决“它应该使用什么”。材料越多，系统越容易遇到同名文件、过期版本和信息冲突。首次任务虽然只有一份会议记录，也建议从一开始建立任务包意识。\n\n一个最小任务包通常包含四类内容：原始材料、任务说明、输出目录和验收依据。原始材料是事实来源；任务说明写清目标和边界；输出目录隔离新成果；验收依据可以是组织模板、字段清单或一份经过确认的示例。四类内容彼此分开，任务失败时才能判断问题出在输入、要求、生成过程还是验收标准。\n\n对于多文件任务，可以增加一份材料清单.md或材料清单.xlsx，至少记录文件名、用途、版本日期和是否允许修改。表2-7给出一份最小材料清单示例，实际使用时可按任务增加来源、负责人或保密级别等字段。\n\n材料清单不只是给AI看，也是交接给同事和自己日后复查的依据。如果两个文件内容冲突，不要在清单里直接判断谁对谁错，而应标出冲突并指定确认人。若某份材料包含与任务无关的敏感字段，应先制作脱敏副本，而不是依赖指令要求系统“忽略”。"}}}]}, "notes": {"plain": {"content": "创建任务之后，先不要把整个磁盘或常用文档目录交给AI。首次使用应建立一个范围清楚的工作目录，并根据任务需要逐项授权。这一步决定系统能够接触什么，也是后续排查问题和恢复文件的基础。"}}}, {"id": "b43d20a64ac75b1bae3eb0a94c", "title": "2.5　第五步：完成并验收会议纪要任务", "children": {"attached": [{"id": "bd96ae8b628d59259b48fe78a9", "title": "2.5.1　准备材料并下达任务", "notes": {"plain": {"content": "将一份不含敏感信息的会议文字稿放入“01-输入材料”。首次练习优先使用文字稿，而不是同时引入录音转写、网络检索和外部发送，这样更容易定位问题。\n\n示例指令\n\n请读取“01-输入材料”中的「会议记录.txt」，整理为一份正式会议纪要。纪要包含会议主题、时间、参会人员、各议题讨论要点、明确结论和行动项。行动项用表格呈现，列出事项、负责人和截止时间；材料中无法确认的信息标注“待确认”，不要自行补写。请将结果另存到“02-输出成果”，文件名为「项目会议纪要.docx」，不要修改或移动原文件。\n\n这条指令同时说明了数据源、交付结构、事实边界和保存方式。真实任务还可以补充会议背景、目标读者或组织模板，但第一次试跑不宜叠加过多要求。"}}}, {"id": "b2e3750e069e5b16aeb98181f8", "title": "2.5.2　观察执行并处理确认", "notes": {"plain": {"content": "任务开始后，不必盯住每一个细小动作，但要检查几个关键节点。表2-9列出各节点的正常表现和需要介入的信号。\n\n如果负责人、日期或结论无法从材料中确认，应允许系统保留“待确认”。不要为了得到一份表面完整的纪要而让模型猜测。方向出现偏差时，越早暂停和纠正，返工成本越低。"}}}, {"id": "58c6b353c7d15359a5cef007b2", "title": "2.5.3　验收结果并处理常见故障", "notes": {"plain": {"content": "打开生成文件后，从四个维度验收：\n\n完整性：主要议题、明确结论和行动项是否覆盖；\n\n准确性：人名、数字、日期和责任人是否与原文一致；\n\n可执行性：行动项是否包含事项、负责人和截止时间；\n\n文件安全：成果是否另存，原始文件是否保持不变。\n\n发现问题时，应提出局部、可验证的修改要求，例如“核对第三项决议与原文”“把缺少负责人的行动项标记为待确认”“把行动项改为表格，但不要改动正文事实”。修改后要重新检查受影响区域，不能假定局部编辑一定不会改变其他内容。\n\n首次任务常见问题可以按下面的方法处理：\n\n找不到文件：确认文件位于授权目录、文件名与指令一致，并检查格式能否正常打开；\n\n系统反复请求权限：核对任务是否真的需要该权限，不为消除提示而盲目允许；\n\n结果过于笼统：补充会议背景、读者和输出结构，不要只要求“写得更详细”；\n\n内容出现猜测：要求逐项回到原文，并把没有依据的信息列入待确认清单；"}}}, {"id": "f3f7b6161f04587985855a07b1", "title": "2.5.4　第一次任务验收卡", "notes": {"plain": {"content": "关闭任务前，按照表2-10的六项标准做一次快速确认。它们全部满足，才算真正完成第一次交付。\n\n如果其中一项不能回答“是”，不要用重新生成整份文档掩盖问题。回到对应步骤修正，再只复核受影响的内容。"}}}, {"id": "1cda1c4a3d095b2ea757d5a897", "title": "2.5.5　把第一次成功变成可以重复的流程", "notes": {"plain": {"content": "成功生成一份纪要，只能证明这组材料在这一次运行中得到了可用结果。要把它变成稳定方法，还需要再做两次有目的的测试：一次更换材料，检查流程能否适应正常变化；一次加入可控异常，检查系统能否停在正确位置。\n\n第二次测试可以换用另一份会议记录，但保持任务说明和输出结构不变。重点观察不同参会人数、不同议题数量和不同记录风格是否会破坏原有结构。如果任务依赖某些偶然措辞才能识别行动项，就要把识别规则写进指令或验收表，而不是把偶然成功当作能力稳定。\n\n第三次测试可以人为留下一个缺失字段，例如删去某项任务的截止日期，或放入两份名称相近但日期不同的记录。合格表现不是系统把空缺“补完整”，而是它能够识别冲突、保留待确认标记并停止作出无依据的判断。异常测试尤其能暴露流程的真实边界。\n\n三次测试后，可把经过验证的内容沉淀为一张任务卡。表2-11列出任务卡至少需要保留的六类信息，便于下一次使用前判断原有流程是否仍然适用。"}}}, {"id": "ac6e3558b6845f0baebc69bb84", "title": "2.5.6　从练习材料切换到真实工作前再过一遍边界", "notes": {"plain": {"content": "完成练习不意味着下一次就可以把真实工作目录整体开放。练习材料通常结构清楚、不含敏感信息，真实任务却可能混有旧版本、个人信息、客户资料和组织模板。切换之前，应把变化写出来：输入多了什么，权限扩大了什么，交付对象是否改变，错误后果是否仍然容易恢复。\n\n第一次真实任务只改变一个主要变量。例如，仍然制作会议纪要，但换成经过批准、已脱敏的内部记录；目录结构、指令、输出格式和人工验收保持不变。若同时加入录音转写、企业知识、外部检索和自动发送，一旦结果出错，就很难判断问题来自哪一环。\n\n真实材料进入练习目录前，由资料负责人确认使用范围。与任务无关的身份证号、电话、客户名单和商业秘密不应因为“文件可能有用”而一并导入；需要引用的人名、项目名和数据可以保留最小范围，其余字段脱敏或删除。组织另有审批要求时，以制度为准。\n\n执行过程中继续保持三个检查点：读取后核对材料清单，生成初稿后核对事实与待确认项，写入或共享前核对文件、对象和权限。任何一步比练习时多出新的授权，都先说明用途。系统若提出浏览器、发送或其他本任务不需要的操作，应暂停并重新检查计划。"}}}]}, "notes": {"plain": {"content": "完成身份、任务和工作环境设置后，可以选择一项输入明确、结果容易检查的任务进行首次试跑。会议纪要适合作为起点，因为它能够同时检验文件读取、信息整理、事实约束和文档生成，而错误也相对容易从原文中核对。"}}}]}, "notes": {"plain": {"content": "第1章形成了一项有边界的试点判断，接下来要用实际操作验证它。认识一款工具，最有效的方式不是继续记忆概念，而是亲自完成一次真实、可控的任务。本章以会议纪要为主线，从安装、身份选择和任务创建开始，建立独立工作目录，最后交付并验收一份可编辑文档。\n\n第一次使用不必追求速度，也不必一次开放全部能力。更重要的是知道系统正在读取什么、执行什么，哪些操作必须由自己决定，出现偏差时又怎样暂停和恢复。后续五个步骤始终使用同一组材料和交付标准，帮助读者建立可复现的操作闭环。"}}}, {"id": "ch3", "title": "第3章　核心概念：理解Agent的工作方式", "children": {"attached": [{"id": "b74a7dd65e98552d945ce666b8", "title": "3.1　Agent怎样完成一项任务", "children": {"attached": [{"id": "1a2ccef589a75d2c83eeea1008", "title": "3.1.1　从一句要求到可执行步骤", "notes": {"plain": {"content": "第一步是理解目标。Agent需要从指令中识别“要解决什么问题”“使用哪些材料”“最终交付什么”。如果用户只说“整理一下这份数据”，系统无法确定需要清洗原表、制作汇总表，还是撰写分析报告。此时的澄清不是多余对话，而是在补齐任务定义。\n\n第二步是拆解任务。目标明确后，Agent会把它转换为一组可以依次执行的步骤。以“制作季度销售分析报告”为例，完整的执行计划通常包括：\n\n读取指定的销售数据，确认文件和字段是否完整；\n\n清理空值、重复项和格式不一致等问题；\n\n计算销售额、增长率、品类占比等指标；\n\n分析趋势、异常及其可能原因；\n\n生成与结论对应的图表；\n\n按约定结构撰写报告并保存到指定位置。\n\n这份计划既是Agent的行动路线，也是用户检查执行方向的依据。计划中如果遗漏了同比口径、数据范围或输出对象，越早补充，返工成本越低。\n\n第三步是执行操作。Agent按照计划读取文件、调用工具、处理数据或访问网页。在支持过程展示的任务中，用户可以看到当前步骤、已完成事项和等待确认的问题。过程信息的价值不在于展示“它很忙”，而在于让偏差能够被及时发现。"}}}, {"id": "77439fe5d3145718ab8e0847a4", "title": "3.1.2　遇到异常时，先判断谁有权决定", "notes": {"plain": {"content": "任务执行中难免出现网页无法访问、文件格式不一致、数据缺失或字段含义不明等情况。判断Agent应当继续尝试还是停下来确认，关键不在于问题大小，而在于现有信息是否足够，以及它是否有权作出决定。\n\n对于不改变任务目标、不会扩大数据范围，也不会产生明显风险的问题，Agent可以在规则允许的范围内尝试替代方案。例如，发现文件编码异常时更换读取方式；网页暂时无法打开时重试；个别字段缺失时保留空值并记录问题。即使能够继续，处理方法也应在交付时说明，方便用户复核。\n\n如果下一步需要猜测事实、改变原始文件、扩大访问范围，或者涉及登录验证、删除、发送和支付等敏感操作，就应由用户确认。不同版本、运行环境和权限设置下，系统何时自动暂停可能有所差异，因此不能只依赖弹窗拦截；用户还应在指令中写清操作边界，并检查最终结果。\n\n这一原则可以简化为一句话：可逆且边界明确的操作可以继续，涉及判断权或明显风险的操作必须确认。它贯穿后续所有办公场景。"}}}, {"id": "7deb67ddade15a849dcb270db3", "title": "3.1.3　上下文与任务状态决定下一步是否可靠", "notes": {"plain": {"content": "Agent并不是只根据用户刚说的一句话行动。它还需要结合本次任务已经确认的目标、当前可用的材料、前面步骤的结果以及外部软件或网页的实际状态，才能决定下一步。把这些信息笼统地称为“上下文”，容易误以为内容越多越好；更准确的做法，是把上下文分成四类并分别管理。\n\n第一类是任务定义，包括目标、范围、交付物和禁止事项。它决定任务要往哪里走。第二类是输入依据，包括文件版本、数据截止时间、网页来源和用户补充的事实。它决定结论可以建立在什么材料上。第三类是执行状态，包括哪些步骤已经完成、产生了哪些中间文件、哪些问题仍待确认。它决定任务应从哪里继续。第四类是外部状态，例如网页是否仍处于登录状态、源文件是否被他人更新、表单是否已经提交。它决定原计划还能不能直接执行。\n\n四类上下文中，最容易被忽略的是外部状态。假设Agent已经生成一封客户邮件草稿，用户隔了一小时才回来确认；这段时间里，客户可能已经回复，收件人名单也可能发生变化。如果系统只是沿用原计划点击发送，即使草稿本身没有问题，也可能造成重复沟通。又如，数据分析任务在等待口径确认期间，在线表格继续更新，恢复任务时如果不重新固定快照，报告中的数字就可能前后不一致。"}}}]}, "notes": {"plain": {"content": "无论是整理会议纪要、分析销售数据，还是收集公开资料，Agent的执行过程都可以概括为四个环节：理解目标、拆解步骤、执行操作和交付结果。图3-1给出了这条基本链路。"}}}, {"id": "3c2cb9da54e059daaf4b22af19", "title": "3.2　任务在哪里运行，又通过什么工具完成", "children": {"attached": [{"id": "2d9f80e39ab25883b443a783f8", "title": "3.2.1　本地与云端：先看材料、软件和数据边界", "notes": {"plain": {"content": "当任务需要读取电脑中的文件，或使用当前设备上安装的软件时，本地环境通常更直接。例如，整理工作目录中的合同、调用表格软件处理数据、按本机字体排版文档，都依赖本地文件和软件资源。\n\n本地环境的优势是材料衔接自然，用户也便于随时查看和接管。但它同样受设备状态影响：电脑休眠、网络中断、软件弹窗或文件被占用，都可能让任务暂停。因此，“适合本地”并不等于“可以无人值守”，尤其是步骤较多、依赖多个软件的任务，更需要设置中间检查点。\n\n云端环境适合不依赖本机专用软件、能够在远程环境中独立完成的任务，例如部分批量处理、持续性资料整理或后台执行任务。它的价值在于减少对当前设备的持续占用，而不是简单地把所有长任务都搬到云端。\n\n选择云端之前，至少要回答三个问题：材料是否允许进入云端环境，任务是否依赖本机文件或专用软件，当前版本是否支持所需能力。只要其中一项不满足，就应调整材料范围、改变执行方式，或继续使用本地环境。具体的持续运行、远程查看和接管能力，以当前客户端提供的功能为准。"}}}, {"id": "79deab8bad6c59948b1d5fa3fc", "title": "3.2.2　浏览器是工具入口，不是第三个执行地点", "notes": {"plain": {"content": "浏览器常用于搜索公开资料、读取网页、跨页面比较和填写表单。它可以参与本地任务，也可能被云端任务调用。因此，决定是否使用浏览器时，重点不是“选哪台电脑”，而是网页是否可访问、信息来源是否可靠，以及操作是否涉及账号和外部提交。\n\n浏览器任务尤其需要设置边界。公开资料可以按指定字段收集，但页面中的广告、转载内容和过期信息不能自动视为可靠证据；登录、验证码和安全校验通常需要用户处理；提交表单、发布内容或发送信息之前，应再次核对对象与内容。实际可用操作取决于页面限制、账号状态、权限设置和客户端版本。\n\n选择执行方式时，可以用表3-1快速判断任务更适合在哪种环境中运行，以及是否需要调用浏览器。\n\n一项任务可以组合使用多种方式。例如，先通过浏览器收集公开资料，再回到本地生成报告；也可以先在本地完成脱敏，再把允许处理的材料交给云端。选择的依据始终是数据位置、工具依赖和风险边界，而不是追求某一种看起来更“自动”的模式。"}}}]}, "notes": {"plain": {"content": "讨论Agent能力时，常见的混淆是把“任务运行在哪里”和“任务使用什么工具”当成同一个问题。本地电脑与云端环境回答的是执行位置；浏览器、文档软件和表格软件回答的是工具入口。先分清这两个层次，才能正确判断一项任务能否执行，以及怎样执行更合适。"}}}, {"id": "0bba83d5ad8259379665774432", "title": "3.3　把要求写成可执行、可验收的指令", "children": {"attached": [{"id": "9c3dc04e14be5092ba57921d54", "title": "3.3.1　四类信息共同定义一项任务", "notes": {"plain": {"content": "四个要素并不是四句固定口令，而是对任务的四个基本问题作出回答。表3-2把每个要素对应的问题、模糊写法和改进方式并列呈现。\n\n目标应当具体到可以逐项检查。例如，“完成销售分析”仍然过于宽泛；说明分析周期、指标和关注对象后，用户才能判断结果是否达标。数据源则要交代文件、目录、网页或文档的准确位置；多文件任务还应说明处理全部文件还是指定文件，以及发现版本冲突时采用什么规则。\n\n输出格式决定交付物的用途。同样一组材料，可以生成明细表、管理层摘要或演示文稿，它们的结构和表达方式完全不同。如果已有范例，可以让Agent参照其栏目和版式，但仍要说明哪些内容必须更新，避免机械照搬。\n\n操作边界规定Agent能够做什么、必须先问什么。例如，只读取不改写源文件；只处理某一时间范围；先生成草稿，不发送给任何人；发现字段缺失时先列出问题，不自行补造数据。边界越接近真实风险，越能帮助双方明确责任。"}}}, {"id": "1586f1b3bab55422861abc6254", "title": "3.3.2　用“初始指令—执行确认—结果验收”逐步收敛", "notes": {"plain": {"content": "高质量指令不等于一次写出很长的文字。对于简单任务，四类信息可以直接写在一段话里；对于复杂任务，更稳妥的做法是先让Agent复述目标和计划，确认后再执行。\n\n示例一：批量提取票据信息\n\n请读取工作目录“待录入票据”中的全部PDF，提取日期、开票方、金额、税额和票据编号，汇总为“票据汇总.xlsx”。无法识别的字段保留为空，并记录对应的原文件名；不要修改、移动或删除源文件。开始处理前，先告诉我识别到多少个文件，以及准备采用的字段结构。\n\n示例二：汇总门店月报\n\n请读取工作目录“门店月报”中的12份月度表格，按统一字段合并，计算各门店年度销售额、月均销售额和同比变化，输出汇总表与异常项清单。发现字段名称或统计口径不一致时，先列出差异并等待确认；结果另存为新文件，不覆盖原表。\n\n执行确认可以检查Agent是否找对材料、理解对指标，并识别出需要人工决定的问题。结果交付后，再按照最初指令逐项验收：文件是否齐全、数据范围是否正确、输出结构是否符合用途、边界是否被遵守。这样，指令就不再是一次性的“许愿”，而成为贯穿计划、执行和验收的任务说明书。"}}}, {"id": "f527125725a6521bb2773315d7", "title": "3.3.3　复杂任务先写“完成定义”，再讨论怎样执行", "notes": {"plain": {"content": "目标说明任务要做什么，完成定义说明在什么条件下可以结束。复杂任务如果只有目标，Agent可能在生成一个文件后宣布完成，而用户期待的却是可打开、可复算、经过确认并保存到正确位置的正式成果。双方对“完成”的理解不同，是许多返工的根源。\n\n完成定义应包含交付物、质量、证据、边界和状态。交付物说明文件及格式；质量规定事实、结构和技术要求；证据说明关键结论怎样回到来源；边界列出不能执行的动作；状态则区分草稿、待确认和已批准。例如，“生成月报”可以被改写为：“形成一个可在WPS打开的月报初稿和数据附件，所有指标可从已确认明细复算，异常项单列，不覆盖源文件，不发送；负责人核验后才改为正式版。”\n\n完成定义还需要失败条件。关键输入缺失、数据口径冲突、目标目录不可写或需要未获批准的权限时，任务不应以替代内容勉强交付，而应停止并说明缺口。把“什么时候不能完成”写清楚，和写明成功标准同样重要。"}}}]}, "notes": {"plain": {"content": "Agent能否把目标正确转化为行动，很大程度上取决于任务信息是否完整。一条有效指令通常包含四类信息：目标、数据源、输出格式和操作边界。它们并不能保证任务一次成功，却能显著减少歧义，并为后续验收提供依据。图3-3概括了这四类信息之间的关系。"}}}, {"id": "3571a8d22a905510a96855e810", "title": "3.4　在关键节点监督，并在必要时接管", "children": {"attached": [{"id": "362a106e463357c99d98dad1f7", "title": "3.4.1　看懂过程信息，及时发现偏差", "notes": {"plain": {"content": "在支持过程展示的任务中，界面可能呈现当前步骤、已完成事项、工具调用和等待确认的问题。用户无需关注所有细节，但应重点看三类信号：处理对象是否正确，执行路径是否偏离目标，任务是否在同一问题上反复尝试。\n\n如果Agent读取了错误文件、使用了不合适的数据范围，或准备生成与要求不符的交付物，应尽早暂停并补充要求。若只是正常的格式转换、计算或等待网页响应，则没有必要频繁打断。判断是否介入，应以“偏差继续扩大后是否增加返工或风险”为标准。\n\n过程可见只能帮助发现问题，不能代替结果核验。即使每一步看起来合理，也可能存在统计口径错误、来源过期或排版遗漏。因此，中间检查与最终验收缺一不可。"}}}, {"id": "8dd1352e562d5968bbe517c3c8", "title": "3.4.2　识别必须由人决定的节点", "notes": {"plain": {"content": "以下几类情况通常需要用户介入，但具体提示方式会随版本、环境和权限设置变化。表3-3同时说明介入原因和建议做法。\n\n介入后，应尽量说明“哪里不对、应该改成什么、哪些已完成内容可以保留”。例如，与其只说“重做”，不如明确：“保留已经清洗的数据，取消地区排名，改为按产品线计算同比，先给我看字段映射再继续。”这种反馈能够让任务从当前状态恢复，而不是无谓地从头开始。\n\n暂停、继续和手动接管等入口是否可用，以当前客户端和任务环境为准。无论采用哪种方式，原则都相同：身份验证由本人完成，高影响操作由责任人确认，方向性偏差尽早纠正。"}}}, {"id": "98b81da50d6252c6bd05e6004f", "title": "3.4.3　任务失败后先定位，再缩小范围重试", "notes": {"plain": {"content": "任务失败不只有一种原因。要求含糊属于目标问题，材料缺失或版本冲突属于输入问题，权限不足、网页变化和软件不兼容属于环境问题，文件打不开或结构不符合用途则属于交付问题。只有先判断失败发生在哪一层，后续调整才不会变成盲目改写指令。\n\n排错时，先保留已经完成且经过确认的中间结果，再找到最后一个正确检查点。随后用最小样本复现问题：批量处理失败就先测试一个文件，跨软件流程失败就只验证出错的两个环节，长指令结果偏离就先确认目标、数据源、输出格式和禁止事项。每次只改变一个关键条件，才能判断哪项调整真正有效。\n\n如果失败来自当前工具或权限边界，应改用可行路径或由人工完成该步骤，而不是要求Agent无限重试。重新开始前还要确认原文件、外部系统和已生成成果是否受到影响。能够解释失败原因、保留有效工作并安全恢复，比一次执行看似顺利更重要。"}}}, {"id": "b649549a3a4954db9e4a264c7f", "title": "3.4.4　用故障分层决定是改指令、换材料还是换路径", "notes": {"plain": {"content": "遇到失败时，最常见的无效动作是不断把同一句要求换个说法。这样做只有在Agent误解目标时才可能有效；如果真正原因是输入损坏、权限不足或网页结构变化，改写指令并不能解决问题。更可靠的排错方式，是根据“失败留下了什么迹象”判断问题所在的层次。\n\n任务层故障通常表现为成果主题、受众或范围不对，但文件能够正常生成。此时应回到目标和验收标准，指出哪一项理解偏离，而不是调整运行环境。\n\n材料层故障通常表现为字段缺失、不同文件口径冲突、附件无法打开或引用了错误版本。此时要补充材料、固定版本或让业务负责人解释字段，不能让Agent用常识补齐事实。\n\n工具层故障表现为格式转换失败、软件弹窗阻塞、网页控件找不到或接口返回错误。它要求检查软件版本、文件格式、页面状态和可替代工具；如果已经获得正确的中间数据，可以从该检查点继续，不必重新做前面的分析。\n\n外部影响故障则发生在发送、发布、删除或覆盖之后，例如同一消息被发送两次、文件被错误覆盖。此时第一目标不是继续完成原任务，而是停止后续动作、确认影响范围，并按照组织流程撤回、恢复或通知相关人员。"}}}]}, "notes": {"plain": {"content": "任务开始后，用户的职责从“说明要求”转为“判断执行是否仍在正确轨道上”。监督不是全程盯住每一次点击，而是通过计划、状态和中间结果发现偏差；接管也不是宣告自动化失败，而是在需要人类身份、判断或责任时完成合理分工。"}}}, {"id": "874c24252eda53c4986eb13c81", "title": "3.5　管理异步任务，而不是被动等待", "children": {"attached": [{"id": "e68fc8968e8458bd88d9b8d65f", "title": "3.5.1　用任务结构估计耗时", "notes": {"plain": {"content": "任务耗时取决于文件数量和大小、网络状态、模型与工具响应、外部网站限制以及人工确认次数，因此不宜用固定分钟数作承诺。判断一项任务需要多久，可以先看它包含多少个阶段、每个阶段依赖什么，以及中间是否需要等待用户。\n\n单个文件的格式整理通常比跨来源调研简单；读取大量网页、处理大文件或依赖多个软件的任务，更容易受到外部条件影响。对于步骤较多的任务，可以要求Agent先列出计划、阶段性产物和检查点。实际运行明显超出预期时，再根据状态判断是在正常处理、等待外部服务，还是重复尝试同一操作。"}}}, {"id": "5c39dda9e25155f190e66b90a4", "title": "3.5.2　让任务状态和交付结果可追溯", "notes": {"plain": {"content": "同时运行多个任务前，应检查它们是否会修改同一文件、占用同一账号或依赖彼此的结果。如果存在冲突，按顺序执行往往更可靠。任务名称也应能直接说明内容，例如“Q3销售分析—待验收”，比“新任务3”更容易管理。\n\n每项任务至少应保留四类信息：使用了哪一版输入材料，成果保存在哪里，哪些步骤已经完成，哪些问题仍待确认。长任务是否放到云端，应根据数据边界、软件依赖和当前支持能力决定，而不是只看预计时长。\n\n收到完成提示后，用户仍要打开成果并核对关键内容。确认文件可用、范围正确、异常已说明后，再结束任务；如果需要修改，则引用具体文件和问题继续沟通。做到这一点，异步执行才会从“稍后再看”变成可管理、可追踪的工作方式。"}}}, {"id": "a58990b216a357b8aab3da1724", "title": "3.5.3　用任务交接卡避免“系统完成、工作失联”", "notes": {"plain": {"content": "异步任务最容易出现的断点，不一定是执行失败，而是交付后没有人知道下一步。系统给出完成通知，只说明某个运行过程结束；它不能替代业务负责人对结果的接受，也不能自动决定未决问题由谁处理。为此，可以把长任务的最终回复整理成一张简短的任务交接卡。\n\n一张合格的交接卡至少包含六项：任务名称，输入材料及版本，已完成的处理，成果位置，异常与未决事项，验收责任人与截止时间。若任务可能产生外部影响，还要增加“实际执行的发送、发布、修改或删除动作”，使接收者能够快速判断是否需要补救。交接卡不必另建复杂系统，它可以写在任务记录、项目群消息或交付文档首页，但字段要保持一致。\n\n异步任务交接卡示例\n\n任务：8月门店经营月报初稿。输入：截至9月2日18:00的12份门店报表及《指标口径V3》。已完成：字段合并、异常项标记、区域汇总和报告初稿。成果：工作目录“交付/经营月报/2026-08”中的Excel与Word文件。未决事项：3家门店的退款金额尚未确认，相关结论已标为待核验。外部动作：未发送、未覆盖原文件。验收：区域运营负责人在9月4日12:00前复核金额合计与结论摘要。"}}}]}, "notes": {"plain": {"content": "当任务能够在后台或云端持续执行时，用户不必一直停留在当前界面。这种异步方式可以释放人的注意力，但也带来新的管理问题：多个任务是否会争用同一文件或账号，任务长时间未完成是在正常运行还是陷入阻塞，交付后由谁验收。异步执行改变的是等待方式，并没有取消管理责任。\n\n界面中的具体状态名称可能变化，但管理长任务时至少要区分表3-4所示的五种情形。状态不同，用户的响应也不应相同。\n\n为每项长任务指定名称、负责人、输入版本和预期产物，可以显著降低“任务在运行，但没人知道它应该交付什么”的混乱。并行任务越多，越需要统一状态和命名，而不是依赖个人记忆。"}}}]}, "notes": {"plain": {"content": "第2章的会议纪要试跑看似只是“说一句话，等一个结果”，实际已经经历目标理解、任务规划、工具调用、异常处理和成果交付。只看最终文件，容易把成功归因于“它很聪明”，也容易在失败时笼统地认为“AI不可靠”；真正有效的使用方式，是看清每个环节由谁负责、在哪里执行，以及什么时候需要人做决定。\n\n本章围绕“人提出目标并划定边界，Agent把目标转化为行动，双方通过过程确认和结果验收完成闭环”这条主线，依次讨论任务推进、执行环境、指令设计、人工接管和异步管理。理解这些概念不是为了把人的语言改造成机器语言，而是为了减少猜测，使责任明确、过程可见、结果可验收。"}}}]}, "notes": {"plain": {"content": "第一次把工作交给AI，最容易产生的错觉是：它回复得快、写得顺，就等于任务已经完成。可一旦把结果用于真实工作，问题便会出现——纪要把讨论意见写成正式结论，分析引用了错误版本，文件保存到了不该出现的位置。表面上是输出不准确，根源却常常是任务目标、材料范围、操作权限和验收标准都没有说清楚。\n\n许多入门资料把重点放在“怎样问出一个好答案”，却很少解释AI开始读取文件、调用工具和推进多步任务以后，人应当怎样判断它做得是否可靠。本篇不追求记住更多按钮，也不把办公Agent描绘成可以独立接管工作的“万能同事”，而是帮助读者先建立一套可执行、可观察、可停止的使用框架。\n\n本篇适合第一次接触豆包工作，或者已经使用过对话式AI、却还不敢让它处理真实文件的读者。第1章厘清办公Agent与普通对话工具的差别；第2章用一次受控任务走完安装、身份确认、授权和验收；第3章再解释目标、工具、上下文和反馈机制。若已经熟悉产品入口，可以快速浏览第2章，但身份、权限和任务验收部分不宜跳过。"}}}, {"id": "8d70cdf9690554e7850c7bf53f", "title": "第二篇　核心交付篇", "children": {"attached": [{"id": "ch4", "title": "第4章　文档写作：从材料整理到正式成稿", "children": {"attached": [{"id": "8582bad3e50c5c44905580970f", "title": "4.1　先判断AI应该介入哪个环节", "notes": {"plain": {"content": "并非所有文档都适合采用同一种协作方式。与其根据“纪要”“方案”或“报告”等名称作判断，不如先看任务中事实整理、结构组织、观点形成和最终决策各占多大比重。图4-1呈现了从材料输入到人工验收的完整流程，也标出了AI更适合承担的中间环节。\n\n适合由Agent较多参与的任务，通常具有三个条件：有可以读取的原始材料，有相对稳定的结构，并且交付标准能够明确检查。例如，会议转写稿可以整理成纪要，多份项目记录可以汇总为周报，数据表和访谈材料可以形成报告初稿。\n\n如果任务高度依赖个人立场、组织判断或敏感信息，就需要缩小AI的参与范围。述职中的个人反思、方案中的最终取舍、涉及人员评价的结论，都不宜在缺少作者确认的情况下直接生成和提交。材料能否进入AI处理流程，还要符合所在组织的数据规则，相关原则将在第13章集中讨论。\n\n判断完成后，还要确定交付停在哪一层：是问题清单、大纲、初稿，还是接近正式发布的版本。风险越高、材料越不完整，越应该把交付点前移，让人先确认再继续。后续各节将用这一原则处理不同类型的文档。"}}}, {"id": "c4c3be1f537a5a178810f1f22a", "title": "4.2　从会议记录到可执行的纪要", "children": {"attached": [{"id": "d9d2576f5bfe588fa8019473fa", "title": "4.2.1　先确认材料，再设计纪要结构", "notes": {"plain": {"content": "可用材料可能是会议转写、录音文件、在线文档或个人笔记。不同材料的可靠程度并不相同：转写稿可能把同音词识别错，录音可能存在听不清的片段，个人笔记则容易遗漏上下文。开始整理前，应让Agent先报告识别到的材料、时间范围和明显缺口，避免在错误输入上直接生成成稿。\n\n一份便于执行的纪要通常包括会议基本信息、核心结论、分议题摘要、未决问题和行动项。并非每场会议都需要完整复述讨论过程；如果文档用于推动后续工作，结论与行动项应当优先于发言流水账。\n\n可以这样下达任务：\n\n请读取工作目录中的《产品周会转写稿.txt》，先确认会议日期、参会人和主要议题。随后生成会议纪要，包括：一段会议结论摘要；按议题整理的讨论要点与分歧；行动项表格，字段为事项、负责人、截止时间和依赖条件。无法从原文确认的信息标记为“待确认”，不要自行补全。结果另存为《产品周会纪要-YYYYMMDD.md》，不要修改源文件。"}}}, {"id": "bc3e0e68e8a058deaad3811fc3", "title": "4.2.2　把口头讨论还原为事实、结论和行动", "notes": {"plain": {"content": "会议语言常常不完整。同一句“这件事下周再看”，可能表示暂不决策，也可能暗含某位负责人需要补充材料。Agent可以整理语句，却不能仅凭语气补造决定。遇到负责人、期限或结论不明确的情况，应保留原始表述并列入待确认项。\n\n行动项尤其要避免“持续关注”“推进一下”这类无法验收的表达。一个完整行动项至少回答三件事：谁负责、交付什么、何时完成；如果任务依赖其他团队或前置材料，还应补充依赖条件。对于从原文无法确认的字段，留空比猜测更可靠。\n\n纪要初稿完成后，应回到原始材料核对以下内容：\n\n各项结论是否与原意一致，是否把建议误写成决定；\n\n姓名、数字、日期和专有名词是否准确；\n\n行动项是否包含明确的责任人与可检查的交付物；\n\n未决问题和分歧是否被保留，而不是被文字润色掩盖。\n\n只有经过这一步，纪要才从“语音或文字的摘要”变成可以进入协作流程的正式记录。"}}}, {"id": "77c80627edff5f9eb936e61db9", "title": "4.2.3　区分纪要、摘要和对外信息，不让文种越界", "notes": {"plain": {"content": "同一场会议可以产生多种文档，但它们的责任不同。会议纪要用于记录共识、分歧和行动，管理层摘要用于压缩关键信息，对外新闻或客户邮件则代表组织正式表达。不能因为素材相同，就让一份未经确认的纪要直接变成对外内容。\n\n纪要应尽量忠实于会议证据，保留未决问题和表达边界；摘要可以取舍细节，却不能改变决议；对外信息还要经过保密、品牌、合同和发布权限检查。内部讨论中的备选方案、人员评价和未经批准的数字，即使出现在完整转写中，也不应自动进入外发稿。\n\n实际操作时，先确认正式纪要，再以它作为摘要和其他文种的事实底稿。转换任务要明确目标读者、允许公开的范围和需要重新审批的表述。例如：“基于已确认纪要生成客户邮件草稿，只说明双方已确认的下一步，不包含内部风险讨论、预算和人员评价；不要发送。”\n\n多份文档生成后做交叉检查。摘要中的决议能否回到纪要，外发稿是否新增承诺，行动项的负责人和日期是否一致，未决事项是否被误写为确定结论。如果正式纪要后来修订，所有依赖它的下游文档都要重新检查。"}}}]}, "notes": {"plain": {"content": "会议纪要是理解文档协作边界的好例子。它主要依据已有材料，结构相对稳定，但姓名、数字、日期和责任分工又不容出错。这里的目标不是把口语改得“更像文章”，而是从讨论中准确分离背景、结论、分歧与行动。"}}}, {"id": "dc0eeb2aaca7513fbe1e0490a6", "title": "4.3　从零散材料到方案与报告", "children": {"attached": [{"id": "2a3c7877a3515eda8f1ec25951", "title": "4.3.1　先盘点证据和信息缺口", "notes": {"plain": {"content": "开始写作之前，先让Agent说明现有材料能够支持哪些内容、缺少哪些关键事实。例如，编写客户管理系统选型方案时，手头可能有旧方案、供应商报价、产品对比文章和内部需求记录。Agent可以把这些材料按需求、功能、成本、实施和风险归类，但不能把缺失的维护成本或实施周期当成已知事实。\n\n第一轮指令可以只要求盘点，不要求写正文：\n\n请阅读工作目录“选型资料”中的全部文件，按“业务需求、候选产品、采购成本、实施条件、维护风险”五类整理可用信息。对每条关键信息注明来源文件；另列信息缺口和存在冲突的说法。此阶段不要撰写方案，也不要依据常识补全缺失数据。\n\n这一步会把“材料很多”转化为“证据是否够用”的问题。作者可以据此补充资料，也可以明确哪些内容只能作为假设，并决定是否继续进入大纲阶段。"}}}, {"id": "03609d95401758c3981e0f32b4", "title": "4.3.2　先审骨架，再分段生成正文", "notes": {"plain": {"content": "材料边界清楚后，再让Agent建立大纲。图4-3所示的“搭骨架”，本质上是把修改成本较高的正文写作，推迟到结构获得确认之后。\n\n一份项目方案可以包含背景与问题、目标与原则、候选路径、比较依据、推荐建议、实施计划、预算和风险，但不必机械套用固定目录。大纲应服务于读者的决策顺序：先让读者理解为什么要做，再呈现有哪些选择、依据是什么，最后说明怎样实施和承担风险。\n\n在实际操作中，可以先把“只生成大纲、不写正文”的要求明确写进任务。图4-4展示了这一交互方式：先让系统暴露结构，再由作者确认章节顺序、信息缺口和论证重心。\n\n审查大纲时，重点看三个问题：它是否真正回应了任务目标，关键结论是否有材料支撑，各部分之间是否存在逻辑跳跃。结构确认后，再按章节分段生成正文。复杂内容宜一次处理一个论证单元，以便及时核对数据和方向。\n\n例如，可以这样要求Agent起草候选产品比较部分："}}}, {"id": "ec542a7da50d5123ab0a231194", "title": "4.3.3　让建议与证据保持可追溯", "notes": {"plain": {"content": "方案中的“推荐”不能只靠流畅语言成立。每一项关键判断都应能回到数据、访谈或明确的组织约束。如果Agent提出“方案A更适合”，应继续追问：依据是什么，哪些条件变化后结论会改变，有没有备选路径。\n\n让Agent先反过来提问，也是一种有效方法。对于目标不够清楚的方案，可以要求它列出完成写作所需的关键信息，并说明每个问题影响哪一部分。这样做不是把判断交给AI，而是借助问题清单暴露作者尚未想清楚的地方。\n\n成稿前，可以用表4-2检查论证是否闭合。任何一项缺失，都应先补足事实或推理，再进入语言润色。\n\n周报、月报和其他周期性报告也可以沿用同一方法：先确定材料范围和统计口径，再生成固定结构，最后核对成果归属和数据。区别只在于它们通常不需要复杂论证，但同样不能用模板化语言替代事实。\n\n周报场景同样遵循“材料—指令—核验—交付”的顺序。开始前确定统计期间和资料范围，生成后逐项回查数字与进展，负责人确认后再进入正式版本。每次运行还应记录材料准备、人工核验和返工时间，才能判断这条流程是否真正减少了总投入。"}}}, {"id": "25784d48d9f854e597f09fe5fb", "title": "4.3.4　用证据台账控制事实、判断和引用", "notes": {"plain": {"content": "方案或报告进入分段写作后，最容易发生的变化是“来源逐渐消失”。素材盘点阶段还能够说清某个数字来自哪份文件，写成连贯正文后，数字、解释和建议混在一起，读者很难判断哪些是事实、哪些是作者推断。证据台账的作用，就是在成文过程中保留这层区别。\n\n证据台账不等于文末参考资料列表。参考资料说明作者看过什么，证据台账还要说明某条材料支持了正文中的哪项主张、采用了哪个版本、是否存在限制。最小记录可以包含六个字段：正文主张、来源名称、具体位置或链接、材料日期、证据状态和责任人。证据状态至少区分“已核验”“待核验”“存在冲突”和“仅作背景”，不能把所有链接都视为同等可靠。\n\n以采购方案中的“三年总成本”为例，软件报价单可以支持许可费，实施访谈可以支持预计人天，历史运维记录可以支持维护成本；三者不能被一个来源替代。如果某家供应商只给出首年报价，就应在台账中标为“口径不完整”，而不是为了填满对比表自行外推三年数字。正文可以继续讨论，但必须把缺口写进限制条件。"}}}]}, "notes": {"plain": {"content": "方案和报告比纪要更难，因为它们不仅要整理事实，还要建立结构、形成论证。直接要求Agent“写一份完整方案”，往往会得到章节齐全但内容空泛的文本。更稳妥的方法是把写作拆成素材盘点、结构确认和分段成文三个阶段，每个阶段都留下人工判断的位置。"}}}, {"id": "756a58b8de705641a925977fab", "title": "4.4　从初稿到定稿：控制修改范围", "children": {"attached": [{"id": "9c3e7f42db6e56e182d954520b", "title": "4.4.1　修改要求要包含对象、动作和约束", "notes": {"plain": {"content": "有效的局部修改，应说清修改对象、修改动作和保持不变的部分。例如，“把第二段改一下”缺少方向；“将第二段压缩至150字以内，保留三个数据和原结论，语气改为面向管理层，其余段落不变”则可以直接执行。\n\n常见修改可以分为三种层级。表4-3同时列出各层级的典型任务和需要特别检查的内容。\n\n在支持选区编辑的客户端中，可以先选中目标内容再下达要求；具体能否只修改选区、是否支持表格或演示文稿，要以当前版本为准。无论使用何种入口，都应在指令中明确“仅修改指定范围”，并在完成后检查相邻内容。\n\n整篇重写与局部修改解决的是不同问题。表4-4给出选择依据，重点不是哪种方式“更快”，而是哪种方式能以较小影响完成当前修改。"}}}, {"id": "73dbff5571805fc497c36cef58", "title": "4.4.2　局部修改也要检查连带影响", "notes": {"plain": {"content": "“只改一处”不等于其他位置一定无需调整。修改金额后，摘要、图表和结论中的引用可能都要同步；删除一个章节后，目录和交叉引用也可能失效。因此，在限制改动范围的同时，还应要求Agent报告相关引用，而不是悄悄扩大修改。\n\n一种稳妥的做法是分两步处理：先让Agent列出受影响位置，用户确认后再同步修改。例如：“将本段的年度预算改为1280万元。先查找全文中引用该数字的位置并列出，不要立即修改；我确认后再统一更新。”\n\n重要文档还应保留版本。原始材料、AI初稿和人工确认稿宜分别保存，文件名中加入日期或版本号。这样既能在修改失误时回退，也能说明关键结论是在哪一轮形成的。版本管理不是额外负担，而是让协作过程可追溯的基本条件。"}}}, {"id": "b10ca2287e3f53aeb1ca1937f5", "title": "4.4.3　把修改拆成可核对的变更集", "notes": {"plain": {"content": "当一轮修改同时包含结构、事实和措辞变化时，仅保存“v2”“最终版”仍然不够。接收者看到新文件，却不知道哪些内容改变、为什么改变，也无法判断是否需要重新审批。更稳妥的做法，是把一轮修改整理为一个变更集：先列修改请求，再执行修改，最后报告实际影响。\n\n一个变更集应能回答四个问题：修改依据是什么，改动了哪些位置，哪些关联位置一起调整，哪些意见没有采纳。比如，管理层要求把项目预算从1000万元压缩到800万元，这不是替换一个数字。实施范围、资源计划、风险、摘要和财务表都可能受到影响。Agent可以先搜索相关位置并形成影响清单，责任人确认后再统一修改。\n\n复杂文档可以按三轮完成修订。第一轮只处理事实错误、数据口径和责任边界，保证内容“没有硬伤”；第二轮处理结构、论证和重复，保证读者“看得明白”；第三轮才处理语句、格式、图表和目录，保证文件“读起来顺畅”。三轮顺序不能完全颠倒，因为事实或结构一旦变化，前面的语言润色和排版可能全部失效。"}}}]}, "notes": {"plain": {"content": "初稿解决的是“有没有”，定稿解决的是“能不能用”。在修改阶段，如果每次都让Agent重写全文，已经确认的事实、格式和语气可能再次发生变化。局部编辑的真正价值，是把修改范围和验收范围同时缩小，使每一次调整都更可控。\n\n局部修改通常沿着“确定对象—说明动作和约束—检查局部及关联位置”的顺序进行。它减少的是不必要的改动范围，而不是省略核验；如果目标、结构或受众已经改变，整篇重写反而更合适。"}}}, {"id": "2955afe0c4925ad38c766c8690", "title": "4.5　交付前完成一次系统验收", "children": {"attached": [{"id": "ebd90d2112ac5808805dc8b832", "title": "4.5.1　用五层检查代替笼统校对", "notes": {"plain": {"content": "第一层是内容范围。检查是否回应了任务目标，有没有漏掉必须包含的章节，也要删除与读者无关的材料。第二层是事实与证据，重点核对姓名、日期、数字、引用和数据口径；凡是无法确认的内容，都应显式标注，而不是用确定语气写入正文。\n\n第三层是逻辑结构。标题是否准确概括内容，结论是否由前文证据支持，建议是否能落实到行动。第四层是表达与格式，包括术语统一、语气匹配、图表标题、编号和目录。最后一层是责任确认：谁对最终结论负责，哪些建议尚待批准，文档能否发送给目标读者。\n\n可以让Agent先做问题扫描，但不要让它在同一步骤中自动改完所有内容：\n\n请审阅《客户管理系统选型方案-v2.docx》，按“事实与数据、论证逻辑、结构衔接、表达与格式、待确认事项”五类列出问题。每条问题注明所在章节、原文摘要、风险和修改建议。先输出审阅清单，不要直接修改文件。\n\n问题清单确认后，再按优先级修改。事实错误和责任边界应优先于措辞与排版；如果基础数据尚未确认，过早润色只会提高返工成本。"}}}, {"id": "0435d76d617c5ab0af7546eecc", "title": "4.5.2　把成稿连同依据和未决事项一起交付", "notes": {"plain": {"content": "正式交付不应只有一个文档文件。对于重要方案或报告，最好同时保留输入材料清单、关键数据来源、版本信息和未决事项。这样，接收者不仅能阅读结论，也能判断结论建立在什么基础上。\n\n提交前可做最后一次确认：文件能否正常打开，名称和版本是否正确；正文、目录、图表和附件是否一致；文中是否仍有“待补充”“待确认”等占位内容；外发范围是否符合信息安全要求。会议纪要还要再次确认行动项，方案则要明确推荐意见是否已经获得责任人认可。\n\n附录A提供了会议纪要、方案大纲、报告提炼和文档校对等可复用指令。模板的作用是提醒信息结构，而不是替代真实材料。每次使用时都应重新填写任务对象、数据来源、交付格式和操作边界。"}}}, {"id": "3231595a8b2c5cdd871e57a5a4", "title": "4.5.3　文档交付清单", "notes": {"plain": {"content": "最后一次检查不再修改观点，只判断文件能否进入真实流转。表4-5列出正文、数据、引用和文件层面的放行条件。\n\n文档只有同时满足“读得懂、查得到、用得上、说得清由谁负责”，才具备交付条件。"}}}, {"id": "467ac668ceb452d398397d96dd", "title": "4.5.4　完整案例：把一组项目材料整理成决策简报", "notes": {"plain": {"content": "下面用一个项目延期复盘的例子串联本章方法。工作目录中有会议转写、项目计划、问题清单、供应商邮件和一份旧版周报，目标是形成一份供管理层讨论的决策简报。原始要求如果只是“根据这些材料写一份复盘”，Agent很可能把材料按时间顺序摘要，却没有给出管理层真正需要的决定。\n\n第一步只做材料盘点。系统列出五类文件、各自日期和内容范围，同时发现旧版周报中的里程碑日期与项目计划不一致，供应商邮件只说明交付延迟，没有确认新的完成日期。此时不应直接进入写作，而应请项目负责人确认以哪一版计划为准，并把供应商日期标为待确认。\n\n第二步设计决策结构。简报不需要完整复述项目历史，而应依次回答：当前状态是什么，偏差怎样形成，哪些事实已经确认，有哪些可选处置，每个选择对成本、时间和范围有什么影响，需要管理层决定什么。这个结构获得确认后，再让Agent按段落生成，并要求每个关键数字回到来源文件。"}}}]}, "notes": {"plain": {"content": "文档看起来完整，并不代表已经达到交付标准。真正的验收要从“文字是否通顺”上升到“事实是否可信、逻辑是否成立、读者能否行动”。不同文档的重点可以不同，但都应经过内容、证据、结构、表达和责任五个层面的检查。"}}}]}, "notes": {"plain": {"content": "前一篇建立的任务链路，只有落到可验收的成果上才有意义。文档是职场中最常见的成果载体：会议纪要记录共识与行动，项目方案组织问题与路径，分析报告呈现证据与判断，周报则把分散进展压缩为可追踪的信息。它们看似都是“写字”，实际承担的责任并不相同：有的要求忠实还原，有的要求形成论证，有的直接影响资源与决策。\n\n因此，用Agent写文档不能只追求快速生成。更可靠的流程是先判断哪些工作可以交给AI，再把原始材料转化为结构和初稿，随后通过局部修订、事实核查与责任确认完成定稿。本章就沿着“材料—结构—初稿—修订—验收”这条主线展开。"}}}, {"id": "ch5", "title": "第5章　PPT制作：从汇报目标到现场表达", "children": {"attached": [{"id": "fd7d79139e5858f282b56058c2", "title": "5.1　先定义一次汇报，而不是先规定页数", "children": {"attached": [{"id": "41b9deb92a3655b3a331164454", "title": "5.1.1　用四个问题确定表达方向", "notes": {"plain": {"content": "受众决定信息深度。面向管理层，需要突出结论、影响和资源诉求；面向执行团队，则要交代任务、时间和分工；面向客户，还要考虑对方已有认知与关注点。同一份材料不能只换封面就用于不同场合。\n\n目的决定叙事方式。信息同步重在事实完整，方案评审要呈现选项与依据，工作汇报要说明成果、问题和下一步，培训则需要概念、示例与练习。如果连汇报目的都说不清楚，页面再精美也难以形成有效沟通。\n\n场景决定信息密度。十分钟现场汇报、会前阅读材料和线上异步分享，对页面自解释能力的要求不同。现场讲解的页面可以简洁，由演讲者补充细节；独立阅读的材料则需要更多上下文和来源说明。\n\n核心信息是整套演示文稿的“主张”。它不必出现在每一页，却应决定页面的取舍。例如，季度总结的核心信息可以是“核心业务达到目标，但获客成本上升，下一季度需要调整渠道组合”。成果、问题和规划都应围绕这句话展开。\n\n明确表达方向之后，还需要判断时间应花在哪里。图5-1用“60分、80分、90分”作比喻：基本完整的初稿可以较快形成，真正耗时的往往是事实核验、叙事取舍和细节打磨；越接近正式交付，人的判断越重要。图5-1中的分数不是客观评分标准，而是用来说明不同阶段的投入重点。"}}}, {"id": "fff1de544f1355b98cee4019b2", "title": "5.1.2　把制作要求写成验收条件", "notes": {"plain": {"content": "页数、风格和配色仍然有用，但应排在汇报目标之后。一条更完整的初始指令可以这样写：\n\n请为“2026年第三季度市场部复盘与第四季度计划”设计一份管理层汇报PPT。汇报时长15分钟，目标是说明本季度成果与获客成本问题，并申请下一季度的渠道测试预算。先根据工作目录中的数据表和项目复盘材料，列出10～12页大纲；每页写明标题、核心结论、所需证据和建议视觉形式。此阶段不要生成页面。关键数字必须注明来源，无法确认的内容标记为待补充。\n\n这条指令把“做PPT”转换成了可以审查的任务：页面是否服务于预算决策，结论是否有证据，哪些信息仍不完整。先确认这些问题，再决定最终页数和视觉风格，能够显著降低整套返工的风险。"}}}]}, "notes": {"plain": {"content": "很多PPT任务从“帮我做一份12页的演示文稿”开始，但页数并不是最重要的约束。开始制作前，至少要明确受众、目的、场景和核心信息：谁来听，听完需要知道或决定什么，在什么场合讲，汇报者最希望对方记住哪一句话。"}}}, {"id": "f5551290552056fdbc8a6bf463", "title": "5.2　根据材料完整度选择生成路径", "notes": {"plain": {"content": "汇报目标确定后，下一步不是立即排版，而是判断手头材料处于什么状态。只有主题、已有内部材料和需要外部调研，是三种不同的起点。它们没有高低之分，但对应的工作路径不能混用。\n\n只有主题时，先提问，不补造事实。 当用户只有一个主题时，Agent可以帮助提出结构和问题清单，却不能生成真实业绩、客户反馈或市场数据。此时最合适的交付物不是“成品PPT”，而是一份待补材料清单和初步叙事框架。\n\n例如，准备部门年度述职时，可以要求Agent围绕年度目标、关键成果、数据证据、困难与应对、下一年规划和资源需求提问。用户回答后，再把信息整理成大纲。问题数量不宜一味求多，应优先覆盖会影响结论和页面结构的事项。\n\n已有内部材料时，先筛选，再组织页面。 周报、数据表、旧方案和项目记录能够提供事实基础，但不能直接等同于演示文稿内容。Agent应先盘点材料，识别重复、冲突和缺口，再按照汇报目的筛选。旧报告中的一段完整论述，放到页面上可能只需要一个结论和一张图表；其余细节可以留在备注或附录。"}}}, {"id": "a4f7aec173e957fcb667f96808", "title": "5.3　把大纲变成页面叙事与视觉系统", "children": {"attached": [{"id": "fb72ce6fce83529098c3a2c1bb", "title": "5.3.1　先搭建叙事骨架", "notes": {"plain": {"content": "多数工作汇报可以用“背景与问题—证据与分析—建议与行动”作为起点，但具体结构应服从汇报目的。方案评审可能采用“现状—标准—选项—比较—建议”，项目复盘则适合“目标—结果—差距—原因—改进”。模板只是帮助思考，不能替代真实逻辑。\n\n审查大纲时，可以逐页追问四件事：\n\n这一页要让受众得到什么结论？\n\n结论依赖什么事实、数据或案例？\n\n为什么它应该出现在前一页之后、后一页之前？\n\n如果删除这一页，整条论证是否仍然成立？\n\n如果一页无法回答第一个问题，它很可能只是材料堆积；如果连续几页表达同一层意思，就应合并。页数应由叙事需要决定，而不是为了满足一个整数机械拆分内容。"}}}, {"id": "994b72c2d82751dfa6eba7f3e3", "title": "5.3.2　让标题表达结论，让视觉承担证据", "notes": {"plain": {"content": "“市场分析”“项目成果”“下一步计划”只是栏目名称，不能告诉受众这一页真正要说什么。更有效的标题应表达结论，例如“客户增长主要来自渠道A，但单客成本连续两个季度上升”。即使只浏览标题，受众也能理解整套汇报的逻辑。\n\n一页通常只承担一个主要观点。支撑观点的内容可以是数字、图表、流程或少量文字，但不必同时堆满。选择视觉形式时，应先问它要证明什么：比较差异用条形图，观察变化用折线图，展示组成可以用堆叠图或表格；如果只有一个关键数字，突出数字本身往往比制作复杂图表更清楚。\n\n页面大纲可以采用表5-2所示的结构，便于Agent生成，也便于人审查每页结论、证据与视觉形式是否匹配。\n\n只有当标题、证据和视觉能够相互对应时，页面生成才有明确依据。\n\n视觉设计的目标不是让每页都“有设计感”，而是帮助受众迅速识别层级、关系和重点。统一的字体、颜色、间距和图表规则能够降低理解成本；过多装饰、频繁换版式和滥用强调色，则会让注意力从内容上移开。"}}}, {"id": "7bae68e979ff5dbeaebe3da87a", "title": "5.3.3　把旧PPT当作规则来源，而不是复制对象", "notes": {"plain": {"content": "企业常用旧PPT保持品牌一致。上传参考文件前，应先确认其中不含不宜进入当前处理环境的敏感信息。还要明确哪些元素需要继承：标识位置、主辅色、字体层级、页脚、图表样式和常用版式；哪些旧内容必须删除或更新。\n\n“参考这份PPT的风格”仍然过于宽泛。更稳妥的要求是：“沿用封面和章节页结构，保持深蓝主色、标题字号和页脚位置；正文页面可根据内容重新布局，不复制旧文件中的文字、数据和客户名称。”这样既能保持品牌系统，也不会把过时内容带入新文稿。\n\n模板应用后还要检查字体是否在汇报设备上可用、标识是否变形、颜色对比是否足够，以及图表是否仍然可读。AI可以识别视觉规律，但品牌规范和使用许可仍需由用户确认。"}}}, {"id": "a3967cd2d78258179e3dd44296", "title": "5.3.4　控制信息密度和强调层级", "notes": {"plain": {"content": "“每页不超过五行”并不是普遍规律。数据页、流程页和附录页的合理密度不同，真正需要控制的是一页是否存在明确重点。标题、关键数字和结论可以形成第一层；解释性文字和图例属于第二层；来源和备注则放在不干扰阅读的位置。\n\n使用颜色和加粗时，应给它们稳定含义。例如，蓝色表示主信息，橙色只用于风险或需要决策的内容；如果每个数字都放大、每句话都加粗，页面就失去了层级。图片也应服务于主题，避免为了填满空白而添加与论证无关的素材。\n\n生成初稿后，可以要求Agent做一次视觉一致性检查：标题位置、字号、颜色、对齐和页脚是否统一；图表单位、图例和数据标签是否完整；是否存在文字过密或留白失衡的页面。统一性问题适合批量处理，内容问题仍应逐页判断。"}}}, {"id": "0162522c7cb656e0b8017aa507", "title": "5.3.5　为每页结论保留证据入口", "notes": {"plain": {"content": "演示文稿强调简洁，但简洁不能以丢失依据为代价。一张页面可以只呈现一个关键数字或一句结论，制作团队仍应知道它来自哪份数据、使用什么口径、截至什么时间。否则，汇报者在现场被追问时，只能回到原文件重新寻找，甚至无法确认页面是否使用了旧数据。\n\n页面证据可以分成三个层次。第一层是受众在页面上必须看到的信息，如单位、时间范围、样本量和数据来源简称；它们应放在图表标题、脚注或数据标签附近。第二层是汇报者需要掌握、但不必占据页面主体的解释，如计算口径、排除项、异常样本和结论限制，可以写入讲者备注。第三层是用于复核的原始材料、计算表和完整引用，适合放在附录或交付包中。\n\n三个层次要能够互相找到。例如，第6页写“试点渠道的单客成本下降18%”，页面脚注应说明比较周期和数据表名称；讲者备注要交代是否排除了退款、样本是否可比；交付包中则保留计算明细。这样既不会让页面变成论文，也不会让结论脱离证据。"}}}]}, "notes": {"plain": {"content": "普通目录只告诉读者“接下来讲哪一部分”，演示大纲还要说明“为什么这一页之后必须出现下一页”。好的页面之间存在推进关系：提出问题，给出证据，形成判断，最后落到行动。这样的叙事比把材料平均分配到十几页更有力量。"}}}, {"id": "eb60fff20ce75d509b4bfee20f", "title": "5.4　从页面初稿到可交付演示", "children": {"attached": [{"id": "4249fdbbf6c05c93a0d1f476a0", "title": "5.4.1　局部修改之前先判断影响范围", "notes": {"plain": {"content": "修改单页内容时，应说明对象、目标和保持不变的部分。例如：“将第5页压缩为三个结论，保留两项关键数据及来源，删除背景性描述，其他页面暂不修改。”如果改动会影响摘要、目录或后续结论，应先列出关联页面，再决定是否同步调整。\n\n从文字修改到全局统一，常见编辑动作及其影响范围如图5-4所示。图5-4中的五类操作不是要在一轮中全部完成，而是提醒用户先识别修改层级，再逐项验收。\n\n页面增删同样要检查叙事。删除重复页后，前后过渡是否自然；新增风险页后，结论页是否需要回应；调整页面顺序后，口头讲解是否仍然成立。局部编辑减少了返工范围，但不能忽略跨页关系。\n\n在支持在线编辑或选区修改的版本中，可以直接调整文字、页面和版式；具体能力及导出结果以当前客户端为准。如果需要在Office或WPS中继续修改，应导出可编辑格式并检查元素是否保持；用于固定版式阅读时，可以另行导出PDF。在线链接或图片是否适合分享，则取决于协作场景和信息权限。"}}}, {"id": "3cd09eadd06455308ce8e40893", "title": "5.4.2　按“事实—叙事—视觉—现场”完成验收", "notes": {"plain": {"content": "最终验收可以分为事实、叙事、视觉和现场四个层面。\n\n为把图5-5中的四个质量维度转化为可执行的检查，表5-3分别列出每个维度的核心问题和常见风险。\n\n演练是PPT制作流程的一部分。汇报者应按真实时长讲一遍，确认每页承担的作用，删去无法在现场解释的内容，并准备关键数据的追问依据。复杂表格和补充证据可以放入附录，不必全部塞进主线页面。\n\n交付时，保留源文件、PDF版本、引用资料和必要字体或媒体文件，并使用清楚的版本名。外发前再次检查备注、隐藏页、客户名称和内部数据，避免把不应公开的信息一起带出。只有内容可靠、播放稳定且汇报者能够讲清楚，这份演示文稿才算真正完成。"}}}, {"id": "c345e83fc0d15976bef6513799", "title": "5.4.3　把讲者备注和真实设备演练纳入制作流程", "notes": {"plain": {"content": "很多演示文稿的问题直到现场才暴露：页面顺序正确，汇报者却不知道怎样转场；视频在制作电脑上能播放，换到会议室设备后没有声音；字体被替换，关键数字挤到页面之外。原因在于制作团队只检查了页面文件，没有检查“人、内容、设备和时间”组成的完整演示环境。\n\n讲者备注不是把页面文字再抄一遍，而是记录页面之外的表达任务。每页备注可以写四项：这页要传达的核心句，必须解释的口径或背景，预计用时，以及转向下一页的过渡语。若该页可能被追问，还可以记录原始数据位置和备选说明。备注过长往往说明页面承载了过多主题，应回到大纲重新取舍。\n\n第一次演练主要检查叙事和时长。汇报者按真实语速完整讲述，记录每一页的实际用时和卡顿位置。总时长超限时，先删除不能推动结论的页面，再压缩表达；不要简单加快语速。第二次演练检查追问和决策：关键数字能否解释，建议的前提是什么，管理层需要作出的决定是否说得清楚。第三次演练才检查设备、链接、动画、音视频和远程会议共享。"}}}]}, "notes": {"plain": {"content": "自动生成的PPT通常只能视为第一版。正式汇报前，还要经过内容修改、跨页检查、格式适配和现场演练。修改顺序很重要：先核实事实，再调整叙事，随后优化视觉，最后处理动画、导出和播放等细节。"}}}, {"id": "d0548deeb1b3579eab830d59cd", "title": "5.5　综合案例：把一次活动构想做成成套材料", "children": {"attached": [{"id": "2401acd3969c5105a4a2f8084a", "title": "5.5.1　成套材料交付清单", "notes": {"plain": {"content": "活动页面、PPT和配套素材准备外发时，应把它们当作同一项目验收，而不是逐个文件“看起来没问题”即可。表5-5列出了联合检查时必须达到的标准。\n\n如果一份页面只能在屏幕上成立，却无法被讲清、被打开或被安全发布，它仍然不是完成的演示文稿。"}}}, {"id": "e30e56ffe8085f748528ab65b6", "title": "5.5.2　用“事实母版”管理跨媒介一致性", "notes": {"plain": {"content": "成套材料在后期修改时，最危险的不是某个页面不好看，而是同一个事实出现多个版本。活动时间改变后，海报更新了，网页和PPT却仍保留旧时间；演讲标题调整后，二维码落地页仍显示旧名称。文件越多，依赖“记得逐个修改”越不可靠。\n\n更稳妥的做法，是在项目目录中维护一份简洁的事实母版。它只记录各媒介共同依赖的确定信息，例如活动名称、日期、地点、主办方、人物姓名与职务、报名入口、核心介绍和视觉版本。每项信息标明状态：草案、已确认、已发布或已变更；同时注明确认人和确认日期。\n\n事实母版不是又一份宣传稿。它不追求文采，只作为所有产出的共同来源。海报可以把活动介绍压缩成一句话，网页可以展开，PPT可以转化为口头叙事，但名称、日期和人物信息必须回到同一条记录。某项事实变更时，先更新母版，再根据“使用位置”清单逐个同步，并重新生成二维码或导出文件。\n\n在交付包中，还应区分工作文件和发布文件。工作区保留可编辑源文件、草稿图片、证据和备注；发布区只放经过确认、可以对外使用的版本。不要把命名相近的草稿和成稿混在同一目录，也不要把本地预览链接写进正式材料。发布后如果再次修改，应生成新版本，并记录哪些渠道需要替换。"}}}]}, "notes": {"plain": {"content": "前面的内容分别讨论了目标、材料、大纲、视觉和验收。把这些环节放进同一个真实任务，才能看清演示文稿为何不应孤立制作。下面以“豆包工作 AI 开放麦”的活动筹备为例：目标不是只做一份PPT，而是围绕同一场活动，逐步形成宣传信息图、活动展示网页、现场演讲PPT、案例材料和交付包。书稿整理时，活动仍处于筹备阶段，因此以下内容说明的是制作流程，不把尚未发生的活动写成既成结果。\n\n第一步是制作活动信息图。此时应先确认活动名称、日期、地点、议程和报名方式等事实，再确定竖版比例、视觉风格与信息层级。图5-6展示了形成的竖版信息图：它适合在移动端传播，但其中的日期、地点和人物信息仍须在发布前由活动负责人确认。\n\n第二步是把同一组信息扩展为活动展示网页。网页不是把海报放大，而要补充活动缘起、适合人群、议程、案例预告和参与方式，并建立可以浏览的内容顺序。图5-7展示了网页原型的整体效果。页面中的产品能力、统计数字和案例描述如果来自外部资料，应补充来源并核对时效；本地预览地址也不应作为正式发布地址。"}}}]}, "notes": {"plain": {"content": "Microsoft PowerPoint演示文稿（PPT）不是把报告拆成若干页面，也不是文字、图表和图片的简单拼接。它服务于一次具体沟通：在有限时间里，让一群特定的人理解问题、记住重点，并作出判断或行动。页面只是载体，真正决定质量的是叙事是否清楚、证据是否可靠，以及视觉是否帮助而不是妨碍理解。\n\nAI可以参与资料整理、大纲设计、页面生成和反复修改，但如果一开始没有说明汇报对象和目的，它往往只能生成一套形式完整的通用页面。本章沿着“定义汇报—匹配材料—设计叙事—生成页面—验收交付”的顺序，说明怎样把自动生成的初稿打磨为可以正式使用的演示文稿。"}}}, {"id": "ch6", "title": "第6章　表格与数据分析：从数据整理到分析结论", "children": {"attached": [{"id": "79723841b018517d88473315ed", "title": "6.1　选择并理解数据源", "notes": {"plain": {"content": "数据任务的第一步不是计算，而是确认数据来自哪里、代表什么以及是否完整。豆包工作可以读取授权目录中的Excel文件，也可以在权限允许时使用飞书多维表格；两种来源对应不同的数据状态和协作方式。图6-1展示了数据从读取、清洗到分析与核验的完整路径。\n\n沿着图6-1所示流程选择数据源时，还需要区分本地Excel与飞书多维表格的协作特征。\n\n无论使用哪种来源，都应先让AI描述文件名、工作表、字段、记录数、时间范围和明显缺失，再由用户确认。对于在线表格，还要固定本次分析的截止时间或快照，否则同一指令可能因数据更新得到不同结果。\n\nCSV和数据库导出文件也遵循同一原则，只是需要多记录几项技术信息。CSV没有工作表、公式和显式字段类型，应确认字符编码、分隔符、小数点格式、日期格式与导出行数；数据库查询结果则应保存来源系统、查询语句或查询版本、筛选参数、导出时间及时区、字段结构、行数，以及可用时的快照标识。正式分析应基于固定导出副本，不直接把持续变化的查询结果当成不变底表。"}}}, {"id": "601e14f73172504eb9a94277a4", "title": "6.2　数据清洗、合并与批量处理", "children": {"attached": [{"id": "5c1d1ec06fc35d4b990977046e", "title": "6.2.1　先定义规则，再处理数据", "notes": {"plain": {"content": "空值如何处理，取决于字段含义。销售额为空可能意味着未录入、没有成交或数据丢失，不能一律填0；重复记录也要先判断是重复导入，还是同一客户的多次交易。每项清洗都应保留处理前数量、处理后数量和变更原因。\n\n清洗规则应当能回答“发现什么、怎样处理、为什么这样处理、能否恢复”。例如，日期格式能够无歧义转换时，可以统一格式但保留原值；金额为空且无法判断是0还是未录入时，应进入异常清单；订单编号相同但金额或时间不同的记录，不应直接删除；状态名称只有在存在已确认映射时才能批量转换。每条规则都要记录处理前后的数量，并标明是否经过人工确认。\n\n这种记录既方便抽样检查，也能在业务规则变化时重新处理原始数据。若只保存清洗后的结果而不保存规则，下一次很难判断差异来自新数据还是处理方法改变。6.4节的案例会用表6-4和表6-5分别展示体检结果与清洗明细。\n\n清洗指令\n\n请复制原文件并在副本中清洗数据：统一日期为YYYY-MM-DD，金额保留两位小数，状态值映射为“待处理、处理中、已完成”。空值和疑似重复项不要直接删除，分别放入“待确认”工作表；生成清洗日志，记录每类问题的数量和处理规则。"}}}, {"id": "70f06a2cf6ed53d28b63522476", "title": "6.2.2　跨表合并后，先验证记录没有被遗漏或重复放大", "notes": {"plain": {"content": "合并数据时应明确关联键、保留哪张表的全部记录，以及匹配失败如何处理。批量任务还需要规定文件范围、命名规则、异常跳过条件和最终汇总方式。\n\n批量合并指令\n\n工作目录“原始报表”中有多份每日销售表。请先检查列名是否一致，以“订单编号”作为去重键，并新增“来源文件”和“业务日期”两列。先处理3份生成样表和日志；我确认后再汇总全部文件。无法解析的文件不要跳过，列入异常清单。\n\n批量处理的稳定性来自可复现的规则，而不是一次处理的文件数量。正式全量运行前，先用小样本验证输出，是最有效的风险控制方法。\n\n跨表合并是数据任务中风险最高、又最容易被“成功生成文件”掩盖的环节。工具没有报错，并不代表合并正确。真正决定结果的是关联键是否唯一、两张表之间是什么关系，以及未匹配记录如何保留。\n\n开始合并前，应分别检查关联键。订单编号在订单表中可能唯一，在订单明细表中却会因为一个订单包含多个商品而重复；客户编号在客户主数据中应当唯一，在交易表中则必然多次出现。如果把两个都存在重复的字段直接连接，就可能形成多对多关系，让记录数和金额成倍放大。"}}}]}, "notes": {"plain": {"content": "原始数据常见的问题包括缺失、重复、单位不一致、日期格式混乱和跨表关联失败。清洗的目标不是让表格看起来整齐，而是建立可以解释和复现的处理规则。"}}}, {"id": "1fad32361606534192d0d7830c", "title": "6.3　数据可视化：让图表服务于问题", "notes": {"plain": {"content": "可视化指令\n\n基于已核验的数据，制作“月度销售趋势”“各区域目标完成率”和“产品结构”三张图。统一时间范围与单位，每张图写明数据来源和截止日期，并在标题中表达主要结论。不要使用3D效果；颜色数量控制在能够清晰区分的范围内。\n\n数据看板适合周期性管理，但不应一次塞入所有指标。核心关键绩效指标（Key Performance Indicator，KPI）、异常提示和趋势应放在视觉优先位置，明细表则作为进一步追查的入口。\n\n同一组数据在分析阶段和汇报阶段承担不同任务。分析阶段的图表用于发现问题，宁可保留更多分组、异常点和辅助线；汇报阶段的图表用于解释一个已经核验的结论，需要减少无关信息并突出比较关系。把两种图混为一谈，容易出现“为了页面好看而隐藏异常”，或“把探索过程中的偶然现象写成正式结论”。\n\n验证图首先要帮助分析者检查数据。例如，绘制每日销售趋势时，同时显示数据点数量和缺失日期，可以发现某几天根本没有导入；绘制分布图时保留极端值，可以判断平均数是否被少数大额订单拉高；绘制散点图时标识样本量，可以避免从几个点推导稳定关系。这些图未必适合管理层页面，却是结论形成前的重要证据。"}}}, {"id": "1000c2fd931c50a9b9dff67271", "title": "6.4　从分析结果到业务判断", "children": {"attached": [{"id": "ea2486a2c1545ea4aeab1732ec", "title": "6.4.1　从事实、假设到可验证的经营判断", "notes": {"plain": {"content": "一份可信的经营诊断应保留计算口径和证据链。例如，“某区域销售下降”是数据事实；“渠道活动减少导致下降”是需要额外证据验证的假设；“恢复活动”则是基于假设的建议。把三者分栏表达，可以避免读者误把推测当成结论。\n\n诊断指令\n\n请基于已清洗数据分析销售额、目标完成率、回款率和新增客户数。先列数据事实，再提出原因假设，并为每个假设说明支持证据和缺失证据；行动建议必须包含负责人、验证指标和复盘时间。无法由现有数据支持的判断标为“需业务确认”。\n\n下面用一份50行的虚构销售样本走完整流程。样本中的姓名、区域和业绩只用于教学，不对应真实员工，也不能直接用于人员评价。数据包含销售员、区域、产品线、当月业绩、目标、完成率、在岗年限和客户数等字段。案例要回答的不是“谁最好、谁最差”，而是如何从原始记录得到可复算的统计结果，再把统计线索转化为待验证的业务问题。\n\n为了避免把一条长指令直接交给系统后只验收最终报告，完整过程分为五个阶段：先体检字段、空值、重复值和异常格式；再按确认后的规则清洗副本；随后计算完成率、排名、区域汇总和相关系数；接着区分数据事实与原因假设；最后交付报告、处理日志和待确认事项。每个阶段都要保留中间证据，并设置相应的人工检查点。"}}}, {"id": "c4db89d9640a56c1bbc304a3da", "title": "6.4.2　把原因假设转化为下一轮可验证的问题", "notes": {"plain": {"content": "分析报告常在“提出三条建议”时结束，但建议如果没有验证路径，仍然只是更有行动感的猜测。数据能够提示哪里发生异常，却很少单独说明为什么发生。比较成熟的做法，是把每个原因假设转化为下一轮可以收集证据的问题。\n\n假设“华中区域完成率较低是因为重点客户流失”，下一步需要的不是立即要求销售团队增加拜访，而是核对重点客户名单、去年同期贡献、流失时间和原因记录。假设“新员工占比较高影响结果”，就要区分在岗时长、岗位类型、培训完成情况和客户分配，不能把相关关系直接转化为人员评价。\n\n一项假设进入行动前，至少要写清四件事：支持它的现有证据，可能的其他解释，需要补充的数据，以及什么结果会推翻该假设。最后一项尤其重要。如果不允许任何新证据改变判断，所谓验证就只是为既有结论寻找支持。\n\n行动建议也应分级。能够低成本获取信息的，先补数据或访谈；影响范围较小且可逆的，可以设计试点；涉及人员、预算或客户关系的高影响措施，要经过相应责任人批准。每项试点应有基线、观察周期、成功指标和停止条件，避免“先做了再说”。"}}}]}, "notes": {"plain": {"content": "从数据生成经营建议，需要区分三个层次：数据事实说明发生了什么，原因假设解释可能为什么，行动建议说明下一步如何验证或改善。AI可以帮助发现模式，却不能仅凭相关性确认因果关系。"}}}, {"id": "1bf65550a61553838fe3d8813b", "title": "6.5　把口径写进指令，把核验留到交付前", "children": {"attached": [{"id": "432d2a754c475113891635f93a", "title": "6.5.1　完整案例：建立可重复生成的经营月报", "notes": {"plain": {"content": "假设一家区域公司每月收到12家门店的销售、库存和活动报表，过去由专人复制粘贴到总表，再手工制作图表。团队希望让Agent协助生成经营月报，但目标不是把一次手工操作自动重演，而是建立下个月仍能运行、结果能够复算的流程。\n\n第一阶段只建立输入规范。负责人收集三类报表的样例，确认门店编号、业务日期、含税销售额、退款、期末库存和活动费用等字段，并规定每月关账时间。Agent读取样例后输出字段差异：两家门店使用名称而非编号，一份库存表把日期写成文本，活动费用存在元和万元两种单位。团队先修正模板和映射表，再决定允许哪些异常自动转换。\n\n第二阶段进行小样本试跑。只选择三家门店，生成数据体检、清洗副本、关联结果和处理日志。试跑发现活动表按活动编号记录，而销售表按订单记录，如果直接按门店和日期连接会形成多对多关系。于是流程改为先把活动费用汇总到“门店—日期”粒度，再与每日销售表关联。修改后，合并前后销售额保持一致，未匹配活动记录单独列出。"}}}, {"id": "dde865a8774a554db1e6e4fc05", "title": "6.5.2　让交付工作簿既能阅读，也能复算", "notes": {"plain": {"content": "数据任务的最终文件不应只有一张经过美化的汇总表。为了让接收者理解并复算，可以把工作簿分成“说明、结果、明细、异常、日志”五类工作表。说明页记录数据截止时间、口径、版本和负责人；结果页呈现核心指标与图表；明细页保留形成结果的可追溯数据；异常页集中列出缺失和冲突；日志页记录清洗、关联和计算规则。\n\n多人协作时，文件名也应承担版本识别功能。可以采用“主题_数据截止日期_版本_状态”的结构，例如全国销售业绩_截至2026-08-31_v1.2_已复核.xlsx；每次修改递增版本号，在日志中记录修改人、时间和变化内容，不用“最终版”“最终版2”区分文件，也不覆盖已经用于汇报或审批的旧版本。\n\n公式是否保留取决于交付用途。需要继续维护的工作簿应保留可理解的公式、命名和引用，避免把所有结果粘贴为数值；用于固定归档时，可以另存值版本，但必须保留可复算的工作底稿。复杂公式宜拆成中间列，并在说明中解释，不把关键逻辑隐藏在难以审查的一长串表达式中。"}}}]}, "notes": {"plain": {"content": "完成业务解释之后，还需要回到任务起点检查：最初的指令是否写清了口径，最终的交付是否经得起复算。数据指令至少应包含数据源、工作表或表格名称、时间范围、指标口径、输出格式和原文件保护要求。对于较长表格，还要明确完整保存到文件，而不是依赖对话窗口展示全部记录。\n\n核验不应只随机看几行。更稳妥的方法是同时做总量核对、边界样本核对和关键指标复算：清洗前后的记录数及金额合计能否解释，空值、极端值和跨期记录是否按规则处理，报告中的核心比例能否从明细重新算出。对于合并任务，还要统计匹配成功、未匹配和一对多匹配的数量，确保没有记录在连接过程中被遗漏或重复放大。\n\n以下检查应在交付前完成：\n\n核对输入文件、版本、时间范围和记录数。\n\n抽样复算关键指标，特别是同比、环比、占比和完成率。\n\n检查单位、精度、空值和异常值处理是否符合约定。\n\n确认图表与正文引用的是同一份数据。"}}}]}, "notes": {"plain": {"content": "演示文稿中的关键数字是否可信，取决于它们能否回到原始记录和计算过程。数据分析的价值不在于堆积数字，而在于从记录中发现变化、解释原因并支持判断。现实工作中，数据清洗、表格合并、指标计算和图表制作通常耗时较多，其中任何一个环节出现偏差，都可能影响最终结论。因此，AI介入数据工作时，效率与准确性必须同时受到重视。\n\n本章围绕数据从读取到解释的过程展开，分别介绍本地Excel文件与飞书多维表格的处理方式，并讨论清洗、合并、批量计算和可视化等常见任务。在具体案例中，还将说明如何核对数据结构、验证计算结果，并从业务数据中形成有依据的分析判断。"}}}, {"id": "ch7", "title": "第7章　深度调研与专业分析：从检索到研究报告", "children": {"attached": [{"id": "e06b339641a15f34848f398a5f", "title": "7.1　建立深度调研的五步工作流", "children": {"attached": [{"id": "a8ab528c9c05501b8f3464397a", "title": "7.1.1　从“找资料”转向“回答研究问题”", "notes": {"plain": {"content": "五步法解决的不是同一个问题，而是一组彼此衔接的研究任务。\n\n理解调研目标。 明确报告服务于什么决策，并把宽泛主题拆成可以由证据回答的子问题。\n\n多渠道检索。 根据不同子问题选择接近事实源头的渠道，而不是只扩大关键词和网页数量。\n\n信息筛选。 删除重复转载、无日期、无出处或与研究范围无关的材料，保留可追溯的证据。\n\n交叉验证。 比较来源的独立性、权威性与统计口径，记录一致、冲突和无法确认之处。\n\n生成报告。 围绕研究问题组织结论、证据、限制和建议，并让关键说法能够返回原始来源。\n\n这套流程与“搜索引擎加人工整理”的差别，不是人从此退出，而是AI可以承担更多检索、归类和格式转换工作。研究者的注意力因此能够放在范围、证据和判断上。需要警惕的是，检索得更快并不代表来源更可靠；自动生成了一份结构完整的报告，也不代表其中的数字已经核实。"}}}, {"id": "727d88734db85d83bef3f4e3b4", "title": "7.1.2　一条合格的调研指令应写清五类信息", "notes": {"plain": {"content": "研究问题确定后，不要立刻要求“生成完整报告”。先把用途、范围、来源、核验规则和交付物写清楚，才能让Agent知道往哪里查、查到什么程度，以及遇到证据缺口时如何处理。\n\n请围绕【研究问题】开展深度调研。\n\n1. 报告用途与读者：【支持什么判断，供谁阅读】；\n\n2. 研究范围：【对象、地域、时间范围，以及明确排除的内容】；\n\n3. 来源要求：优先使用【主管机构、产品官方资料、原始研究、上市公司披露等】，关键材料记录标题、发布机构、发布日期、链接和访问日期；\n\n4. 核验要求：区分事实、推断和建议；比较数据口径；来源冲突时并列呈现，无法确认时标为“待核实”；\n\n5. 交付物：先提交调研计划和待确认问题，经我确认后，再输出【证据表、报告大纲和正文初稿】。未经确认不要公开发布或发送。\n\n例如，“调研国内企业级AI办公市场”仍然只是主题。将它拆成市场范围、主要参与者、目标客户问题、产品能力、商业模式和进入条件之后，AI才有可能建立有用的检索路径。若报告用于产品规划，还要补充企业自身资源；若用于采购，则要加入部署条件、数据安全和总成本。用途不同，证据结构也会随之改变。"}}}, {"id": "0a7b4b77bc975e668578867a58", "title": "7.1.3　用追问修正证据，而不是只润色文字", "notes": {"plain": {"content": "第一轮结果通常只能帮助研究者看清资料版图。后续追问应针对信息缺口和证据质量，而不是笼统要求“再深入一点”。常见追问可以分为四类：\n\n补缺口： “报告缺少样本量和调查对象，请补充原始研究；找不到时说明缺口。”\n\n查源头： “这三个数字来自转载页面，请追溯最初报告，并补充原文链接与页码。”\n\n统一口径： “两份市场规模数据的产品范围不同，请分别说明口径，不要直接比较或求平均值。”\n\n挑战结论： “现有证据是否足以支持‘行业增长放缓’？请列出支持与反对该判断的材料。”\n\n调研是否可用，不由追问次数决定，而由重要问题是否已有相称的证据决定。有些任务一轮即可完成，有些任务需要回到业务人员、访谈对象或内部系统补充材料。把“还不知道什么”写出来，本身就是研究成果的一部分。"}}}, {"id": "0da78aaca94a546aa94e4dbeef", "title": "7.1.4　明确公开检索、内部信息与人工判断的边界", "notes": {"plain": {"content": "深度调研擅长处理能够合法访问的公开信息，但不能把不存在的数据“搜出来”，也不能替代一手调查和决策责任。使用前至少要识别四类边界。\n\n一手信息边界。 客户访谈、渠道反馈和现场观察需要由人获取，AI只能帮助设计提纲、整理记录和比较样本。\n\n内部数据边界。 经营数据、客户资料和销售记录不会因为用户有权查看就自动适合交给AI处理；应按组织制度脱敏并最小化授权。\n\n访问条件边界。 需要登录、付费或受许可限制的材料，应确认访问权和使用范围，不应绕过限制，也不能把搜索摘要当作原文。\n\n最终判断边界。 是否进入市场、选择学校或接受某项风险，需要结合个人或组织目标作出。AI可以列出条件和证据，不能承担决定及其后果。\n\n边界不是给调研“降速”，而是防止自动化绕过必要的核验。带着这套五步法，下面先从两个容易观察结果的表格任务开始。"}}}, {"id": "f1ea9fb76a9e5a449730615598", "title": "7.1.5　先画检索地图，再决定什么时候停止", "notes": {"plain": {"content": "调研任务常见的两种失控方向是：一开始用一个宽泛关键词搜索，结果被高频页面牵着走；或者为了追求“全面”不断增加链接，却没有增加新的证据。检索地图用于在搜索之前说明每个研究问题需要什么类型的材料，以及什么结果意味着这一轮已经足够。\n\n以“某城市是否适合设立区域服务中心”为例，研究问题可以拆为客户分布、人才供给、运营成本、政策环境和交通条件。每个问题还要继续对应证据：客户分布可能来自内部订单，人才供给需要统计资料和招聘数据，运营成本需要租金、薪酬与税费口径，政策环境应回到主管部门文件。这样，搜索过程不会被某一篇综合报道替代。\n\n关键词也应围绕子问题组织，而不是只把主题词反复排列。可用的检索组合通常包含四类限定：对象及其同义词，时间与地域，所需指标，以及希望找到的文件类型或发布机构。例如，查某地产业政策时，可以组合产业正式名称、当地主管部门、适用年份以及“实施细则、申报指南、通知”等文件类型；查市场规模时，则应加入统计口径、样本对象和原始报告机构。"}}}]}, "notes": {"plain": {"content": "深度调研不是一个更长的问答，也不等于一次搜索。它需要把目标界定、资料检索、信息筛选、交叉验证和报告生成连成闭环：前一步决定后一步的质量，后一步发现的问题又可能要求返回前面补充材料。"}}}, {"id": "b6206b3e9be25e24946bb6961a", "title": "7.2　用两个表格案例完成受控试跑", "children": {"attached": [{"id": "ca21f7ee06ac5bd1b734a81f31", "title": "7.2.1　校招岗位表：先验证检索与整理链路", "notes": {"plain": {"content": "假设一名软件工程专业学生准备查询湖北地区的校招岗位。图7-2展示了从任务输入到表格结果的界面示例。它说明AI可以把分散信息整理为结构化清单，但截图中的企业、岗位和届次只是当次任务的界面示意，不能替代当前招聘公告，更不能直接作为投递依据。\n\n为了让这类任务可核验，可以把操作组织为四步。\n\n第一步，说明背景与筛选条件。专业、毕业届次、目标地区、岗位方向和信息截止日期都应写清楚，避免“我能报的岗位”被无限扩张。\n\n第二步，限定来源和输出字段。优先查看用人单位招聘官网、官方招聘账号和学校就业信息平台；岗位名称、工作地点、专业要求、申请截止时间和来源链接分别成列。\n\n第三步，先用少量样本试跑。先整理10条，检查是否混入实习、社招、过期岗位或地区不符的信息，确认字段后再扩大范围。\n\n第四步，核验后再使用。抽查原始公告，记录访问日期，将“明确符合”“需要确认”和“不符合”分开；最终投递资格以用人单位公告和人工判断为准。"}}}, {"id": "d486a990366d5a2fb92c1553c1", "title": "7.2.2　考研择校表：表格完整不等于信息可信", "notes": {"plain": {"content": "把同样的方法迁移到考研场景，可以得到院校、专业方向、考试科目和历年复试线等字段组成的择校表。图7-3展示了当次任务形成的界面结果，其中“冲、稳、保”是一种便于比较的候选分组，不是系统能够替考生作出的录取概率判断。\n\n择校信息比一般清单更敏感：招生目录可能按年度调整，专业代码和考试科目可能变化，复试线与国家线也不是同一概念，“报录比”则常常没有官方数据。如果AI为了填满表格而沿用往年数据或引用无出处的统计，整齐的结果反而会增加误判风险。\n\n因此，快速试跑阶段只要求建立候选清单，不急于给出最终分档：\n\n我是【年级与专业背景】学生，计划报考【年度】研究生，关注【地区】的【专业方向】。请先整理候选院校样本，字段包括院校名称、所在地、学位类型、招生专业及代码、初试科目、信息适用年度、官方来源链接和访问日期。招生专业与考试科目以目标院校研究生院最新招生目录为准；历年复试线注明年份与口径；找不到官方报录比时填写“未公开”，不要根据录取名单自行估算。此阶段只建立候选清单，不替我决定冲刺、稳妥或保底院校。"}}}, {"id": "0fb932d7eeb8543b97a75bdb0b", "title": "7.2.3　用错误样本检验结果，而不是只看整齐的前几行", "notes": {"plain": {"content": "因此，试跑样本不应只随机抽取。可以同时选择五类记录：信息最完整的普通样本，字段缺失的样本，来源时间最早或最晚的样本，分类结论接近边界的样本，以及会直接影响最终建议的关键样本。检查这些记录，比单纯增加抽查数量更容易发现规则问题。\n\n核验时要把“来源存在”和“字段得到支持”分开。一个招聘官网链接可以证明岗位页面存在，却未必支持表格里填写的工作城市；一个招生简章可以说明总体报考条件，却未必支持某个学院的考试科目。每个关键字段都应能定位到页面中的对应信息，不能让一条可靠链接为整行内容作笼统背书。\n\n如果样本发现系统把“优先”误判为“必须”、把“截止日期待定”改写成具体日期，修正的不只是这几行，而是抽取规则和状态标签。重新运行后，再用原来的错误样本回归检查，确认规则已经生效。对于无法稳定识别的字段，可以把它从自动填充改为“原文摘录＋人工判断”，不必追求所有列都自动完成。"}}}]}, "notes": {"plain": {"content": "初次使用深度调研，不必从长篇报告开始。将结果限定为一张字段明确的表格，更容易检查范围是否正确、来源是否齐全，也能及时发现事实过时和字段口径不一致。校招岗位与考研择校都适合做这种试跑：信息分散、更新频繁，而且每一行都应该能够追溯到出处。"}}}, {"id": "68d6edf819b150b29e67a5709c", "title": "7.3　进阶实战：把考研择校表升级为可信报告", "children": {"attached": [{"id": "bb25b42f693c52809e057fc9a7", "title": "7.3.1　第一步：把目标拆成可核验的调研清单", "notes": {"plain": {"content": "“帮我推荐学校”把太多判断压缩在一句话里。更稳妥的做法，是先列出需要查证的维度，再说明哪些信息由公开资料提供，哪些必须由考生本人补充。表7-1列出了择校调研的主要维度、需要回答的问题和优先来源。\n\n这张清单把事实查证与个人判断分开。可以先让AI检查维度是否齐全，再开始检索：\n\n请把“【地区】【专业方向】考研择校”拆成一张调研清单。每个维度写明需要回答的问题、优先官方来源、适用年度和可能的信息缺口。先不要推荐学校；请列出还需要我补充的成绩基础、专业偏好、预算与城市限制。"}}}, {"id": "d2229d99ddb459a78c4f2ea436", "title": "7.3.2　第二步：按来源等级进行多渠道检索", "notes": {"plain": {"content": "不同来源承担不同角色。中国研究生招生信息网、教育考试机构、院校研究生院和学院官网用于确认招生政策与专业信息；学校就业质量报告等公开材料可补充培养和去向；论坛、问答社区和经验帖只能提供体验线索，不能替代官方数字。\n\n检索时应记录页面标题、发布机构、发布日期、链接、访问日期和适用年度。网页没有日期、内容来自转载或只剩搜索摘要时，应降低使用等级。涉及政策和招生要求，还要检查是否已经有更新版本取代旧页面。\n\n请按来源等级检索【地区】【专业方向】的候选院校。一级来源为研招网、教育考试机构和院校官方招生文件；二级来源为学校发布的培养、就业等公开报告；社区内容只用于收集待验证问题。每条记录保留来源标题、发布机构、发布日期、链接、访问日期和适用年度。不要用旧年度信息填补当前年度空缺。"}}}, {"id": "01e81db88b8050d6938f706696", "title": "7.3.3　第三步：筛掉低质材料，建立证据表", "notes": {"plain": {"content": "“官方来源优先”仍然不够，因为官方页面也可能属于不同年度或不同专业。筛选时要同时检查来源身份、发布日期、适用对象和字段口径。招生专业与考试科目应回到当年专业目录，复试线应区分学校线、学院线与专业线，招生人数还要说明是计划数还是实际录取数。\n\n建议把筛选结果保存为证据表，而不是只留在对话里。表7-2给出最小字段结构，使每项结论都能回到来源和适用口径复查。\n\n可以用下面的指令完成筛选，但删除来源之前仍应保留记录，以便复查AI为何将其排除。\n\n请审核已经收集的材料：检查来源是否为原始页面、是否适用于【报考年度】、专业与学位类型是否一致。将重复转载、无日期、无出处和口径不明的内容移出证据表，并另列“排除材料及原因”。查不到官方出处的数据标为“待核实”或“未公开”，不要写入确定结论。"}}}, {"id": "44aad8a506255033ade7baa020", "title": "7.3.4　第四步：用独立来源核对，而不是机械凑够两个链接", "notes": {"plain": {"content": "交叉验证的目的，是发现错误与口径差异，不是让两个网页简单“投票”。多家网站如果都转载同一份招生文件，仍然只有一个来源；反过来，一份当前有效的院校官方目录，可能比多篇旧经验帖更适合确认考试科目。\n\n对每项关键数据，先确定最有权威性的原始来源，再寻找独立材料检查是否有更新、遗漏或解释差异。只有一个权威来源时，可以标为“单一官方来源已核对”，而不应为了形式上的“双来源”引入低质量材料。发生冲突时，应并列呈现数值、年度和口径，由读者看到不确定性。\n\n请核对证据表中的招生专业、初试科目、复试线和录取数据。先追溯原始官方文件，再判断其他来源是否独立；转载同一文件的不计为第二来源。来源一致时记录核对依据；来源冲突时并列列出原文、年度和口径，不要擅自选取或求平均值。最后输出“已核实、单一官方来源、存在冲突、未公开、待核实”五类状态。"}}}, {"id": "6778f287e948580c958232f731", "title": "7.3.5　第五步：生成带证据、限制和待办的报告", "notes": {"plain": {"content": "前四步完成后，报告才能进入成稿阶段。交付物不应只有一张院校表，还应包括研究范围、信息适用日期、证据状态、尚未解决的问题和个人需要补充的判断。若要提供“冲刺、稳妥、保底”情景组合，必须先由考生给出可比较的成绩基础、目标和风险偏好，并明确这只是规划方案，不是录取概率预测。\n\n下面是一条整合五步法的完整指令。它适合已经理解流程、希望一次建立任务框架的读者；执行过程中仍应在调研计划、证据表和报告初稿三个节点检查结果。\n\n请开展“【报考年度】【地区】【专业方向】考研择校”深度调研。\n\n我的背景与限制：【专业背景、成绩基础、目标、预算、城市偏好和风险承受度】。\n\n先提交调研计划，列出需要核实的报考资格、招生专业、初试科目、近三年复试线、招生与录取数据、学制学费及培养地点。信息源优先使用研招网、教育考试机构、院校研究生院和学院官网；所有关键记录保留标题、发布机构、发布日期、链接、访问日期、适用年度和口径。"}}}, {"id": "05b68af3f661598b89c31ee968", "title": "7.3.6　把研究材料写成真正支持决策的报告", "notes": {"plain": {"content": "证据表完成后，仍不能直接按来源顺序拼成正文。研究报告的读者通常不会重复整个检索过程，他们首先需要知道要解决什么、证据支持什么、哪些条件会改变结论，以及下一步由谁行动。报告结构应围绕这条决策路径，而不是围绕“搜到了哪些资料”展开。\n\n一份面向决策的报告可以分成六个部分。执行摘要用一页说明研究问题、主要发现、建议和最大不确定性；范围与方法说明时间、地域、对象、来源标准和排除项；主体发现按子问题组织，每项先给结论，再给证据；方案比较呈现不同选择及其适用条件；风险与限制说明证据缺口、口径冲突和可能失效的前提；附录保留证据表、检索记录和详细数据。\n\n执行摘要不应出现正文没有证明的新结论，也不宜把条件性判断压缩成绝对结论。例如，正文只能支持“在当前三家候选中，方案A的功能覆盖较高，但实施成本仍待报价确认”，摘要就不能写成“方案A性价比最高”。摘要越短，越需要准确保留结论的边界。"}}}]}, "notes": {"plain": {"content": "下面继续使用考研择校场景，不是因为AI适合替人选学校，而是因为这一任务同时具备范围界定、动态信息、多来源冲突和高影响决策四个特征。读者可以把相同方法迁移到市场研究、竞品分析、采购选型和政策调研中。"}}}]}, "notes": {"plain": {"content": "临近汇报，负责人要求第二天交一份市场、竞品或政策研究。真正困难的通常不是“写出三千字”，而是在有限时间内回答三个问题：该查什么，哪些资料可信，现有证据究竟能支持多强的结论。只有篇幅而没有证据链的报告，完成得越快，误导决策的风险反而越大。\n\n本章把起点前移到“尚无现成材料”的调研任务：先建立深度调研五步法，再用校招岗位和考研择校两个表格案例试跑，最后把择校表升级为带来源、可复核的研究报告。豆包工作可以协助拆解问题、检索和整理，人的范围设定、来源判断与最终核验仍不可缺少；读者最终要获得的是一条能说明“结论从哪里来”的证据链。"}}}]}, "notes": {"plain": {"content": "明天就要汇报，桌面上却只有几份会议记录、一张数据表、一版旧方案和若干网页。把这些材料交给AI，几分钟后可能就有一份报告或PPT；可当负责人追问“这个数字从哪里来”“为什么得出这个结论”“这一页到底想说明什么”时，看似完整的成果往往经不起核对。\n\n问题不只是“提示词写得不够好”。很多教程演示的是从一句话到一份初稿，却跳过了真实交付中最费力的部分：辨认有效材料，统一数据口径，区分事实与判断，根据受众重组表达，并让每个重要结论都能回到来源。本篇要补上的，正是从“生成内容”到“形成交付物”之间的这段距离。\n\n本篇适合经常撰写纪要、方案和报告，制作汇报PPT，处理业务数据或开展案头调研的读者。第4章讲文档，第5章讲演示文稿，第6章讲表格与数据分析，第7章讲深度调研。可以直接从最常遇到的任务读起；若要完成一项综合汇报，则建议按“文档梳理—数据核验—研究补充—演示表达”的顺序组合使用。"}}}, {"id": "9ac04c2b59ca578b9e941cfd5d", "title": "第三篇　进阶执行与创作篇", "children": {"attached": [{"id": "ch8", "title": "第8章　操作电脑与浏览器：让跨软件任务保持可控", "children": {"attached": [{"id": "27343f411bd552fe8e141bfb81", "title": "8.1　任务开始前，先划定权限和数据边界", "children": {"attached": [{"id": "9f20222b764c5685a38bdc4b0a", "title": "8.1.1　权限只覆盖完成当前任务所需的范围", "notes": {"plain": {"content": "屏幕访问使系统能够识别界面内容；鼠标键盘控制用于点击和输入；文件访问则决定可以读取或写入哪些目录。一个只需分析指定文档的任务，通常没有理由访问无关文件夹；一个只需收集公开网页信息的任务，也不应默认获得发送消息或修改系统设置的权限。\n\n授权前可以逐项回答四个问题：\n\n为了完成任务，必须开放哪种能力；\n\n权限覆盖哪个应用、账号、目录或时间段；\n\n哪些操作必须在执行前再次确认；\n\n发现异常时，怎样暂停任务并撤回权限。\n\n产品界面可能提供不同的权限项或控制强度，具体名称以当前版本为准。无论界面怎样变化，最小必要授权仍是通用原则：从较小范围开始，只有在明确缺少某项能力时才增加权限；任务结束后，取消不再需要的长期授权。"}}}, {"id": "55ccdb5f712e5abd87db0a4898", "title": "8.1.2　不要把风险控制完全交给系统提示", "notes": {"plain": {"content": "删除、覆盖、发送、发布、支付、安装和账号登录等操作可能产生外部影响，理应得到更严格的确认。但系统是否自动暂停、暂停在哪一步，会受到产品设置和任务环境影响。用户不能只依赖“有风险操作询问”一类开关，还应在任务指令中明确写出边界。\n\n例如：“只填写表单，停在最终提交按钮前等待确认”“所有结果另存为新文件，不覆盖原件”“可以生成邮件草稿，但不要发送”。这些要求把风险点直接放进任务定义，即使界面提示方式改变，也能保留清楚的执行规则。\n\n风险越高，确认越应严格。涉及重要数据、对外沟通或资金的任务，不应为了减少弹窗而放宽控制；更适合的做法是缩小操作范围、增加检查点，并保留执行记录。"}}}, {"id": "13d84c394d535db7b8e8bae62c", "title": "8.1.3　把授权写成任务级权限单", "notes": {"plain": {"content": "系统设置中的权限通常比较宽，例如允许操作电脑屏幕或访问某个目录；真实任务的允许范围却应更具体。权限单用于把系统能够做什么，进一步收缩为本次任务被允许做什么。它不是替代系统控制，而是给执行者和验收者一份共同边界。\n\n一份最小权限单可以记录六项内容：任务对象、允许读取的来源、允许写入的位置、允许使用的账号或应用、必须停下确认的动作，以及权限结束时间。以批量整理合同为例，可以允许读取“待归档合同”目录、允许在“整理结果”目录新建副本、允许使用本地PDF阅读工具；不允许移动原文件、不允许打开邮件发送、不允许把材料上传到未经批准的位置。任务完成后，临时目录授权和登录会话应按需要关闭。\n\n权限单还要说明数据类别。公开网页、内部一般材料、客户信息和高敏感数据不能只因为位于同一文件夹就采用相同方式处理。如果一个目录混有身份证件、银行账号或未公开合同，应先由人分类，把当前任务不需要的材料移出授权范围或完成脱敏，再开始执行。"}}}]}, "notes": {"plain": {"content": "Agent能够执行哪些操作，取决于任务环境、用户授权、软件权限和产品版本。屏幕可见、鼠标键盘控制与本地文件访问是三类不同能力，不应被视为一次性打包许可。图8-1用分层方式呈现了这些权限与风险确认之间的关系。"}}}, {"id": "f7004d1845a25222b3327dea10", "title": "8.2　浏览器任务：把页面操作拆成可核对步骤", "children": {"attached": [{"id": "f433a05bc4705615b25bead269", "title": "8.2.1　信息收集要保留来源和时间", "notes": {"plain": {"content": "网页信息会更新，也可能受到地域、登录状态和个性化展示影响。要求Agent收集资料时，应指定目标网站或来源标准、提取字段、时间范围和输出结构。每条关键信息保留原始链接和访问日期，无法确认的字段应标记，而不是根据相邻内容猜测。\n\n请访问我指定的三个产品官网，找到各自的公开价格页面，提取套餐名称、计费单位、价格、主要功能、适用对象和页面显示的更新时间。统一整理到《产品价格对比.xlsx》，每条记录保留原始链接和访问日期。遇到登录、验证码、区域限制或无法确认的字段时暂停并说明，不要改用未经确认的转载页面。\n\n跨页面比较还要统一口径。月付价格与年付折算价、含税与未税、个人套餐与企业套餐不能直接排列后就得出高低结论。Agent可以帮助标记差异，最终采用哪种比较口径应由用户确认。"}}}, {"id": "513606cf3ad45e6b990f5f5968", "title": "8.2.2　表单任务应把最终提交单独隔离", "notes": {"plain": {"content": "重复录入适合自动化，但表单背后可能连接报名、合同、客户系统或行政审批。任务开始前应确定字段映射、数据来源和异常处理规则，先用少量样本试填，再进行批量操作。\n\n密码、验证码和身份确认由用户本人处理。金额、收件人、合同信息及其他高影响字段应在提交前复核。即使Agent能够找到并点击提交按钮，也应把“填写完成”和“正式提交”设为两个不同阶段。\n\n一个可靠的表单任务会产生三类结果：已填写的记录、因字段缺失而暂停的记录，以及提交或未提交的状态清单。这样，用户能够知道系统处理了什么，而不是只看到一句“任务完成”。"}}}, {"id": "847c69a4008f5e4ab3aa4662e4", "title": "8.2.3　把动态页面和登录会话视为会变化的输入", "notes": {"plain": {"content": "浏览器任务与处理静态文件不同。相同网址在不同时间、账号、地区和窗口尺寸下，可能呈现不同内容；页面还会因为弹窗、延迟加载、排序和个性化推荐改变元素位置。依赖固定坐标连续点击的流程，即使第一次成功，也未必能够稳定复现。\n\n更可靠的页面操作应围绕可识别对象和页面状态设计。点击之前确认页面标题、账号身份、目标记录和按钮文字；点击之后检查是否出现预期状态、网址或结果数量。若按钮因页面更新更名或移动，任务应停下来重新识别，而不是在相同位置盲目点击。\n\n登录会话尤其需要单独管理。账号切换、登录超时和多标签页可能让任务在不知不觉中使用错误身份。开始前应显示当前账号和组织空间，涉及客户、财务或内部知识库时再次核对；登录失效后由用户完成密码、验证码或多重验证，Agent只在确认恢复到正确页面后继续。\n\n动态列表还存在“看到的不等于全部”的问题。页面可能只加载当前视口，翻页规则可能改变，筛选条件可能在刷新后恢复默认。收集任务应记录筛选项、排序方式、页数或截止条件，并在结束时核对记录总数。若页面没有稳定总数，可以保存首尾记录、时间范围和异常说明，不能把当前已加载内容写成完整结果。"}}}]}, "notes": {"plain": {"content": "浏览器适合处理路径相对稳定、字段明确并且结果能够复核的任务。常见的资料收集、价格比较和表单填写，都可以拆成“访问页面—识别目标—提取或填写—核对结果”四个步骤。越接近最终提交，对操作对象和人工确认的要求越高。"}}}, {"id": "7f2c3599f71d51d4b43ff41695", "title": "8.3　本地文件与跨软件任务：先画清数据流向", "children": {"attached": [{"id": "767153763af756bbab8ada5be2", "title": "8.3.1　文件操作必须保留原件和变更记录", "notes": {"plain": {"content": "批量任务要明确文件范围、命名或分类规则、重复项处理方式以及无法识别时的做法。第一次运行时，先选择少量样本生成预览和日志，确认规则后再处理全量。涉及重命名、移动或格式转换时，应尽量保留原件，并把新结果写入单独目录。表8-1列出四类常见任务必须说明的规则及应保留的记录。\n\n例如，整理合同时可以这样设置边界：\n\n请读取工作目录“原始合同”中的PDF，提取合同名称、对方名称、签署日期和到期日期，汇总到《合同台账.xlsx》。不要修改、移动或删除原文件；先处理3份，输出字段样例和异常说明，等待我确认后再处理其余文件。无法识别的信息标记为“待核实”，并记录来源文件。"}}}, {"id": "3c5870789c3157938167fee85c", "title": "8.3.2　跨软件处理要设置中间检查点", "notes": {"plain": {"content": "跨软件任务可能从网页下载资料，在表格中清洗，再写入文档或业务系统。任何一个环节的错误都会被带到下一步，因此不宜只规定最终成果。应明确输入、转换规则、中间产物、目标软件和保存位置，并在关键转换后设置检查点。\n\n例如，将网页订单录入表格后，可以先核对记录数与金额合计，再生成财务汇总；把文档数据写入业务系统前，可以先输出待录入预览。中间检查点不需要很多，但应放在错误影响将明显扩大的位置。\n\n如果任务会使用同一文件或账号，避免与其他自动任务同时运行。软件弹窗、文件占用和登录超时都是常见阻塞原因，处理规则应写入任务说明，而不是等出错后临时猜测。"}}}, {"id": "730a67e0baac57ef9e7fc6cd91", "title": "8.3.3　让重复运行安全：幂等、清单与检查点", "notes": {"plain": {"content": "桌面任务经常因为网络中断、软件崩溃或人工暂停而需要重新运行。如果同一任务第二次执行会重复创建文件、覆盖已确认成果或再次录入数据，恢复就会比初次执行更危险。所谓幂等，是指在输入和规则没有变化的情况下，重复执行不会产生额外副作用，或至少能够识别哪些对象已经处理。\n\n文件任务可以通过清单实现这一点。运行前生成待处理清单，为每个源文件记录完整路径、大小、修改时间和计划动作；运行后增加结果路径、状态和异常。重新开始时先读取清单，已完成且校验一致的记录不再处理，失败记录从相应检查点重试，新出现的文件作为新批次进入。不要仅凭文件名判断是否已经处理，因为同名文件内容可能不同。\n\n重命名任务还要保留双向映射。新名称生成前先检查重复和非法字符，整个映射获得确认后再执行；若中途失败，能够根据映射把已改部分恢复。移动和归档任务应先复制到目标目录、核验数量与校验值，再根据批准规则处理源文件。直接在原目录边遍历边移动，会让剩余清单不断变化，也更难恢复。"}}}]}, "notes": {"plain": {"content": "批量重命名、分类归档、格式转换、内容提取和跨软件搬运，都属于规则驱动的桌面任务。它们表面上是文件操作，真正需要设计的是数据从哪里来、经过哪些处理、写到哪里去，以及失败后如何恢复。\n\n文件任务通常落到重命名、格式转换和字段提取三类具体动作。图8-4展示文件从混杂输入到分类目录和汇总表的处理过程，并将三类动作并列呈现。图中“保留原始文件、先用小样本试跑”不是附加建议，而是这类任务能够安全扩大的共同前提。"}}}, {"id": "ff95e1d1d718503890c8f75e2e", "title": "8.4　根据资源位置选择执行环境和远程入口", "children": {"attached": [{"id": "d53362c32efb58ed88e0e2fc97", "title": "8.4.1　本地、隔离环境与云端各有边界", "notes": {"plain": {"content": "需要本机文件、专用软件、字体或内网资源的任务，通常更适合本地执行。某些版本可能提供相对独立的操作界面或虚拟桌面，用于减少对用户当前桌面的干扰；它是否仍依赖本机、能够访问哪些资源，应以实际环境说明为准。\n\n从更广的角度看，执行环境还可能与云端运行、移动端管理和浏览器操作组合。图8-6归纳了四种常见形态，实际可用的组合取决于产品版本、设备状态和组织权限，不能仅凭示意图判断功能已经开通。\n\n云端更适合材料已经处于允许的云端范围、任务不依赖本机专用环境，并且需要后台持续处理的情况。使用前仍要确认数据规则、账号权限、成果保存位置和失败通知方式。不能仅因为任务耗时较长，就默认把敏感材料迁移到云端。表8-2从文件与软件、数据边界、设备状态和接管方式四个维度比较两种选择。\n\n选择执行环境时，可以先把任务沿数据流拆开。例如，项目组要从公开网页收集资料，再与本机保存的未公开报价比较并生成内部报告。公开资料收集可以在允许的云端环境中独立运行，报价匹配和报告整合则留在本地；两段任务通过一份字段清楚、已检查的公开资料表交接。这样既不必把全部敏感文件迁移到云端，也避免让浏览器收集任务直接接触内部目录。"}}}, {"id": "3991b0deefa75a4b9aa689b141", "title": "8.4.2　手机更适合管理任务，不适合替代桌面验收", "notes": {"plain": {"content": "在支持远程任务管理的版本中，手机可以用于查看进度、接收确认请求，或发起适合云端执行的任务。图8-7展示的是一种远程操作示意，具体入口、设备要求和界面可能随版本变化。\n\n移动端屏幕较小，适合判断“是否继续”和“是否需要马上处理”，不适合核对复杂表格、长文档或大量文件。收到发送、删除或敏感操作确认时，应先查看完整上下文；如果手机上无法充分核对，就暂停任务，回到桌面环境处理。\n\n远程入口扩大的是任务管理地点，并没有改变权限责任。设备保持在线、同一账号登录等条件，以及能够调用哪些本地文件和工具，都应以当前产品说明和实际界面为准。"}}}]}, "notes": {"plain": {"content": "任务在本地还是云端运行，会影响它能访问的文件与软件、是否依赖当前设备，以及用户怎样观察和接管。选择环境的首要依据不是“哪个更快”，而是材料和工具实际位于哪里，数据能否离开本机，以及任务是否需要持续在线。"}}}, {"id": "1407748b988758ed85f4316fac", "title": "8.5　用试跑、中断、回滚和日志形成安全闭环", "children": {"attached": [{"id": "69a2a409d6b750c6b67975b0ca", "title": "8.5.1　高影响任务先做预检和小样本试跑", "notes": {"plain": {"content": "预检应确认材料版本、目标账号、输出目录、权限范围和停止条件。批量任务先处理少量样本，网页任务先走通一条完整路径，跨软件任务先验证一次数据传递。样本通过后，再扩大范围。\n\n开始前还应确定失败时怎样处理：跳过并记录、暂停等待确认，还是允许有限次数的重试。对无法撤回的操作，不应使用“出错后再修复”的思路，而应把人工确认放在发生外部影响之前。\n\n预检结果最好形成一份简短清单，并与本次任务一起保存。这样既能让操作者在扩大处理范围前作出明确决定，也便于任务失败后判断问题出在输入、权限、页面状态还是执行规则。"}}}, {"id": "c112190ba3e95a55b48c6fd493", "title": "8.5.2　任务异常时先止损，再决定回滚或重试", "notes": {"plain": {"content": "发现对象选错、页面状态异常、结果数量明显不符，或任务开始重复同一操作时，应先暂停执行，避免错误继续扩散。此时不要立即从头重跑，而应确认已经发生了哪些外部影响：哪些文件被新建或修改，哪些表单已经提交，哪些消息可能已经发送，以及哪些操作仍停留在预览状态。\n\n回滚方式取决于任务类型。文件处理优先使用原始备份或另存版本恢复；数据写入依据变更记录撤销已确认的修改；网页提交、消息发送等难以撤回的操作，则应立即通知责任人并保留现场信息。无法确认影响范围时，不继续自动重试，也不通过删除日志掩盖问题。\n\n只有在原因已经定位、输入与权限重新确认，并且重试不会造成重复提交时，才从最近的有效检查点恢复。每次异常都应记录现象、影响对象、处理方式和最终状态，使下一次任务能够改进规则，而不是重复同一故障。"}}}, {"id": "83a5c6fee7885840a5d1852d63", "title": "8.5.3　交付时核对结果、影响范围和未完成事项", "notes": {"plain": {"content": "任务结束后，至少检查四项内容：输入对象是否正确，输出数量与位置是否符合预期，原始文件或系统状态是否被意外改变，异常和未完成事项是否完整记录。涉及表单或消息时，还要区分“已填写”“待提交”和“已提交”，不能用一个“完成”状态概括。\n\n处理日志应记录操作对象、时间、结果和异常，不必保存无关的敏感内容。对重要任务，保留变更前后的文件清单或字段对照，便于复查和恢复。确认成果可用后，再关闭任务并撤回不再需要的授权。\n\n由此形成的完整链路是：限定范围，确认权限，小样本试跑，按检查点执行，异常时先中断并确认影响，必要时回滚或从有效检查点恢复，最后验收并保留记录。它比单纯追求“全自动”更稳定，也更适合进入真实组织流程。"}}}, {"id": "a8ffe780e6e85adbaea114130a", "title": "8.5.4　完整案例：从网页下载到本地台账的受控流程", "notes": {"plain": {"content": "假设财务助理每月需要登录供应商平台，下载已授权访问的对账单，将文件按供应商和月份重命名，再从PDF中提取编号、日期和金额，形成待复核台账。这个任务跨越网页、下载目录、文件系统、PDF读取和表格软件，适合用来观察一条可靠流程怎样建立。\n\n任务开始前，负责人创建专用工作目录，分为“原始下载、处理副本、异常、交付”四层，并准备供应商清单和命名规则。权限单只允许访问指定平台和这四个目录，不允许发送文件、删除平台记录或修改原始下载。登录和多重验证由本人完成，Agent继续前先复述当前账号和账期。\n\n第一轮只处理两个供应商。Agent在平台上按账期筛选，记录页面显示的文件数，下载后核对文件名、大小和下载状态；页面没有成功回执的文件先查询记录，不立即重复点击。原始文件进入只读目录，同时生成包含平台编号、下载时间和本地路径的清单。\n\n第二步在处理副本中执行重命名。Agent先生成旧名与新名映射，检查重名、缺失编号和非法字符，得到确认后再批量改名。任何无法识别供应商或月份的文件移入异常目录，不用“未知”名称继续进入台账。重命名完成后核对文件总数，原始下载仍保持不变。"}}}]}, "notes": {"plain": {"content": "跨软件任务真正的质量标准，不是它连续完成了多少次点击，而是结果是否正确、过程是否可追溯、错误是否能够恢复。任务开始前做预检，执行中设置检查点，结束后核对日志，能够把一次“自动操作”变成可管理的工作流程。"}}}]}, "notes": {"plain": {"content": "此前几章主要讨论读取文件、生成文档、分析数据和检索资料。当Agent开始点击网页、填写字段、整理文件并在不同软件之间传递数据时，它的角色便从内容生产延伸到流程执行，错误也更可能直接进入真实系统。\n\n本章不按“能做什么”的功能清单展开，而是回答“怎样安全完成一条跨软件流程”：先限定权限和数据范围，再设计浏览器与文件操作，选择执行环境，最后通过试跑、确认、回滚和日志完成验收。可靠的自动化不是让人放弃控制，而是让每次授权都能被理解、限定和收回。"}}}, {"id": "ch9", "title": "第9章　定时任务与流程自动化：让重复工作按规则运行", "children": {"attached": [{"id": "5e40a37f5f585dbcb5b6afddea", "title": "9.1　定时任务的组成与运行逻辑", "children": {"attached": [{"id": "fd8a675e5821517d9ecdde71a4", "title": "9.1.1　把定时任务写成一套完整运行规则", "notes": {"plain": {"content": "定时任务是按预设时间或周期自动触发的任务流程。使用者需要事先说明触发规则（如每天8点、每周一或每月1日）和执行内容；到达指定时间后，系统按规则运行，并把结果保存到约定位置。是否进一步发送至外部渠道，应根据任务风险和既有授权单独设置。\n\n定时任务降低的核心成本，是反复“记得做”和“准时做”。人处理重复任务时，除了执行本身，还要持续记住任务内容和触发时间。图9-2展示了在操作界面中配置和查看定时任务的基本形态。界面名称、入口和可用选项可能随客户端版本变化，图中重点是任务时间、状态与管理入口之间的关系。\n\n设置一个定时任务，需要说明四项信息。表9-1列出每项信息的含义，并给出相互对应的示例。\n\n四个要素共同决定任务是否能够按预期运行。其中，“结果去向”尤其容易被忽略：如果未说明保存位置、接收对象和通知方式，即使任务完成，成果也可能无法及时进入后续流程。对于长期运行的任务，还应补充失败通知、维护人和停用条件。"}}}, {"id": "2f52d257c1625f18a2f8f638c2", "title": "9.1.2　把时间规则写到能够处理例外", "notes": {"plain": {"content": "“每周五生成周报”看似清楚，实际仍有多个未定义问题：按哪个时区，周五几点，统计区间到什么时刻，遇到节假日是提前、顺延还是跳过，数据在触发时尚未到齐怎么办。定时任务如果没有这些规则，只会稳定地重复同一种歧义。\n\n首先要区分触发时间与数据截止时间。周报可以在周五17:00触发，但统计截止时间可能是当日16:30，以便给上游系统留出同步时间；月报在每月1日运行，却可能只使用上月关账完成后的数据。若两者相同，任务容易在数据仍更新时生成互相不一致的版本。\n\n跨地区团队还要明确时区。写“每天上午9点”不足以决定由哪个地区的上午9点触发，也无法处理夏令时变化。任务名称、日志和通知中应统一记录时区，面向多个地区的结果则分别说明数据时点。只要时间直接影响交易、合规或客户承诺，就不能依赖执行环境的默认设置。\n\n节假日规则不能由系统凭常识推算。它需要一个已经批准并保持更新的工作日历，还要说明提前还是顺延。工资、账单和监管报送等任务可能有完全不同的规则，不能统一设为“下一个工作日”。若日历不可用或年度尚未更新，任务应暂停并通知维护人。"}}}]}, "notes": {"plain": {"content": "定时任务不是单独的提醒，而是由触发条件、执行动作、数据来源和结果去向组成的运行闭环。图9-1先展示这个闭环的基本结构。"}}}, {"id": "4718400f5c4559f495f8b6e94b", "title": "9.2　周期报告：自动形成初稿，人工确认责任", "children": {"attached": [{"id": "0a4c0f64b7c35b3e879c54f2d8", "title": "9.2.1　周报自动化：周五下班前自动生成", "notes": {"plain": {"content": "自动汇总需要稳定的材料来源。日常工作中，应把会议纪要、已完成文档和必要的沟通记录持续归档到指定文件夹，并确认这些材料允许进入周报流程。\n\n请设置每周五16:30执行的定时任务：\n\n读取本周工作目录「周报素材」下的所有新增文件\n\n结合本周对话记录，提取关键成果\n\n按模板生成周报：本周完成事项（分类）/ 关键成果与数据 / 遇到的问题 / 下周计划\n\n保存为「周报-YYYY-MM-DD-待确认.docx」；生成摘要草稿，但不要直接推送\n\n如果有素材缺失，在周报里标注“待补充”，不要编造\n\n持续归档的价值，不只是让AI生成周报，更在于形成可追溯的工作记录。材料越完整、分类越清楚，周报越接近实际工作；如果输入零散或缺少关键事实，自动生成也只能得到结构完整但内容空泛的初稿。"}}}, {"id": "7f0d83c1b34a5f888380b68902", "title": "9.2.2　月报自动化：自动汇总四周周报", "notes": {"plain": {"content": "月报是周报的“再加工”：把四周周报汇总、提炼、去掉重复、突出重点。\n\n请设置每月1日上午10:00执行的定时任务：\n\n读取上月全部名称符合「周报-*.docx」的文件\n\n汇总提炼：月度成果总览（按项目归类）/ 核心数据对比 / 跨周问题汇总 / 下月重点\n\n与前月对比，标出显著变化\n\n生成「月报-YYYY-MM-待确认.docx」并保存到指定目录；完成审核后再按既定流程发布\n\n周报和月报进入自动化之后，仍要守住三个边界。只有当接收对象、内容范围和审核责任已经形成稳定规则，并经过实际试跑，才适合考虑自动推送；否则，默认交付物应是待确认初稿。\n\n素材需要持续积累：自动化负责收集和整理，不能替代日常记录；缺少依据的事项应保留为空或标注“待补充”\n\n主观内容由负责人确认：周报中的“下周计划”和“个人反思”涉及承诺与判断，应由本人补充或核定\n\n敏感信息按范围处理：面向群组推送时，应在数据源或指令中排除无权共享的内容，并在发送前检查接收对象"}}}, {"id": "e4fb07a05e185729914bfa9504", "title": "9.2.3　处理迟到数据、补跑和版本替换", "notes": {"plain": {"content": "周期报告上线后，数据不会总能在计划时间完整到达。有人晚交周报、门店延迟关账、外部接口短时不可用，都可能让第一次生成的报告不完整。可靠流程不能只决定“失败要通知”，还要定义迟到数据如何进入下一版。\n\n可以先给每次运行分配唯一批次，例如“2026-W36-首次运行”。首次运行发现缺失时，报告标题和文件名明确标记“待补”，并列出缺失来源；在等待窗口结束后，如允许补跑，则创建新批次并重新计算所有受影响指标。不要只把迟到内容手工粘进正文，因为摘要、图表和结论也可能需要同步变化。\n\n补跑之前应检查第一次结果是否已经发送。如果尚未发送，可以用新版本替换待确认稿；如果已经进入群组或邮件，就要保留旧版，发送更正说明并标明变化范围。自动化任务不能悄悄覆盖已经被他人据此采取行动的文件。\n\n月报依赖周报时，还要防止一份周报在重命名或复制后被重复计入。可使用统计周期、项目标识和版本状态作为筛选条件，而不只依赖文件名通配符。被撤回、作废或尚未确认的周报是否进入月报，也应有明确规则。"}}}]}, "notes": {"plain": {"content": "周报和月报包含大量重复汇总工作。定时任务可以自动收集和整理已有材料，但主观计划、原因判断和对外表述仍需负责人确认，因此更适合被视为“自动形成初稿”，而不是完全无人化。\n\n周报自动化可以拆成“数据汇总—分析整理—文档生成—结果发送”四个环节。每个环节都应留下可检查的中间结果；真正需要衡量的是总投入和返工，而不是给整个流程预设一个完成分钟数。表9-2说明各环节可以自动处理的部分、人工检查点和中间结果。"}}}, {"id": "8f5842182c4e5f7bb134234141", "title": "9.3　竞品监控与信息同步：控制来源与噪声", "notes": {"plain": {"content": "竞品、行业、政策和招标信息都可以通过定时任务持续收集。它们属于同一类监测流程，没有必要分别拆成只有一两句话的小节。设计重点是限定来源、识别新增内容、设置重要性规则，并决定在“没有变化”时是否发送通知。\n\n示例指令\n\n请设置每周一上午执行的市场监测任务。只检查我提供的竞品官网、更新日志和三家行业媒体，收集上周新增内容；按“重大产品更新、价格变化、组织或融资信息、一般报道”分类，每条保留标题、来源、发布时间和原始链接。无法交叉核实的内容标注“待核实”。没有重要变化时不发送完整报告，只记录任务已完成。\n\n信息监测最容易产生的不是遗漏，而是噪声。来源范围过大、过滤规则模糊或把转载当成多个独立证据，都会让日报失去价值。重大通知可以单独设置高优先级，但“重大”的判断条件应事先写清，并保留人工复核。\n\n涉及政策法规时，应优先使用政府或监管机构的正式发布；涉及竞品信息时，应区分企业公告、媒体报道和市场传闻。定时收集可以提高及时性，不能替代来源判断。"}}}, {"id": "4ad4245cb85d5e5692a00c2d84", "title": "9.4　自动化任务的监控、告警与人工介入", "notes": {"plain": {"content": "定时任务在无人持续注视的情况下运行，因此不能只配置触发时间，还要定义系统怎样报告状态、哪些异常需要通知，以及由谁决定是否继续。可靠的自动化至少要区分四种结果：正常完成、没有符合条件的数据、部分完成和执行失败。把它们都写成“任务已结束”，会让真正的问题被安静地掩盖。\n\n不同状态需要对应不同处理动作。表9-4把状态、判断依据和默认响应放在一起，便于在创建任务时直接写入运行规则。\n\n还要区分业务告警和系统告警。业务告警表示数据本身触发了预设条件，例如库存低于阈值；系统告警表示任务无法可靠运行，例如权限失效或字段结构变化。两类告警的接收人、严重程度和处理时限可能不同，不宜混用同一个笼统通知。\n\n监控信息应帮助维护者采取行动，而不是制造更多噪声。一次有效告警至少说明任务名称、触发时间、失败步骤、已影响的对象、是否发生过重试，以及建议的下一步。可自动恢复的短暂网络错误可以有限重试；权限失效、数据结构变化、连续空结果或可能重复发送的情况，则应暂停并等待人工确认。"}}}, {"id": "9d25c2e81bac52dbaa8eaee64f", "title": "9.5　自动化设计：判断什么值得长期运行", "children": {"attached": [{"id": "8065a9316f3f5e8da67bb7e464", "title": "9.5.1　自动化有上线、维护和退役的完整生命周期", "notes": {"plain": {"content": "长期任务不应在创建后永久运行。业务目标会变化，数据源会迁移，接收人会离职，产品页面和权限也会更新。自动化如果没有负责人和复审时间，最初有用的流程可能逐渐变成无人阅读、仍持续访问数据的遗留任务。\n\n上线前先完成手动基线和小范围试点。记录人工完成一次需要的时间、错误类型和交付质量，用于判断自动化是否真正改善流程；同时验证输入、异常和通知规则。试点阶段可以保持所有外发动作人工确认，连续多个周期稳定后，再根据风险决定是否减少确认频率。\n\n运行期间要定期复审四类变化：业务是否仍需要该成果，数据源和字段是否改变，权限和接收人是否仍然合适，错误率和人工返工是否超过预期。复审周期不必相同：高频、关键或外部依赖较多的任务检查更频繁，低风险归档任务可以按季度检查。\n\n衡量自动化不能只统计“成功运行次数”。更有意义的指标包括输入完整率、首次成功率、人工干预次数、重复或漏报数量、结果被实际使用的比例，以及发现错误到恢复的时间。若报告按时生成却无人阅读，它并没有创造价值；若节省执行时间却显著增加复核和修复，也需要重新设计。"}}}, {"id": "ece7145103af580f82144d53d8", "title": "9.5.2　完整案例：让竞品周报从试跑走向稳定运行", "notes": {"plain": {"content": "假设产品团队希望每周一收到三家竞品的更新摘要。第一版任务容易写成“每周搜索竞品新闻并发到群里”，但它没有限定来源、统计周期、重要性、重复信息和失败处理。上线之前，维护者先把目标收窄为：发现官网更新、价格变化和正式公告，为周一产品例会提供线索，不负责自动形成竞争结论。\n\n团队为每家竞品建立来源白名单，包括产品官网、更新日志和正式公告页；媒体报道只进入待核查区。首次手动运行记录过去一周的新增页面、规范化链接、发布时间和摘要，人工确认哪些变化值得进入例会。这个结果成为后续监测的基线。\n\n定时规则设为每周一8:30触发，统计上周一0:00至周日24:00，以北京时间为准。任务先检查全部来源是否可访问，再与上次快照比较；同一公告的转载和标题微调不计为新事件。价格页发生变化时保存前后差异，但在无法确认地区、套餐和生效时间时只发系统告警，不写成价格已经调整。\n\n正常完成且有重要变化时，系统生成“待确认周报”和来源清单，由产品经理在例会前复核；没有变化时只更新运行记录，不发送空报告。某一来源失败则标记部分完成，不把“未抓到信息”写成“竞品没有更新”。连续两次失败后暂停该来源并通知维护人。"}}}]}, "notes": {"plain": {"content": "适合自动化的任务通常高频、规则清楚、风险较低，且数据源能够稳定访问。需要重大判断、后果难以撤回、依赖复杂人际沟通或每次情况都不同的任务，则不宜直接无人值守。判断时应同时考虑运行条件与长期治理要求，不能只看执行频率。\n\n为了把这些原则用于上线判断，表9-5进一步区分适合自动化与不适合直接无人值守的任务特征。\n\n流程上线前，应先手动跑通并记录基线；上线时设置失败通知、结果抽检和明确的暂停或停用机制；运行后定期检查数据源、规则和业务需求是否变化。自动化不等于无人负责，每条长期任务都需要明确维护人。\n\n是否自动化的最终标准，不是“AI能不能做”，而是它能否在可控成本和风险下稳定地产生有用结果。省下的时间应回到判断、沟通和改进流程上，而不是用更多低价值自动报告填满信息渠道。"}}}]}, "notes": {"plain": {"content": "多数AI任务由一次明确的指令触发，但许多办公活动具有稳定的周期和重复的流程。周报整理、市场动态监测和日报推送等工作，如果触发条件与执行规则足够清晰，便可以由定时机制持续运行。此时，人的角色也从逐次操作转向规则设计、结果检查和异常处理。\n\n自动化的价值不取决于任务数量，而取决于流程是否值得长期运行。一个缺乏明确用途的自动报告，即使按时生成，也可能制造新的信息负担。本章从定时任务的设置与运行机制讲起，进一步讨论周期性报告、监测流程和技能复用，并分析哪些工作适合自动化，哪些环节仍应保留人工判断。"}}}, {"id": "ch10", "title": "第10章　创意内容生成：从图像、视频到交互原型", "children": {"attached": [{"id": "8cfbb7a3e8125480bd396bf5b5", "title": "10.1　创意能力底座：图像、视频与交互内容", "notes": {"plain": {"content": "豆包工作的创意能力可能涉及图像生成与编辑、视频生成以及网页制作等模块，实际入口与支持范围会随客户端版本变化。图10-1从需求到验收概括了创意内容的共同流程；对使用者来说，更稳定的判断维度是输入形式、可编辑程度、输出规格和商用限制，而不是记住某个模型名称或版本号。\n\n不同内容形态虽然共用这一流程，但输入描述和验收重点并不相同，表10-1给出了四类典型内容的比较。\n\n无论选择哪种媒介，都应先形成一份简短的创意任务书。任务书至少回答六个问题：作品给谁看、希望对方理解或采取什么行动、必须准确呈现哪些事实、可以使用哪些素材、需要交付什么尺寸或格式，以及由谁承担最终审核。缺少这些信息时，模型只能用通用审美填补空白，往往会得到“看起来完整、实际无法使用”的结果。\n\n办公创意还要提前确定文字和视觉的分工。标题、日期、价格、姓名、产品参数等高准确性信息，宜由人工确认后排版；模型更适合生成氛围、构图和视觉方案。对于同一活动的海报、PPT和短视频，可以先确定共享的事实底稿、主视觉和颜色规则，再分别适配媒介，避免多个成果互相矛盾。"}}}, {"id": "74ca4c534e9f53ee926e49ec86", "title": "10.2　办公配图、宣传海报与漫画：从画面描述到连续叙事", "children": {"attached": [{"id": "493759440eab572682ada19702", "title": "10.2.1　单幅图像与海报", "notes": {"plain": {"content": "一条有效的图像指令应说明主题、风格、构图和用途。用途会影响尺寸、留白和视觉重心：文章配图需要为标题或正文留出空间，社交媒体海报则要优先保证核心信息在小屏幕上仍能被看见。\n\n示例指令\n\n请生成一张用于公众号头图的横版插画，主题为“AI协助团队整理会议资料”。画面包含三位正在讨论的职场人物和一个以界面形式呈现的AI助手，风格简洁克制，主色为深蓝与暖灰；右侧保留约三分之一空白用于标题，不在图片中生成任何文字。\n\n海报包含文字时，应把标题、副标题、时间地点和行动按钮分层提供。图10-2展示了输入信息在任务界面中的组织方式。生成后重点检查中文文字、数字和品牌名称；重要文案最好由人工排版，避免把模型生成的文字直接作为最终版本。\n\n按照上述输入形成的页面效果见图10-3。对照两张图时，应重点观察信息层级、画面留白和文字是否准确，而不只是判断整体风格是否美观。\n\n把图像、海报和漫画放在一起比较，可以更清楚地看到三类任务的输入重点。图10-4显示：单幅图像主要控制画面，海报还要管理信息层级，漫画则必须进一步维持角色与叙事连续性。"}}}, {"id": "1490212ca7f95540b1feb53ab7", "title": "10.2.2　漫画叙事与局部迭代", "notes": {"plain": {"content": "漫画指令需要明确分格数量、每格事件、角色特征和阅读顺序。如果角色在不同画面中必须保持一致，应固定服装、发型、色彩和关键道具，并先确认文字脚本，再生成画面。\n\n修改时一次聚焦一个问题：先改事实和结构，再改主体细节，最后处理色彩与装饰。局部编辑可以减少无关区域变化，但仍要复查人物、文字和整体风格是否受到影响。迭代轮数没有固定标准，以达到明确的验收要求为准。\n\n如果漫画承担知识解释或品牌传播任务，还应检查相邻画面之间的因果关系：上一格提出的问题是否在下一格得到回应，人物身份和视角是否突然变化，读者能否按预定顺序理解信息。单格画面美观，并不等于整组叙事成立。"}}}, {"id": "2f557e8349d4588a881ac3ea47", "title": "10.2.3　用参考表和变更记录保持系列一致", "notes": {"plain": {"content": "多张配图或多格漫画通常不是一次生成就能保持一致。角色面部、服装、场景、色彩和物体位置可能在不同画面中变化；局部修改也可能意外改变原来正确的部分。解决问题不能只靠在每条指令末尾重复“保持一致”，而要建立一份可核对的视觉参考。\n\n角色参考可以记录年龄范围、发型、服装颜色、标志性配件、体态和不能改变的特征；场景参考记录空间布局、光线、时间、主要物件与视角；品牌参考记录色值、字体、标识安全区和插画风格。参考内容应来自已经批准的样图或规范，不让模型在后续画面中重新猜测。\n\n连续叙事还要维护事件状态。第一格人物手里拿着蓝色文件夹，第二格如果放到桌面上，第三格就不能无缘无故又出现在另一人手中；上一镜头是白天室内，下一镜头切到夜景，需要有叙事理由。把每格的“进入状态、发生动作、离开状态”写进脚本，可以减少画面之间的跳变。\n\n修改时采用单变量原则。若某张图同时存在人物表情、背景杂乱和文案错误，先修正文案与事实，再处理主体，最后调整环境。每轮记录修改对象、预期变化和必须保持不变的部分。新版本生成后，不仅检查目标问题，也要与上一版并排查看固定项是否发生漂移。"}}}]}, "notes": {"plain": {"content": ""}}}, {"id": "55fafe808a4b501ba062ed40c2", "title": "10.3　汇报短视频与宣传短片：先确认分镜，再生成成片", "notes": {"plain": {"content": "视频包含时间维度，修改成本通常高于单幅图像。开始生成前，应先确认时长、画幅、受众、镜头顺序、主体动作和声音要求。只有主题而没有分镜，模型会自行补充大量细节，结果也更难控制。\n\n分镜不是文学化描述，而是一张可执行的生产清单。为了让生成、配音、字幕和剪辑使用同一版本，可以按表10-2记录每个镜头的必要信息。\n\n确认分镜时，应先看叙事是否完整，再看每个镜头是否能够用现有素材或生成能力实现。某个画面如果依赖难以稳定生成的复杂动作、精确文字或大量人物互动，应在成片前改成更可控的表达，而不是等到多次生成失败后才调整脚本。\n\n示例指令\n\n请先为一条20秒的产品介绍短视频编写分镜，不生成成片。画幅为9∶16，共5个镜头；每个镜头写明时长、画面、主体动作、字幕和转场。整体风格简洁、可信，不使用夸张特效。我确认分镜后，再根据脚本生成视频。\n\n已有海报或产品图时，可以用图生视频补充轻微镜头运动和主体动作。此类任务应避免让人物、文字或产品结构发生不必要变化。第一版完成后，按镜头逐项反馈，例如调整节奏、动作幅度或结尾信息；不要用“整体更高级”这类难以验证的评价代替具体修改要求。"}}}, {"id": "262a21e5f7b4568fada785717c", "title": "10.4　网页与简易应用：从办公素材到可用原型", "notes": {"plain": {"content": "生成网页前，应先整理企业名称、介绍、联系方式、品牌素材、页面目标和栏目结构，并明确哪些内容可以公开。把资料集中到一个文档能够降低输入成本，但其中的事实、链接和图片授权仍需人工确认。案例使用虚构企业资料时，也应在页面中避免造成真实机构背书的误解。\n\n示例指令\n\n请根据我提供的品牌资料制作企业网站原型。页面包含首页、服务介绍、案例和联系方式；先输出站点结构与每页内容清单，确认后再生成。所有图片只使用我提供的素材或明确可商用的占位图，表单暂不收集真实个人信息。\n\n生成首版后，应分别检查桌面端和移动端的导航、按钮、链接、表单和文字层级，再提出局部修改。视觉调整可以通过框选区域或明确页面模块完成，功能调整则要说明输入、处理和输出逻辑。图10-8呈现的是成品示意，用于对照检查信息架构和页面层级。发布前还需确认托管地址、访问权限、数据收集方式和后续维护责任，不能把“能够生成链接”理解为网站会永久、安全且无需维护地运行。"}}}, {"id": "17a2a9530e9e5313aad0558c9b", "title": "10.5　从多模态交付到合规使用", "children": {"attached": [{"id": "f5396721d7555c458b050da40b", "title": "10.5.1　案例：学习材料的多模态改造", "notes": {"plain": {"content": "假设培训讲师需要把一份“AI办公入门”课件改造成配图课件、宣传海报和短视频预告。多个产物应共享同一套课程定位、视觉风格和事实材料，因此不能分开随意生成。\n\n第一步是整理内容资产：确认课程名称、目标学员、三项核心收益、讲师信息、时间地点和报名方式。第二步建立视觉基准，先生成一张代表课程主题的主视觉，再从中确定颜色、人物和图形风格。第三步分别制作课件配图与海报，文字由人工排版和校对。最后根据已确认的主视觉和课程信息编写短视频分镜。\n\n视频分镜指令\n\n请先为30秒课程预告编写分镜。第1段呈现课程问题，第2段展示三项学习收益，第3段给出时间和报名方式；每段写明时长、画面、字幕和转场。沿用已确认的深蓝与暖灰视觉风格，不生成虚构学员评价。我确认后再制作成片。\n\n验收时要检查三个产物中的课程名称、日期、价格和报名方式是否一致，视觉是否属于同一系列，二维码与链接是否真实可用。AI可以减少重复制作，但实际节省的时间和成本取决于素材准备、生成次数和修改要求，应通过项目记录评估。"}}}, {"id": "05f8d1e0667e59a5882015a828", "title": "10.5.2　版权合规与商用注意事项", "notes": {"plain": {"content": "生成能力扩展了内容制作的边界，也增加了版权、肖像和信息真实性方面的风险。特别是在商业使用前，应逐项检查权利来源、授权范围和传播内容。\n\n首先，应阅读所用平台的当前条款，确认输入素材、生成结果和输出文件分别受到什么限制。平台允许生成或下载，不等于使用者已经取得所有商业使用权；对重要商业素材的权利状态无法判断时，应寻求专业法律意见。\n\n其次，不应要求系统仿制受保护作品、特定创作者的鲜明风格，或生成与知名商标、品牌形象和角色高度相似的素材。引用第三方图片、字体、音乐和视频片段时，也要核对来源与许可范围，不能把“素材可访问”误认为“素材可商用”。\n\n再次，涉及真实人物或可识别形象时，应确认肖像、隐私和使用授权；涉及产品宣传时，不得虚构用户评价、检测结果或权威认证。生成内容中的事实、数字和文字同样需要人工核验。\n\n最后，建议为商用素材保留所用平台、生成时间、指令、输入素材来源、人工修改和授权证明等记录。记录不能消除侵权风险，却能帮助团队复查内容来源和审批过程。"}}}, {"id": "cf2283f018ff5b00adf8b31256", "title": "10.5.3　交付包要说明作品、素材和使用边界", "notes": {"plain": {"content": "多模态项目结束时，如果只交付一张PNG或一个视频文件，后续团队很难修改文字、适配尺寸或回答素材来源。完整交付包应同时服务于使用、维护和追溯，因此至少区分成品、可编辑源文件、素材、权利证明和版本说明。\n\n成品目录按渠道放置已经批准的最终文件，文件名包含项目、用途
