</style></head><body><header><h1>豆包工作 · Word整本思维导图</h1><p>一张完整导图：5篇 → 15章 → 70个大节 → 169个小节，另含前言、结语和附录，共292个节点。</p></header><div class="toolbar"><button id="chapters">看到章</button><button id="sections">看到大节</button><button id="all">全部展开</button><label>缩放 <input id="zoom" type="range" min="40" max="140" value="85" step="5"></label><input id="search" placeholder="查找标题，例如：会议纪要" aria-label="查找标题"><button id="find">查找</button><button id="next">下一个</button></div><div id="status">点击加减号展开或折叠；点击标题查看对应Word原文摘录。</div><div id="viewport"><div id="space"><div id="canvas"></div></div></div><aside id="info" hidden><button id="close">关闭详情</button><h2 id="detail-title"></h2><p style="color:#688071">Word对应标题下的原文摘录</p><div id="excerpt"></div></aside><footer>来源：豆包工作_AI智能办公实战手册_图表与文字校订版.docx。保留Word正文标题；目录页未重复计入。</footer><script id="data" type="application/json">{"id": "book", "title": "豆包工作14天玩转AI办公", "children": {"attached": [{"id": "c372b693634e5c4595fb47d847", "title": "前言　当AI从“能聊天”走向“能干活”", "children": {"attached": [{"id": "f10ac8df3bf6566a832504a37a", "title": "一、这本书为谁而写", "notes": {"plain": {"content": "本书面向需要处理文档、表格、演示文稿、会议材料和公开信息的职场人士，也适合部门负责人、项目管理者以及企业信息技术（Information Technology，IT）、安全和数字化负责人。读者不需要编程基础，但需要带着真实任务练习。\n\n这不是逐项介绍按钮的产品说明书，也不是可以原样复制的“万能提示词”合集。如果期待把判断、授权和责任全部交给AI，本书并不适合；如果希望把模糊需求变成可执行、可检查、可复用的工作流程，可以从书中找到方法和案例。"}}}, {"id": "9daba6b6453b55a2b9baa34733", "title": "二、本书的主线与特色", "notes": {"plain": {"content": "全书分为五篇、15章：第一篇建立产品认知并完成受控试跑；第二篇处理文档、演示文稿、数据和调研等核心交付；第三篇进入跨软件操作、定时任务和多模态创作；第四篇讨论企业上下文、生态扩展与安全治理；第五篇把方法放回岗位流程，并用基线、质量与风险评估真实价值。\n\n本书的特点不是罗列功能，而是始终追问四件事：输入材料是否可信，系统可以操作到哪里，哪个节点必须由人决定，最终成果怎样验收。书中的案例、指令模板、检查表和流程图都围绕这四个问题展开，既帮助个人完成任务，也为团队试点留下治理接口。"}}}, {"id": "7dd9c9b0f4e352d3990b7b14e1", "title": "三、怎样阅读和练习", "notes": {"plain": {"content": "初次接触办公Agent的读者，可以按顺序阅读第1—3章，并完成第2章的会议纪要练习；已有经验的读者可以从当前任务直接进入：文档、演示文稿、数据和调研见第4—7章，跨软件与自动化见第8—9章，团队接入与安全治理见第11—13章，岗位复盘见第14—15章。\n\n附录C.2提供14天可选实践路线，但它不是速成承诺，也不要求连续完成。无论从哪一章开始，都建议先用低风险材料试跑：保留原件，限定目录和权限，在发送、发布、覆盖等动作前人工确认，并按预先约定的标准验收。"}}}, {"id": "50d6b27d03b95d2babdfce78bf", "title": "四、配套资源与勘误", "notes": {"plain": {"content": "附录A提供20条常用指令模板，附录B集中回答20个常见问题，附录C整理书内配套内容、实践路线和核心术语速查。模板只提供任务骨架，使用时仍要补充真实材料、目标受众、权限范围、截止时间和验收标准。\n\n产品界面和规则会持续变化。发现入口失效、版本差异或文字错误时，请通过出版社在成书中最终公布的勘误渠道反馈，并同时提供所在章节、客户端版本、复现步骤和已经脱敏的截图。"}}}, {"id": "7bdb506b177f51ce87b069d056", "title": "五、版本、术语与责任", "notes": {"plain": {"content": "本书以2026年9月3日作为产品事实和操作描述的核查基线。模型名称、按钮位置、套餐、连接器和权限提示仍可能变化，实际使用时应以客户端、官方网站及适用协议的最新说明为准。\n\n本书统一使用“办公Agent”指面向办公任务、能够围绕目标规划步骤并调用工具的智能体系统；“技能”用于复用方法，“连接器”用于接入外部系统，“工作伙伴”强调角色化分工，“工作小队”强调多个智能体协作。“指令”指一次任务说明，“指令模板”指可以重复改写使用的示例。其他英文缩写均在首次出现时说明全称和中文含义。\n\n书中案例用于教学，示例企业、人物和数据不代表真实对象；涉及产品界面、第三方标识、人物肖像、效果数字和认证材料时，应核对来源、授权与适用范围。AI可以参与整理、生成、分析和部分操作，但输入范围、授权决定、结论采纳和对外交付始终由使用者及其所在组织负责。"}}}, {"id": "4e405b39a46a50fb950d320ec1", "title": "六、关于AI辅助与致谢", "notes": {"plain": {"content": "本书在资料整理、语言校对和格式核查环节使用了生成式AI辅助。章节结构、案例取舍、事实核验和最终表述均由作者审阅确认，内容责任不因使用工具而转移。\n\n感谢参与案例验证、内容审阅和出版沟通的编辑与读者。你们对“能否真正完成工作”的持续追问，使这本书没有停留在功能展示，而是回到可靠、可控和可交付的工作方法。\n\n王树江、萧尘、袁从德\n\n2026年9月湖北"}}}]}, "notes": {"plain": {"content": "上午收到会议录音、历史方案和一张数据表，下午就要交出纪要、行动清单和汇报材料。对话式人工智能（Artificial Intelligence，AI）可以生成文字、提炼要点并解释数据，但把零散结果变成能够提交和继续推进的成果，仍需要人寻找材料、核对事实、衔接步骤并承担责任。\n\n智能体（Agent）面向办公任务时，试图缩短的正是“生成内容”与“完成工作”之间的距离。它可以围绕目标规划步骤，在获得授权后使用文件、浏览器、办公软件和协作平台，也会因目标含糊、材料过期、权限过宽或验收缺失而偏离任务。本书将这类系统统一称为“办公Agent”，并不追逐“一句话完成所有工作”的口号，而是提供一条更可靠的主线：目标—上下文—执行—验收—治理。"}}}, {"id": "f916102d22ca5ab3bf72c26b4f", "title": "第一篇　认识与上手篇", "children": {"attached": [{"id": "ch1", "title": "第1章　认识豆包工作：产品定位与能力边界", "children": {"attached": [{"id": "proof-1-0", "title": "1.1 AI办公的演进：从聊天机器人到智能体", "children": {"attached": [{"id": "proof-1-0-0", "title": "1.1.1 AI办公的演进过程"}, {"id": "proof-1-0-1", "title": "1.1.2 智能体的工作过程"}, {"id": "proof-1-0-2", "title": "1.1.3 智能体的价值"}]}}, {"id": "proof-1-1", "title": "1.2 豆包工作的定位", "children": {"attached": [{"id": "proof-1-1-0", "title": "1.2.1 豆包工作的形成背景"}, {"id": "proof-1-1-1", "title": "1.2.2 豆包工作的产品定位"}, {"id": "proof-1-1-2", "title": "1.2.3 豆包工作的3个身份"}, {"id": "proof-1-1-3", "title": "1.2.4 豆包工作的产品能力"}]}}, {"id": "proof-1-2", "title": "1.3 豆包工作与豆包", "children": {"attached": [{"id": "proof-1-2-0", "title": "1.3.1 如何选择豆包与豆包工作"}, {"id": "proof-1-2-1", "title": "1.3.2 按任务尺度和复杂度选择工作模式"}, {"id": "proof-1-2-2", "title": "1.3.3 用“明确度× 影响度”决定委托深度"}, {"id": "proof-1-2-3", "title": "1.3.4 通过一项真实工作练习分层委托"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：AI办公的演进：从聊天机器人到智能体；豆包工作的定位；豆包工作与豆包。"}}}, {"id": "ch2", "title": "第2章　快速上手：完成第一个办公任务", "children": {"attached": [{"id": "proof-2-0", "title": "2.1 第一步：选择入口并完成安装", "children": {"attached": [{"id": "proof-2-0-0", "title": "2.1.1 选择适合自己的入口"}, {"id": "proof-2-0-1", "title": "2.1.2 完成安装并确认结果"}, {"id": "proof-2-0-2", "title": "2.1.3 为首次使用保留一份环境记录"}]}}, {"id": "proof-2-1", "title": "2.2 第二步：选择与任务匹配的登录身份", "children": {"attached": []}}, {"id": "proof-2-2", "title": "2.3 第三步：创建第一个办公任务", "children": {"attached": [{"id": "proof-2-2-0", "title": "2.3.1 沿着任务流程认识界面"}, {"id": "proof-2-2-1", "title": "2.3.2 照着界面创建练习任务"}, {"id": "proof-2-2-2", "title": "2.3.3 区分对话模式与办公任务"}]}}, {"id": "proof-2-3", "title": "2.4 第四步：建立独立、可控的工作环境", "children": {"attached": [{"id": "proof-2-3-0", "title": "2.4.1 建立专用目录"}, {"id": "proof-2-3-1", "title": "2.4.2 按任务授予必要权限"}, {"id": "proof-2-3-2", "title": "2.4.3 把材料整理成一个可交接的任务包"}]}}, {"id": "proof-2-4", "title": "2.5 第五步：完成并验收任务", "children": {"attached": [{"id": "proof-2-4-0", "title": "2.5.1 准备材料并下达任务"}, {"id": "proof-2-4-1", "title": "2.5.2 观察执行并处理确认"}, {"id": "proof-2-4-2", "title": "2.5.3 验收结果并处理常见故障"}, {"id": "proof-2-4-3", "title": "2.5.4 整理任务验收卡"}, {"id": "proof-2-4-4", "title": "2.5.5 把第一次成功变成可以重复的流程"}, {"id": "proof-2-4-5", "title": "2.5.6 从练习材料切换到真实工作"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：第一步：选择入口并完成安装；第二步：选择与任务匹配的登录身份；第三步：创建第一个办公任务；第四步：建立独立、可控的工作环境；第五步：完成并验收任务。"}}}, {"id": "ch3", "title": "第3章　核心概念：理解智能体的工作方式", "children": {"attached": [{"id": "proof-3-0", "title": "3.1 智能体怎样完成一项任务", "children": {"attached": [{"id": "proof-3-0-0", "title": "3.1.1 从一句要求到执行的结果"}, {"id": "proof-3-0-1", "title": "3.1.2 遇到问题时，先判断谁有权决定"}, {"id": "proof-3-0-2", "title": "3.1.3 上下文与任务状态决定下一步是否可靠"}]}}, {"id": "proof-3-1", "title": "3.2 任务在哪里运行，又通过什么工具完成", "children": {"attached": [{"id": "proof-3-1-0", "title": "3.2.1 本地与云端：先看材料、软件和数据边界"}, {"id": "proof-3-1-1", "title": "3.2.2 浏览器是工具入口，不是第三个运行位置"}]}}, {"id": "proof-3-2", "title": "3.3 把要求写成可执行、可验收的指令", "children": {"attached": [{"id": "proof-3-2-0", "title": "3.3.1 四要素共同定义一项任务"}, {"id": "proof-3-2-1", "title": "3.3.2 按“初始指令—执行确认—结果验收”逐步推进"}, {"id": "proof-3-2-2", "title": "3.3.3 复杂任务先写“完成定义”，再讨论怎样执行"}]}}, {"id": "proof-3-3", "title": "3.4 在关键节点监督，并在必要时接管", "children": {"attached": [{"id": "proof-3-3-0", "title": "3.4.1 看懂过程信息，及时发现偏差"}, {"id": "proof-3-3-1", "title": "3.4.2 识别必须由人决定的节点"}, {"id": "proof-3-3-2", "title": "3.4.3 任务失败后先定位，再缩小范围重试"}, {"id": "proof-3-3-3", "title": "3.4.4 用故障分层决定是改指令、换材料还是换路径"}]}}, {"id": "proof-3-4", "title": "3.5 管理异步任务，而不是被动等待", "children": {"attached": [{"id": "proof-3-4-0", "title": "3.5.1 用任务结构估计耗时"}, {"id": "proof-3-4-1", "title": "3.5.2 让任务状态和交付结果可追溯"}, {"id": "proof-3-4-2", "title": "3.5.3 用任务交接卡避免“系统完成、工作失联”"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：智能体怎样完成一项任务；任务在哪里运行，又通过什么工具完成；把要求写成可执行、可验收的指令；在关键节点监督，并在必要时接管；管理异步任务，而不是被动等待。"}}}]}, "notes": {"plain": {"content": "第一次把工作交给AI，最容易产生的错觉是：它回复得快、写得顺，就等于任务已经完成。可一旦把结果用于真实工作，问题便会出现——纪要把讨论意见写成正式结论，分析引用了错误版本，文件保存到了不该出现的位置。表面上是输出不准确，根源却常常是任务目标、材料范围、操作权限和验收标准都没有说清楚。\n\n许多入门资料把重点放在“怎样问出一个好答案”，却很少解释AI开始读取文件、调用工具和推进多步任务以后，人应当怎样判断它做得是否可靠。本篇不追求记住更多按钮，也不把办公Agent描绘成可以独立接管工作的“万能同事”，而是帮助读者先建立一套可执行、可观察、可停止的使用框架。\n\n本篇适合第一次接触豆包工作，或者已经使用过对话式AI、却还不敢让它处理真实文件的读者。第1章厘清办公Agent与普通对话工具的差别；第2章用一次受控任务走完安装、身份确认、授权和验收；第3章再解释目标、工具、上下文和反馈机制。若已经熟悉产品入口，可以快速浏览第2章，但身份、权限和任务验收部分不宜跳过。"}}}, {"id": "8d70cdf9690554e7850c7bf53f", "title": "第二篇　核心交付篇", "children": {"attached": [{"id": "ch4", "title": "第4章　文档写作：从材料整理到正式成稿", "children": {"attached": [{"id": "proof-4-0", "title": "4.1 先判断豆包工作应该介入哪些环节", "children": {"attached": []}}, {"id": "proof-4-1", "title": "4.2 从会议记录到可执行的纪要", "children": {"attached": [{"id": "proof-4-1-0", "title": "4.2.1 先确认材料，再设计纪要结构"}, {"id": "proof-4-1-1", "title": "4.2.2 提炼口头讨论，归纳事实、结论和行动"}, {"id": "proof-4-1-2", "title": "4.2.3 区分纪要、摘要和对外信息"}]}}, {"id": "proof-4-2", "title": "4.3 从零散材料到可行方案", "children": {"attached": [{"id": "proof-4-2-0", "title": "4.3.1 先盘点证据和信息缺口"}, {"id": "proof-4-2-1", "title": "4.3.2 先审骨架，再分段生成正文"}, {"id": "proof-4-2-2", "title": "4.3.3 建议与证据应可追溯"}, {"id": "proof-4-2-3", "title": "4.3.4 用证据台账控制事实、判断和引用"}]}}, {"id": "proof-4-3", "title": "4.4 从初稿到定稿：控制修改范围", "children": {"attached": [{"id": "proof-4-3-0", "title": "4.4.1 修改要求要包含对象、动作和约束"}, {"id": "proof-4-3-1", "title": "4.4.2 局部修改也要检查连带影响"}, {"id": "proof-4-3-2", "title": "4.4.3 把修改拆成可核对的变更集"}]}}, {"id": "proof-4-4", "title": "4.5 交付前完成一次系统验收", "children": {"attached": [{"id": "proof-4-4-0", "title": "4.5.1 用5层检查代替笼统校对"}, {"id": "proof-4-4-1", "title": "4.5.2 把成稿连同依据和未决事项一起交付"}, {"id": "proof-4-4-2", "title": "4.5.3 正式文档交付前检查"}, {"id": "proof-4-4-3", "title": "4.5.4 完整案例：把一组项目材料整理成决策简报"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：先判断豆包工作应该介入哪些环节；从会议记录到可执行的纪要；从零散材料到可行方案；从初稿到定稿：控制修改范围；交付前完成一次系统验收。"}}}, {"id": "ch5", "title": "第5章　PPT制作：从汇报目标到现场表达", "children": {"attached": [{"id": "proof-5-0", "title": "5.1 先定义一次汇报，而不是先规定页数", "children": {"attached": [{"id": "proof-5-0-0", "title": "5.1.1 用4个要点确定表达方向"}, {"id": "proof-5-0-1", "title": "5.1.2 把制作要求写成验收条件"}]}}, {"id": "proof-5-1", "title": "5.2 根据材料完整度选择生成路径", "children": {"attached": []}}, {"id": "proof-5-2", "title": "5.3 把大纲变成页面叙事与视觉系统", "children": {"attached": [{"id": "proof-5-2-0", "title": "5.3.1 先搭建叙事骨架"}, {"id": "proof-5-2-1", "title": "5.3.2 让标题表达结论，让视觉承担证据"}, {"id": "proof-5-2-2", "title": "5.3.3 把旧PPT当作规则来源，而不是复制对象"}, {"id": "proof-5-2-3", "title": "5.3.4 控制信息密度和强调层级"}, {"id": "proof-5-2-4", "title": "5.3.5 为每页的关键数据和结论保留证据入口"}]}}, {"id": "proof-5-3", "title": "5.4 从页面初稿到可交付的PPT", "children": {"attached": [{"id": "proof-5-3-0", "title": "5.4.1 局部修改之前先判断影响范围"}, {"id": "proof-5-3-1", "title": "5.4.2 按“事实—叙事—视觉—现场”完成验收"}, {"id": "proof-5-3-2", "title": "5.4.3 把在真实设备上演练纳入制作流程"}]}}, {"id": "proof-5-4", "title": "5.5 综合案例：制作全套活动物料", "children": {"attached": []}}]}, "notes": {"plain": {"content": "本章依次介绍：先定义一次汇报，而不是先规定页数；根据材料完整度选择生成路径；把大纲变成页面叙事与视觉系统；从页面初稿到可交付的PPT；综合案例：制作全套活动物料。"}}}, {"id": "ch6", "title": "第6章　表格与数据分析：从数据整理到分析结论", "children": {"attached": [{"id": "proof-6-0", "title": "6.1 选择并理解数据源", "children": {"attached": []}}, {"id": "proof-6-1", "title": "6.2 数据清洗、合并与批量处理", "children": {"attached": [{"id": "proof-6-1-0", "title": "6.2.1 先定义规则，再处理数据"}, {"id": "proof-6-1-1", "title": "6.2.2 跨表合并后，先验证记录没有被遗漏或重复放大"}]}}, {"id": "proof-6-2", "title": "6.3 数据可视化：让图表服务于问题", "children": {"attached": []}}, {"id": "proof-6-3", "title": "6.4 从分析结果到业务判断", "children": {"attached": [{"id": "proof-6-3-0", "title": "6.4.1 从事实、假设到可验证的经营判断"}, {"id": "proof-6-3-1", "title": "6.4.2 把原因假设转化为下一轮可以收集证据的问题"}]}}, {"id": "proof-6-4", "title": "6.5 把口径写进指令，把核验留到交付前", "children": {"attached": [{"id": "proof-6-4-0", "title": "6.5.1 完整案例：建立可重复生成的经营月报"}, {"id": "proof-6-4-1", "title": "6.5.2 让交付工作簿既能阅读，也能复算"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：选择并理解数据源；数据清洗、合并与批量处理；数据可视化：让图表服务于问题；从分析结果到业务判断；把口径写进指令，把核验留到交付前。"}}}, {"id": "ch7", "title": "第7章　深度调研与专业分析：从检索到研究报告", "children": {"attached": [{"id": "proof-7-0", "title": "7.1 建立深度调研的五步工作流", "children": {"attached": [{"id": "proof-7-0-0", "title": "7.1.1 从“找资料”转向“回答研究问题”"}, {"id": "proof-7-0-1", "title": "7.1.2 一条合格的调研指令应写清五类信息"}, {"id": "proof-7-0-2", "title": "7.1.3 用追问修正证据，而不是只润色文字"}, {"id": "proof-7-0-3", "title": "7.1.4 明确公开检索、内部信息与人工判断的边界"}, {"id": "proof-7-0-4", "title": "7.1.5 先画检索地图，再决定什么时候停止"}]}}, {"id": "proof-7-1", "title": "7.2 用两个案例完成受控试运行", "children": {"attached": [{"id": "proof-7-1-0", "title": "7.2.1 校招岗位表：先验证检索与整理链路"}, {"id": "proof-7-1-1", "title": "7.2.2 考研择校表：表格完整不等于信息可信"}, {"id": "proof-7-1-2", "title": "7.2.3 用错误样本检验结果，而不是只看整齐的前几行"}]}}, {"id": "proof-7-2", "title": "7.3 进阶实战：把考研择校表升级为可信报告", "children": {"attached": [{"id": "proof-7-2-0", "title": "7.3.1 第一步：把目标拆成可核验的调研清单"}, {"id": "proof-7-2-1", "title": "7.3.2 第二步：按信息来源等级进行多渠道检索"}, {"id": "proof-7-2-2", "title": "7.3.3 第三步：筛掉低质材料，建立证据表"}, {"id": "proof-7-2-3", "title": "7.3.4 第四步：用独立来源核对，而不是机械凑够两个信息来源"}, {"id": "proof-7-2-4", "title": "7.3.5 第五步：生成带证据、限制和待办的报告"}, {"id": "proof-7-2-5", "title": "7.3.6 把研究材料写成真正支持决策的报告"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：建立深度调研的五步工作流；用两个案例完成受控试运行；进阶实战：把考研择校表升级为可信报告。"}}}]}, "notes": {"plain": {"content": "明天就要汇报，桌面上却只有几份会议记录、一张数据表、一版旧方案和若干网页。把这些材料交给AI，几分钟后可能就有一份报告或PPT；可当负责人追问“这个数字从哪里来”“为什么得出这个结论”“这一页到底想说明什么”时，看似完整的成果往往经不起核对。\n\n问题不只是“提示词写得不够好”。很多教程演示的是从一句话到一份初稿，却跳过了真实交付中最费力的部分：辨认有效材料，统一数据口径，区分事实与判断，根据受众重组表达，并让每个重要结论都能回到来源。本篇要补上的，正是从“生成内容”到“形成交付物”之间的这段距离。\n\n本篇适合经常撰写纪要、方案和报告，制作汇报PPT，处理业务数据或开展案头调研的读者。第4章讲文档，第5章讲演示文稿，第6章讲表格与数据分析，第7章讲深度调研。可以直接从最常遇到的任务读起；若要完成一项综合汇报，则建议按“文档梳理—数据核验—研究补充—演示表达”的顺序组合使用。"}}}, {"id": "9ac04c2b59ca578b9e941cfd5d", "title": "第三篇　进阶执行与创作篇", "children": {"attached": [{"id": "ch8", "title": "第8章　操作电脑与浏览器：让跨软件任务保持可控", "children": {"attached": [{"id": "proof-8-0", "title": "8.1 任务开始前，先划定权限和数据边界", "children": {"attached": [{"id": "proof-8-0-0", "title": "8.1.1 权限只覆盖完成当前任务所需的范围"}, {"id": "proof-8-0-1", "title": "8.1.2 不要把风险控制完全交给系统提示"}, {"id": "proof-8-0-2", "title": "8.1.3 把授权写成任务级权限单"}]}}, {"id": "proof-8-1", "title": "8.2 浏览器任务：把页面操作拆成可核对步骤", "children": {"attached": [{"id": "proof-8-1-0", "title": "8.2.1 信息收集要保留来源和时间"}, {"id": "proof-8-1-1", "title": "8.2.2 表单任务应把最终提交单独隔离"}, {"id": "proof-8-1-2", "title": "8.2.3 把动态页面和登录会话视为会变化的输入"}]}}, {"id": "proof-8-2", "title": "8.3 本地文件与跨软件任务：先厘清数据流向", "children": {"attached": [{"id": "proof-8-2-0", "title": "8.3.1 文件操作必须保留原件和变更记录"}, {"id": "proof-8-2-1", "title": "8.3.2 跨软件处理要设置中间检查点"}, {"id": "proof-8-2-2", "title": "8.3.3 让重复运行安全：幂等、清单与检查点"}]}}, {"id": "proof-8-3", "title": "8.4 根据资源位置选择执行环境和远程入口", "children": {"attached": [{"id": "proof-8-3-0", "title": "8.4.1 本地、隔离环境与云端各有边界"}, {"id": "proof-8-3-1", "title": "8.4.2 手机更适合管理任务，不适合替代桌面验收"}]}}, {"id": "proof-8-4", "title": "8.5 用试运行、中断、回滚和日志形成安全闭环", "children": {"attached": [{"id": "proof-8-4-0", "title": "8.5.1 高影响任务先做预检和小样本试运行"}, {"id": "proof-8-4-1", "title": "8.5.2 任务异常时先止损，再决定回滚或重试"}, {"id": "proof-8-4-2", "title": "8.5.3 交付时核对结果、影响范围和未完成事项"}, {"id": "proof-8-4-3", "title": "8.5.4 完整案例：从网页下载到本地台账的受控流程"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：任务开始前，先划定权限和数据边界；浏览器任务：把页面操作拆成可核对步骤；本地文件与跨软件任务：先厘清数据流向；根据资源位置选择执行环境和远程入口；用试运行、中断、回滚和日志形成安全闭环。"}}}, {"id": "ch9", "title": "第9章　定时任务与流程自动化：让重复工作按规则运行", "children": {"attached": [{"id": "proof-9-0", "title": "9.1 定时任务的组成与运行逻辑", "children": {"attached": [{"id": "proof-9-0-0", "title": "9.1.1 把定时任务写成一套完整的运行规则"}, {"id": "proof-9-0-1", "title": "9.1.2 写明时间规则"}]}}, {"id": "proof-9-1", "title": "9.2 周期报告：自动形成初稿，人工确认责任", "children": {"attached": [{"id": "proof-9-1-0", "title": "9.2.1 周报自动化：周五下班前自动生成"}, {"id": "proof-9-1-1", "title": "9.2.2 月报自动化：自动汇总四周周报"}, {"id": "proof-9-1-2", "title": "9.2.3 处理迟到数据、补运行和版本替换"}]}}, {"id": "proof-9-2", "title": "9.3 竞品监测与信息同步：控制来源与噪声", "children": {"attached": []}}, {"id": "proof-9-3", "title": "9.4 定时任务的监控、告警与人工介入", "children": {"attached": []}}, {"id": "proof-9-4", "title": "9.5 自动化设计：判断什么值得长期运行", "children": {"attached": [{"id": "proof-9-4-0", "title": "9.5.1 自动化有上线、维护和“退役”的完整生命周期"}, {"id": "proof-9-4-1", "title": "9.5.2 完整案例：让竞品周报从试运行走向稳定运行"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：定时任务的组成与运行逻辑；周期报告：自动形成初稿，人工确认责任；竞品监测与信息同步：控制来源与噪声；定时任务的监控、告警与人工介入；自动化设计：判断什么值得长期运行。"}}}, {"id": "ch10", "title": "第10章　创意内容生成：从图像、视频到交互原型", "children": {"attached": [{"id": "proof-10-0", "title": "10.1 创意能力底座：图像、视频与交互内容", "children": {"attached": []}}, {"id": "proof-10-1", "title": "10.2 图像、宣传海报与漫画：从画面描述到连续叙事", "children": {"attached": [{"id": "proof-10-1-0", "title": "10.2.1 单幅图像与海报"}, {"id": "proof-10-1-1", "title": "10.2.2 漫画叙事与局部迭代"}, {"id": "proof-10-1-2", "title": "10.2.3 用参考表和变更记录保持系列一致"}]}}, {"id": "proof-10-2", "title": "10.3 汇报短视频与宣传短片：先确认分镜，再生成成片", "children": {"attached": []}}, {"id": "proof-10-3", "title": "10.4 网页与简易应用：从办公素材到可用原型", "children": {"attached": []}}, {"id": "proof-10-4", "title": "10.5 从多模态交付到合规使用", "children": {"attached": [{"id": "proof-10-4-0", "title": "10.5.1 案例：学习材料的多模态改造"}, {"id": "proof-10-4-1", "title": "10.5.2 版权合规与商用注意事项"}, {"id": "proof-10-4-2", "title": "10.5.3 交付包要说明作品、素材和使用边界"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：创意能力底座：图像、视频与交互内容；图像、宣传海报与漫画：从画面描述到连续叙事；汇报短视频与宣传短片：先确认分镜，再生成成片；网页与简易应用：从办公素材到可用原型；从多模态交付到合规使用。"}}}]}, "notes": {"plain": {"content": "让AI写一段文字，结果不合适还可以删除重来；让它点击网页、批量处理文件或按时运行任务，错误却可能直接进入真实系统。一次误提交可能覆盖已有记录，一个不完整的结论可能被周期任务反复发送，一项过宽的授权还可能把无关资料带入任务。AI越能“动手”，使用者越不能只看最后的文字是否通顺。\n\n常见的误区，是把更强的执行能力理解为更少的人为介入。真实情况恰好相反：当任务跨越软件、持续运行或产生对外影响时，工作说明必须更具体，检查点必须更清楚，失败后也要知道如何停止、回退和恢复。本篇讨论的不是炫目的自动化演示，而是怎样让执行能力进入可管理的流程。\n\n如果你已经能够用AI完成文档、PPT或数据初稿，希望进一步处理网页、本地文件、跨软件任务、周期流程及多媒体内容，本篇就是下一步。第8章先解决执行环境和文件边界；第9章讨论计划、监控、告警与人工介入；第10章把同样的方法延伸到图片、视频、网页和简易应用。涉及外发、覆盖或账号操作的内容，建议按章节顺序阅读。"}}}, {"id": "ab5a90e5afe750f790fc8d94c4", "title": "第四篇　组织协作与治理篇", "children": {"attached": [{"id": "ch11", "title": "第11章　连接飞书：让企业上下文进入任务", "children": {"attached": [{"id": "proof-11-0", "title": "11.1 为什么企业上下文会影响豆包工作", "children": {"attached": [{"id": "proof-11-0-0", "title": "11.1.1 上下文包含3个层面"}, {"id": "proof-11-0-1", "title": "11.1.2 上下文质量比上下文数量更重要"}]}}, {"id": "proof-11-1", "title": "11.2 在授权边界内接入企业上下文", "children": {"attached": []}}, {"id": "proof-11-2", "title": "11.3 从典型任务到团队知识", "children": {"attached": [{"id": "proof-11-2-0", "title": "11.3.1 周报、会议和日程3类常见任务"}, {"id": "proof-11-2-1", "title": "11.3.2 把公开内容研究沉淀为团队数据"}, {"id": "proof-11-2-2", "title": "11.3.3 让任务成果成为下一次输入"}, {"id": "proof-11-2-3", "title": "11.3.4 给团队知识设置状态、责任人和失效条件"}]}}, {"id": "proof-11-3", "title": "11.4 团队协作中的权限与治理", "children": {"attached": []}}]}, "notes": {"plain": {"content": "本章依次介绍：为什么企业上下文会影响豆包工作；在授权边界内接入企业上下文；从典型任务到团队知识；团队协作中的权限与治理。"}}}, {"id": "ch12", "title": "第12章　生态扩展：从技能复用到多智能体协作", "children": {"attached": [{"id": "proof-12-0", "title": "12.1 技能：把跑通的业务流程沉淀为可复用能力", "children": {"attached": [{"id": "proof-12-0-0", "title": "12.1.1 从选择预置技能到创建自定义技能"}, {"id": "proof-12-0-1", "title": "12.1.2 配置实例：项目周报校验技能"}, {"id": "proof-12-0-2", "title": "12.1.3 技能发布前要通过正常测试、边界测试和失败测试"}]}}, {"id": "proof-12-1", "title": "12.2 连接器：在授权范围内接入外部系统", "children": {"attached": [{"id": "proof-12-1-0", "title": "12.2.1 连接器的用途与边界"}, {"id": "proof-12-1-1", "title": "12.2.2 MCP与授权管理"}, {"id": "proof-12-1-2", "title": "12.2.3 配置实例：只读接入客户资料"}, {"id": "proof-12-1-3", "title": "12.2.4 把连接器当作会失败、会变化的外部依赖"}]}}, {"id": "proof-12-2", "title": "12.3 工作伙伴与工作小队：从专业分工到协同执行", "children": {"attached": [{"id": "proof-12-2-0", "title": "12.3.1 工作伙伴：角色分工、适用任务与入口选择"}, {"id": "proof-12-2-1", "title": "12.3.2 工作小队：让多个智能体围绕同一交付协作"}, {"id": "proof-12-2-2", "title": "12.3.3 配置实例：新品方案工作小队"}, {"id": "proof-12-2-3", "title": "12.3.4 用共享任务书和冲突规则控制协作成本"}]}}, {"id": "proof-12-3", "title": "12.4 生态选型：从最小可用配置开始", "children": {"attached": []}}]}, "notes": {"plain": {"content": "本章依次介绍：技能：把跑通的业务流程沉淀为可复用能力；连接器：在授权范围内接入外部系统；工作伙伴与工作小队：从专业分工到协同执行；生态选型：从最小可用配置开始。"}}}, {"id": "ch13", "title": "第13章　安全与隐私：从个人授权到组织治理", "children": {"attached": [{"id": "proof-13-0", "title": "13.1 从设备接入到操作审计的安全链", "children": {"attached": []}}, {"id": "proof-13-1", "title": "13.2 显式授权：把权限拆成可理解的决定", "children": {"attached": [{"id": "proof-13-1-0", "title": "13.2.1 基础权限、关键确认与最小授权"}, {"id": "proof-13-1-1", "title": "13.2.2 配置实例：周报自动化的最小权限方案"}, {"id": "proof-13-1-2", "title": "13.2.3 系统权限不等于模型改进设置"}]}}, {"id": "proof-13-2", "title": "13.3 操作留痕、管理员治理与安全声明", "children": {"attached": [{"id": "proof-13-2-0", "title": "13.3.1 用日志形成事后追溯能力"}, {"id": "proof-13-2-1", "title": "13.3.2 如何看待认证、测评与安全声明"}, {"id": "proof-13-2-2", "title": "13.3.3 后台核验实例：从一次任务反查权限与日志"}, {"id": "proof-13-2-3", "title": "13.3.4 数据留存与删除要覆盖所有副本和下游成果"}]}}, {"id": "proof-13-3", "title": "13.4 异常发生后：先止损，再调查和复盘", "children": {"attached": [{"id": "proof-13-3-0", "title": "13.4.1 停止任务并确认影响范围"}, {"id": "proof-13-3-1", "title": "13.4.2 从一次异常修正整条流程"}, {"id": "proof-13-3-2", "title": "13.4.3 通过桌面演练验证停止、通知和恢复路径"}]}}, {"id": "proof-13-4", "title": "13.5 按组织需求选择配置并完成部署检查", "children": {"attached": [{"id": "proof-13-4-0", "title": "13.5.1 完整部署实例：10人项目组试点"}, {"id": "proof-13-4-1", "title": "13.5.2 部署放行清单"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：从设备接入到操作审计的安全链；显式授权：把权限拆成可理解的决定；操作留痕、管理员治理与安全声明；异常发生后：先止损，再调查和复盘；按组织需求选择配置并完成部署检查。"}}}]}, "notes": {"plain": {"content": "一个人使用AI时，最常问的是“结果好不好”；当一个团队开始共同使用，问题很快会变成“它读取的是哪一版资料”“谁允许它访问这个空间”“生成结果写回哪里”“方法失效后由谁维护”。个人试用中可以靠经验补救的细节，进入组织后都可能变成版本冲突、权限风险和责任空白。\n\n市面上大量内容教个人怎样写提示词，却很少说明一项能力怎样被团队重复使用。组织真正需要的，不是每位成员各自保存一套“神奇指令”，而是让资料来源、授权范围、配置版本、交付位置和责任人都能够被说明、复核和调整。本篇要解决的，是AI从个人技巧变成组织能力时必须补上的治理条件。\n\n本篇面向准备在团队中引入AI的业务负责人、项目管理者、知识管理人员，以及参与权限、安全和技术支持的同事。第11章讲企业上下文怎样在授权范围内进入任务；第12章辨析技能、连接器、工作伙伴和工作小队各自解决什么问题；第13章处理授权、审计、异常处置和部署检查。普通成员可先掌握任务边界与授权原则，管理和技术角色则应完整阅读三章。"}}}, {"id": "808e3e2301995fc4a61a21617b", "title": "第五篇　岗位实践与展望篇", "children": {"attached": [{"id": "ch14", "title": "第14章　岗位与业务场景：典型工作的AI协作流程", "children": {"attached": [{"id": "proof-14-0", "title": "14.1 通用交付：让不同成果共享事实与验收规则", "children": {"attached": [{"id": "proof-14-0-0", "title": "14.1.1 办公交付链：从事实底稿到方案与汇报"}, {"id": "proof-14-0-1", "title": "14.1.2 软件交付链：生成、测试、审查与文档缺一不可"}, {"id": "proof-14-0-2", "title": "14.1.3 会议交付链：从会后事实到成套成果"}, {"id": "proof-14-0-3", "title": "14.1.4 把岗位经验整理成一张流程卡"}]}}, {"id": "proof-14-1", "title": "14.2 销售与客户拓展：把对话转化为下一步行动", "children": {"attached": [{"id": "proof-14-1-0", "title": "14.2.1 端到端案例：从沟通记录到客户跟进"}, {"id": "proof-14-1-1", "title": "14.2.2 让每次客户接触都回到同一条事实链"}]}}, {"id": "proof-14-2", "title": "14.3 经营与财务：从数据台账到经营诊断", "children": {"attached": [{"id": "proof-14-2-0", "title": "14.3.1 从经销台账到经营与财务分析"}, {"id": "proof-14-2-1", "title": "14.3.2 让经营分析回到对账、解释和行动三条线"}]}}, {"id": "proof-14-3", "title": "14.4 内容运营：把创作链变成可复盘流程", "children": {"attached": [{"id": "proof-14-3-0", "title": "14.4.1 端到端案例：从选题研究到多模态成稿"}, {"id": "proof-14-3-1", "title": "14.4.2 视觉设计：让AI扩展方案，不替代设计判断"}, {"id": "proof-14-3-2", "title": "14.4.3 把内容复盘设计成可以推翻假设的实验"}]}}, {"id": "proof-14-4", "title": "14.5 人才与教育：效率必须服从公平和专业责任", "children": {"attached": [{"id": "proof-14-4-0", "title": "14.5.1 人才与教育：整理材料，不替代专业判断"}, {"id": "proof-14-4-1", "title": "14.5.2 高影响场景要检查标准、差异和申诉路径"}]}}]}, "notes": {"plain": {"content": "本章依次介绍：通用交付：让不同成果共享事实与验收规则；销售与客户拓展：把对话转化为下一步行动；经营与财务：从数据台账到经营诊断；内容运营：把创作链变成可复盘流程；人才与教育：效率必须服从公平和专业责任。"}}}, {"id": "ch15", "title": "第15章　未来展望：从生成内容到完成工作", "children": {"attached": [{"id": "proof-15-0", "title": "15.1 人机分工：从操作软件到管理任务", "children": {"attached": [{"id": "proof-15-0-0", "title": "15.1.1 执行边界正在重新划分"}, {"id": "proof-15-0-1", "title": "15.1.2 人的价值转向目标、标准与责任"}, {"id": "proof-15-0-2", "title": "15.1.3 从岗位名称回到任务组合"}]}}, {"id": "proof-15-1", "title": "15.2 效率不只来自提速，更来自重构流程", "children": {"attached": [{"id": "proof-15-1-0", "title": "15.2.1 先识别效率来源，再建立可比较的基线"}, {"id": "proof-15-1-1", "title": "15.2.2 用对照、周期和质量阈值形成可信评估"}]}}, {"id": "proof-15-2", "title": "15.3 AI办公成熟度：从个人使用到组织能力", "children": {"attached": [{"id": "proof-15-2-0", "title": "15.3.1 五级成熟度模型"}, {"id": "proof-15-2-1", "title": "15.3.2 成熟度提升依赖一套轻量运行机制"}]}}, {"id": "proof-15-3", "title": "15.4 从生成内容到交付完整工作结果", "children": {"attached": [{"id": "proof-15-3-0", "title": "15.4.1 完成工作意味着更长的责任链"}, {"id": "proof-15-3-1", "title": "15.4.2 自动程度越高，升级与退出规则越要明确"}]}}, {"id": "proof-15-4", "title": "15.5 真正的改变，从一个可验证的流程开始", "children": {"attached": []}}]}, "notes": {"plain": {"content": "本章依次介绍：人机分工：从操作软件到管理任务；效率不只来自提速，更来自重构流程；AI办公成熟度：从个人使用到组织能力；从生成内容到交付完整工作结果；真正的改变，从一个可验证的流程开始。"}}}]}, "notes": {"plain": {"content": "当团队已经会用AI写文档、做分析和生成内容，新的困惑反而会出现：为什么材料产出更多，项目推进却没有明显变快？为什么节省了起草时间，审核和返工却在增加？为什么个人觉得好用的流程，一扩大到团队就频繁出错？这些问题说明，工具层面的成功不会自动变成岗位价值。\n\n许多关于AI未来的讨论，要么只列举“哪些岗位会被替代”，要么只展示某个环节节省了多少时间，却忽略了工作是一条相互依赖的流程。起草更快，不代表审批更快；内容更多，不代表决策更好；自动化范围更大，也不代表责任可以交给系统。本篇不预测遥远的职业结局，而是回到今天可以观察和改造的工作现场。\n\n本篇适合希望把AI能力嵌入具体岗位的专业人员、团队负责人和管理者。第14章覆盖通用办公、销售、运营、财务、内容、设计、开发、人力资源和教育等场景，说明如何拆解输入、判断、执行和交付；第15章讨论人机分工、效率基线、能力成熟度与组织试点。读者可以先选最接近自己的岗位案例，再用第15章的方法评估是否值得扩大。"}}}, {"id": "1c66cbc195695509b56498c840", "title": "结语　把能力留在流程里", "notes": {"plain": {"content": "一本实战书是否有价值，不取决于读者记住了多少功能，而取决于合上书后能否独立完成一项真实任务。产品入口可能调整，模型能力可能升级，今天熟悉的按钮也可能在下一次更新中改变。如果学习只停留在界面和指令，经验很容易随版本一起失效；如果掌握的是目标拆解、材料组织、权限控制、过程核验和成果交付，工具变化反而会成为可以吸收的新条件。\n\n这也是本书始终坚持的一项取舍：把“会生成”与“能交付”分开。生成一段文字、一张图或一份表格，只说明系统完成了局部动作；真正完成工作，还要回答材料是否可信、结论是否成立、格式是否可用、影响是否可控，以及谁愿意为对外结果负责。越过这些问题追求自动化，通常只会把原有流程中的含糊和错误放大。\n\n本书同样有明确边界。它讨论的是通用办公任务中的方法与实践，不代替法律、财务、医疗、人事等领域的专业判断，也不能覆盖每一种组织制度、数据环境和产品版本。书中的案例适合用来理解流程，不能直接证明某个组织一定获得相同效果；指令模板能够缩短起步时间，却不能替代真实材料、业务规则和验收标准。遇到来源不清、权限不明或后果难以恢复的任务，暂停并请求专业复核，比得到一个看似完整的答案更重要。"}}}, {"id": "528c4ed92ff051f086107d8e3a", "title": "附录导读　把附录当作工作台，而不是答案库", "notes": {"plain": {"content": "正文到这里已经结束。后面的三个附录不承担新的知识主线，也不建议从头到尾机械通读；它们更像一组随任务取用的工作材料，帮助读者在实践中快速找到起点、核验条件和排查路径。\n\n准备发起具体任务时，可以先查附录A，从相近的指令模板中提取任务骨架，再补入真实材料、权限范围和验收标准；对产品能力、数据安全、套餐或故障仍有疑问时，查附录B；需要定位书内配套内容、安排练习或回查术语时，再使用附录C。\n\n附录中的模板、快捷操作和回答都不是脱离情境的标准答案。复制一条模板之前，先确认它服务于什么任务；执行一个操作之前，先确认对象和影响范围；引用一项产品说明之前，先确认核验日期和当前版本。凡是涉及发送、发布、覆盖、删除、敏感数据或外部账号的动作，都应回到正文中的原则：限定范围、保留预览、人工确认、记录结果。\n\n如果附录与最新界面不一致，应以官方信息和实际环境为准，并把差异记录下来。能够根据新条件修订模板、更新步骤和重新验收，本身就是把书中方法转化为长期能力的一部分。"}}}, {"id": "008315f83b6f534d8cf1434777", "title": "附录A　常用指令模板20条", "children": {"attached": [{"id": "e610c3048ee1506d8ef6ee7382", "title": "A.1　文档写作类（2条）", "notes": {"plain": {"content": "会议纪要整理与周报生成\n\n适用场景： 例会、周会或项目会结束后，需要形成会议纪要，并据此整理周报、月报或向上汇报材料。\n\n请整理会议记录【粘贴内容或指定文件路径】，先输出结构化会议纪要，包括议题与背景、讨论要点、已确认结论和行动项。行动项请用表格列出任务、负责人、截止时间、优先级和原文依据；缺少负责人或期限时标注“待确认”，不得自行补写。再结合【本周其他工作材料】生成一页以内的周报，结构为本周完成、关键数据、问题与风险、下周计划。数字只使用材料中能够追溯的内容，并标注来源位置。\n\n使用要点： 先把会议事实固定下来，再生成周报，避免两份材料出现不同口径。行动项表格应由参会负责人确认后再进入任务系统。\n\n方案撰写与工作汇报\n\n适用场景： 立项方案、季度汇报、工作报告、正式邮件或对外文稿的起草与润色。\n\n请为【项目名称／汇报主题】起草方案。第一轮只输出大纲：背景与目标、三个备选方案及比较、推荐方案、实施计划、资源需求、风险和待决事项；等待我确认后再写全文。全文要求结论先行，所有数字注明来源，没有依据的内容标记“待补充”，语言正式简洁，控制在【N】字以内。最后提炼一段面向【收件人／汇报对象】的汇报要点，但不要替我发送。"}}}, {"id": "be4cff0f18835977875582900a", "title": "A.2　会议与沟通类（2条）", "notes": {"plain": {"content": "会前准备与会后闭环\n\n适用场景： 主持或深度参与会议，需要会前明确目标、会中控制议程、会后跟踪结果。\n\n请为【会议主题】准备全流程会议材料。会前生成会议目标、议题清单、每项议题的背景与期望结论、参会人分工和时间安排，并附一份会议纪要模板。会后读取【会议记录】，提取已确认结论、分歧、待确认事项和行动项；行动项按任务、负责人、截止时间、优先级和依赖关系输出。最后起草一条给未参会同事的同步消息，只陈述已经确认的事实和需要其反馈的事项，发送前等待我确认。\n\n使用要点： 会议纪要不能把讨论意见写成正式决议。责任人、截止时间和对外同步内容应逐项核对。\n\n访谈提纲与沟通话术\n\n适用场景： 客户访谈、专家访谈、员工沟通、跨部门协商或向上汇报。\n\n请围绕【访谈目标】为【客户／专家／员工／上级】设计沟通方案。先给出破冰问题、5～8个核心问题、每个问题的追问方向和收尾问题；如果材料中存在分歧，再按“确认共同目标—陈述可核验事实—说明影响—提出选项—约定下一步”提供沟通话术。另将关键信息压缩为3分钟向上汇报版本，依次说明结论、关键数据、风险、需要的支持和请示事项。"}}}, {"id": "d07512b41a89530e8d1ed99390", "title": "A.3　PPT制作类（2条）", "notes": {"plain": {"content": "PPT大纲与初稿生成\n\n适用场景： 从零开始制作项目汇报、产品介绍、培训课件或内部分享。\n\n请为【主题】规划一份面向【受众】、用于【场合】的PPT。第一步只给出汇报目标、叙事结构和逐页大纲，篇幅约【N】页，每页标题采用结论式表达，并注明所需数据或素材。待我确认大纲后，再生成逐页内容：每页只表达一个核心观点，正文控制在可演示的密度，并为每页补充2～3句演讲备注和与下一页的衔接语。无法从材料确认的内容标记“待补充”。\n\n使用要点： 页数不是目标，受众需要做出什么判断或行动才是目标。先确认结构，再制作页面。\n\nPPT美化与数据可视化\n\n适用场景： 已有PPT初稿，需要精简文字、统一风格或改造数据页与对比页。\n\n请审阅PPT【文件路径】，先列出需要修改的页面和原因，等待确认后再调整。文字页应压缩为结论标题和必要要点；数据页根据问题选择趋势、对比或构成图表，并在图前写明要回答的问题，在图后写一句有数据依据的结论；产品对比页按统一维度呈现，不补写材料中没有的价格或能力。全篇统一标题层级、字体、配色和页边距，保留原始文件并输出新版本。"}}}, {"id": "cf98bc7ea4275945b5b3d6f358", "title": "A.4　表格与数据处理类（2条）", "notes": {"plain": {"content": "数据清洗与汇总透视\n\n适用场景： 对Excel、WPS表格、CSV或数据库导出数据进行清洗、汇总、透视和核对。\n\n请读取【文件或目录】，先报告工作表、字段、记录数、时间范围和明显异常，不修改原件。根据我确认的规则处理缺失值、重复项、异常值及日期、数字和文本格式，并输出清洗规则记录。随后按【维度】汇总【指标】，保留合计、口径和单位；需要透视时说明行维度、列维度和值字段。若合并多张表，先检查关联键和关系类型，输出匹配、未匹配及可能重复放大的数量，最后生成清洗副本和差异清单。\n\n使用要点： 清洗规则、输入快照和处理日志要一并保存，便于复算。不要在未确认业务含义时擅自填补空值。\n\n数据分析与图表结论\n\n适用场景： 分析经营数据的趋势、差异和异常，并形成可复核的图表与结论。\n\n请基于【数据文件】完成分析。先确认指标定义、时间范围、单位和分母，再分析整体趋势、同比或环比、关键分组差异及异常点。每张图先说明要回答的问题，再选择合适图形，并标注数据来源和截止日期。结论分为数据事实、原因假设和建议三层；原因没有证据时不得写成确定结论。最后输出关键数字复算表、待补证据和不超过3条的下一步建议。"}}}, {"id": "4e2b6e00f8105363977d6138b6", "title": "A.5　调研与分析类（2条）", "notes": {"plain": {"content": "深度调研与专题报告\n\n适用场景： 围绕行业、市场、政策或技术问题开展资料检索并形成研究报告。\n\n请围绕【研究问题】开展调研，时间范围为【范围】，面向【决策对象】。先提出检索计划和来源优先级，再收集官方文件、权威机构报告、论文或一手材料。报告包括现状与规模、主要参与者、关键趋势、驱动因素、争议与不确定性，以及对【公司／岗位】的启示。每个关键结论注明来源、发布日期和访问日期，区分事实、来源观点和作者推断；无法交叉验证的内容单列，不纳入确定结论。\n\n使用要点： 多个网页转述同一消息不等于多源验证。来源质量和证据链比材料数量更重要。\n\n竞品分析与用户调研\n\n适用场景： 比较竞品、整理用户反馈，并评估某项产品或项目设想。\n\n请完成【竞品名称】与【用户反馈材料】的联合分析。竞品部分按产品定位、目标用户、核心能力、价格口径、优势、限制和信息日期进行比较；用户部分提取高频诉求、抱怨、使用场景和原文证据，不把少量评论外推为全部用户。对关键信息进行来源交叉核验并标注可信度。最后从市场需求、资源条件、成本收益和风险四方面评估【项目设想】，给出“可试点／需补证据／暂不推进”的判断及理由。"}}}, {"id": "ed1754a1e515592fa022229416", "title": "A.6　内容创作类（2条）", "notes": {"plain": {"content": "新媒体图文创作\n\n适用场景： 为公众号、小红书、朋友圈或其他平台准备同一主题的差异化内容。\n\n请基于【主题／产品资料】分别起草三类内容：公众号文章采用问题切入、方法与案例、总结和行动提示的结构；小红书笔记突出可验证的体验与实用步骤；朋友圈文案提供活动型、信息型和个人表达型三个版本。各版本分别遵守【字数、语气和禁用词】要求，不虚构使用体验、用户评价或效果数据。另提供10个标题候选，并说明每个标题对应的读者利益点。\n\n使用要点： 不同平台需要重新组织表达，不能只改标题。发布前检查事实、商标、图片权利和广告合规要求。\n\n短视频脚本与内容拆解\n\n适用场景： 起草短视频脚本、分析参考内容、改写文案或提炼产品卖点。\n\n请为【主题】制作【时长】短视频脚本，包含开场、信息展开、案例或证据、结尾行动提示，并逐段给出画面、口播和字幕建议。对参考内容【链接／材料】只分析标题、结构、节奏、情绪和转化设计，不复制原文表达。根据产品资料提炼功能、用户收益、适用条件和限制，生成三个不同语气的文案版本。任何性能、销量或效果结论都必须来自已提供且可核验的材料。"}}}, {"id": "10c3bcaf05bf5c1ba4e4a4c252", "title": "A.7　营销与运营类（2条）", "notes": {"plain": {"content": "营销方案与投放文案\n\n适用场景： 策划营销活动、设计渠道策略并准备投放素材。\n\n请为【产品／活动】制定营销方案，依次说明目标、受众、渠道、内容、预算口径、效果指标、时间表和风险。按【用户分层依据】描述各层特征与运营策略，不根据敏感属性进行不当差别对待。为【渠道】分别起草三个广告文案版本，所有价格、优惠、效果和适用条件必须引用已确认材料。最后生成一周内容日历。先交付方案和文案预览，未经我确认不得发布、投放或修改线上内容。\n\n使用要点： 指标应能在活动后复盘，文案必须与实际权益一致。涉及预算和发布的动作始终保留人工确认。\n\n活动复盘与数据运营\n\n适用场景： 活动结束后复盘、形成数据日报、设计增长试验或规划客户触达。\n\n请基于【活动目标、投入和结果数据】完成复盘，输出目标达成、渠道表现、投入产出、异常、亮点、问题和下次改进清单。为【业务问题】提出不超过3个可验证假设，分别写明证据、试验方法、样本范围、成功指标、观察周期和停止条件。若需要周期报告，只先给出任务配置草案，包括触发时间、数据源、输出位置、告警和人工确认点；未经确认不要创建定时任务或发送客户消息。"}}}, {"id": "85313a89bfdf511eaed719bf01", "title": "A.8　销售与客户类（2条）", "notes": {"plain": {"content": "销售话术与异议应答\n\n适用场景： 为一线销售准备开场、价值说明、异议处理、回访和报价沟通材料。\n\n请基于已确认的产品资料【粘贴】起草销售沟通方案。按【客户类型】提供开场方式；用通俗语言说明产品价值、适用条件和限制；针对【常见异议】按“确认顾虑—核对事实—回应价值—约定下一步”给出话术；再设计回访提纲。报价部分只能引用【已批准价目表】，分别给出推荐方案和备选方案，注明有效期、包含内容和待确认条款。所有内容仅生成草稿，不代替销售人员作出承诺。\n\n使用要点： 不制造稀缺、不虚构案例、不承诺未经批准的价格或效果。客户意向和承诺必须回到原始沟通记录。\n\n客户跟进与分级\n\n适用场景： 整理客户沟通、规划跟进节奏并降低遗漏风险。\n\n请读取【客户沟通记录】，为每位客户生成跟进卡，区分客户原话、销售判断、已承诺事项、待确认问题和下一步建议，并保留来源位置。根据组织已批准的【分级标准】进行分组，说明每项判断依据，不使用与业务无关的敏感信息。生成待跟进清单和提醒配置草案，列出负责人、期限和触发条件；任何外发消息、报价、权益或客户系统写入都要等待负责人确认。"}}}, {"id": "9c747a3bc2965e79aa1b877836", "title": "A.9　行政与人事类（2条）", "notes": {"plain": {"content": "招聘材料与流程支持\n\n适用场景： 起草岗位说明、整理简历、设计面试问题和准备入职通知。\n\n请根据【岗位需求】起草职位说明，明确岗位职责、必要条件、可培养条件、工作地点和投递方式。读取候选材料时，只提取与岗位直接相关且材料中明确提供的信息，并按统一字段形成汇总表；不得推断年龄、健康、婚育、民族等敏感属性，不自动淘汰或作出录用建议。根据岗位能力和候选材料生成面试问题，并标注每个问题要验证的事实。入职通知只起草模板，日期、薪酬、地点和联系人由人力资源（Human Resources，HR）负责人确认后发送。\n\n使用要点： AI可协助整理材料，招聘评价与录用决定必须由具备权限的人承担，并保留公平性复核。\n\n制度文件与绩效沟通\n\n适用场景： 起草制度、准备绩效面谈、培训通知、请假回复或离职交接清单。\n\n请基于【现行制度、法律意见和业务要求】起草【制度名称】修订稿，结构包括目的、适用范围、职责、执行规则、例外、申诉或反馈渠道、生效日期和版本记录；有冲突或依据不足之处单列。根据【已经确认的绩效事实】设计面谈提纲，区分成绩、具体事例、需要改进的行为、双方约定和后续支持，不推断个人动机。另起草培训通知或交接清单，发布和权限回收前等待负责人确认。"}}}, {"id": "3c91d591290552b98a91dc1f6b", "title": "A.10　个人效率与生活事务类（2条）", "notes": {"plain": {"content": "日程规划与学习计划\n\n适用场景： 安排个人时间、制定学习目标、整理读书笔记或汇总沟通记录。\n\n请基于【日程与任务清单】按重要性、紧急度、期限和精力要求排序，识别冲突、通勤和缓冲时间，提出可调整项，但不要自行取消或移动日程。为【学习目标】设计4周计划，包含每周主题、每日30～60分钟任务、练习成果和每周复盘。对【书籍／课程材料】生成核心观点、证据、疑问和应用计划；对沟通记录只提取已确认事项、待办、分歧和下一步建议。\n\n使用要点： 计划要为突发任务留出余量，并定期根据完成情况调整。自动读取日历或消息前先确认授权范围。\n\n决策辅助与个人事务规划\n\n适用场景： 比较选项、梳理个人收支、规划旅行或安排一般性的健康习惯。\n\n请比较【选项A】与【选项B】，先使用我提供的【决策标准与权重】逐项列出证据、未知项和风险，再给出条件式建议。对个人收支【材料】只做分类、预算和现金流梳理，不提供投资或借贷决策。旅行计划注明日期、预算、交通和需要实时核验的价格。健康习惯只提供一般性的运动、饮食和作息记录方案；涉及症状、诊断、药物或高强度训练时，明确建议咨询合格专业人员。"}}}]}, "notes": {"plain": {"content": "“提示词”是日常说法，本书统一使用“指令”一词。本附录依据办公场景收录20条可直接改写的指令模板，分为10类，每类2条。模板不是无需判断的口令：使用前应把【】中的占位内容替换为真实信息，补齐数据来源、输出格式、操作边界和验收标准；涉及事实、数据、人员评价、对外发送或系统写入时，必须保留人工复核与确认。"}}}, {"id": "784ff01a5d9452f3a4a9ae7961", "title": "附录B　常见问题与排查：20问", "children": {"attached": [{"id": "fbd036181afd50619cd4127e37", "title": "B.1　产品与版本（3问）", "notes": {"plain": {"content": "豆包工作是什么？和豆包App是什么关系？\n\n豆包App更偏向聊天、问答和内容生成，豆包工作更强调围绕目标读取材料、拆分步骤、调用办公工具并形成交付物。两者可能共享账号或部分能力，但入口、权限、运行环境和可用功能会随版本变化。判断任务应使用哪一个入口，不看名称相近与否，而要看是否需要访问文件、调用工具、跨步骤执行和保留过程证据。\n\n豆包工作支持哪些系统？有移动端吗？必须和飞书一起使用吗？\n\n桌面端支持范围和最低系统要求应以当前官方下载页为准。移动端、远程查看或远程操作能力可能受版本、账号和地区影响，使用前应在客户端核验。豆包工作可以处理本地办公任务；只有任务需要飞书中的聊天、文档、组织或日程上下文时，才需要完成相应账号连接和授权。\n\n豆包工作会取代Office或WPS吗？\n\n更准确的理解是协作而非取代。豆包工作可以辅助整理、生成或修改DOCX、XLSX、PPTX等文件，但正式编辑、复杂版式、公式兼容、打印和团队审阅仍可能依赖Office、WPS或其他专业软件。最终文件应在收件人实际使用的软件中打开检查。"}}}, {"id": "f955e266e8b65d6e8fc49fa0e3", "title": "B.2　安装与登录（2问）", "notes": {"plain": {"content": "怎样下载安装？需要什么电脑配置？\n\n应从豆包官网或产品当前公布的正式入口下载安装包，并核对域名、发布主体和安装包签名。具体支持的系统版本、芯片、内存和存储空间以当期下载页为准，不宜把某一版的最低配置写成长期结论。安装前还应确认组织是否允许使用该软件，以及终端安全策略是否需要管理员批准。\n\n登录需要什么账号？换电脑后怎样恢复？\n\n可用登录方式以当前客户端显示为准，个人入口和组织入口的数据边界可能不同。换电脑时，应先区分云端账号内容与只保存在本地的文件、目录授权和软件配置；即使使用同一账号，也不能默认所有历史任务和本地材料都会自动同步。迁移前应备份文件，登录后重新检查授权目录和外部系统连接。"}}}, {"id": "6bd80f58d126517282646fc932", "title": "B.3　功能使用（6问）", "notes": {"plain": {"content": "怎样让AI操作电脑？怎样控制风险？\n\n只有在产品提供相应能力且用户明确授权时，系统才能读取屏幕、操作浏览器或访问本地文件。开始前要限定应用、目录、账号和动作范围，先用少量无敏感数据试跑。删除、覆盖、发送、发布、付款、审批等高影响动作应设置为执行前确认；发现异常时立即暂停并接管。\n\n怎样让AI定时执行任务？\n\n如果当前版本支持周期任务，应明确触发时间与时区、数据来源、处理规则、输出位置、接收人、失败告警和人工检查点。首次运行先用小样本和测试位置验证，未经确认不要直接发送到群聊、客户或正式系统。长期任务还需要负责人、停用条件和定期复查日期。\n\n怎样生成和修改文档、表格或PPT？\n\n指令至少要说明材料、受众、用途和输出格式。复杂文档或演示文稿先确认大纲；数据任务先确认字段和指标口径；修改已有文件时限定页面、工作表或段落范围，并保留原件。生成后应在Office或WPS中检查内容、公式、图表、字体和分页。"}}}, {"id": "6e7b920724535af4971a618767", "title": "B.4　数据与安全（3问）", "notes": {"plain": {"content": "我的数据会被用于模型改进吗？AI能看到所有聊天记录吗？\n\n不能只凭一句宣传语判断。个人用户应在“设置—隐私与权限”或当前对应入口中检查“帮助模型改进效果”等选项，并阅读适用隐私政策；企业用户还要结合合同、管理员设置和组织制度理解数据用途。关闭相关开关也不等于任何敏感资料都适合上传。系统能够读取哪些内容，取决于账号身份、用户授权、连接范围和原系统权限。\n\n有风险的操作会怎样处理？操作记录能否查看？\n\n使用者应主动把删除、覆盖、发送、发布和系统写入设置为执行前确认，而不能假定所有风险都会被系统自动识别。操作记录、审计范围和保存期限取决于产品版本及组织配置。重要任务应另行保存输入版本、关键确认、输出文件和异常说明，使结果能够追溯。\n\n怎样保护账号？人员离职后怎样处理数据和权限？\n\n使用独立且强的密码，不共享密码或验证码，并定期检查登录设备和已连接应用。产品是否提供固定的双因素认证开关，应以当前账号设置为准。发现异常时立即退出陌生设备、修改凭证并保存记录。人员离职或岗位变化时，应由管理员按组织制度回收账号、目录、群组、连接器和数据访问权限，并确认交付物的归属与保留期限。"}}}, {"id": "cfb8dbf1f562579fb0aa5a9b51", "title": "B.5　套餐与付费（3问）", "notes": {"plain": {"content": "豆包工作怎样收费？是否有免费试用？\n\n套餐名称、价格、额度、试用和活动都属于高频变化信息，应以当前客户端账单页、正式产品页面或写明活动名称与有效期的官方公告为准。不要使用旧截图或第三方文章判断当前权益，也不要把一次性活动写成长期承诺。团队采购还应确认席位、数据条款、发票和退出安排。\n\n学生是否有优惠？\n\n只有当前官方页面明确提供学生认证和对应权益时，才能按页面要求申请。应核对活动时间、适用地区、认证主体、自动续费和取消规则；无法在官方入口确认的信息，不作为购买依据。\n\n套餐能否升级或降级？额度用完怎么办？怎样开具发票？\n\n升级生效时间、降级规则、额度恢复周期和发票入口都可能因套餐与渠道不同而变化，应在操作前查看账单页和适用条款。若额度不足，可先缩小任务、停止低价值周期任务或等待额度恢复，再判断是否需要调整套餐。任何涉及付款或续费的操作都应由账号负责人确认。"}}}, {"id": "462e8e50b22752b786b081c2c5", "title": "B.6　故障排查（2问）", "notes": {"plain": {"content": "回答质量差、执行缓慢或任务卡住怎么办？\n\n质量差时，先检查目标、输入、格式、边界和验收标准是否明确，并要求系统指出缺失信息；执行慢时，把任务拆成可独立验收的小步骤，检查网络、文件大小和外部服务状态；任务卡住时，先暂停，记录停在什么步骤，再检查授权、登录状态、窗口遮挡、文件占用和磁盘空间。不要在状态不明时反复重试高影响动作。\n\n生成的文件打不开，或周期任务没有触发怎么办？\n\n文件打不开时，先确认扩展名与实际格式一致，检查文件大小和生成日志，并在收件人使用的软件中打开；必要时从稳定检查点重新生成，不覆盖唯一原件。周期任务未触发时，依次检查是否启用、时区、触发条件、账号登录、数据源权限、输出目标权限和运行记录。仍无法定位时，保存版本号、时间、步骤和报错截图，再联系官方支持。"}}}, {"id": "acbf7d6a823550328fd92ee7e8", "title": "B.7　进阶使用（1问）", "notes": {"plain": {"content": "怎样让系统更符合我的工作习惯？复杂任务怎样拆解和核验？\n\n把稳定的格式、术语、流程和验收标准写入任务说明或沉淀为经过验证的技能，不要依赖系统“自动记住”。复杂任务先拆成材料确认、计划、执行、检查和交付五个阶段，每阶段都定义产物与检查点。验证结果时，从结论回到来源、原始材料和处理步骤；对关键事实进行交叉核验，对数字抽样复算，并由相应负责人完成最终确认。\n\n排查通用流程\n\n遇到问题时按“现象—环境—复现—定位”四步记录：先写清报错、卡住位置或质量问题；再记录产品版本、系统、网络、账号和输入材料；随后用低风险样本判断问题能否复现；最后检查权限、额度、配置、文件和外部服务。联系支持时提供经过脱敏的版本号、时间、操作步骤和截图，不发送密码、验证码或仍然有效的访问链接。"}}}]}, "notes": {"plain": {"content": "本附录依据补充稿收录豆包工作使用中的20个常见问题（Frequently Asked Questions，FAQ），按产品与版本、安装与登录、功能使用、数据与安全、套餐与付费、故障排查和进阶使用七类编排。回答以本书截至2026年9月3日的核验口径为基线；界面、功能、套餐和活动均可能变化，涉及版本性事实时应以当前客户端、官网、协议和所在组织制度为准。"}}}, {"id": "ceb50f3c29b651eabbbbd783f7", "title": "附录C　学习资源与持续实践", "children": {"attached": [{"id": "db9d10007f295e278f10e0eb11", "title": "C.1　本书可直接使用的配套内容", "notes": {"plain": {"content": "本版书稿能够直接交付的配套内容都在书内，不依赖尚未上线的下载页面。表C-1列出各项内容的位置和使用方式。\n\n本版不设置依赖外部下载页面的案例素材包，也不把尚未上线的资源列为随书权益。读者练习时可使用自行准备的虚拟数据或经过组织允许的脱敏副本，避免因链接失效而无法完成书中任务。"}}}, {"id": "1c2d4c55d5aa5afda463076af1", "title": "C.2　14天实践路线：每天完成一项可验收成果", "notes": {"plain": {"content": "这是一条由14个练习组成的可选路线，不是连续打卡要求，也不是速成承诺。读者可以按章节顺序每天完成一项，也可以根据岗位需要分散到数周进行。每次只完成一个范围可控、结果可检查的任务；涉及敏感资料或高影响操作时，改用虚拟数据或经过批准的脱敏副本。\n\n第1天：判断产品边界。 阅读第1章，列出三个适合交给办公Agent的任务和三个必须保留人工判断的任务。\n\n第2天：完成首次任务。 阅读第2章，在独立工作目录中用无敏感信息的材料生成一份会议纪要，并核对行动项。\n\n第3天：写出任务说明书。 阅读第3章，为一个真实任务写清目标、数据源、输出格式、操作边界和失败处理方式。\n\n第4天：交付一份正式文档。 阅读第4章，把零散记录整理为结构完整、事实可追溯的纪要、方案或报告。\n\n第5天：完成一份演示文稿。 阅读第5章，先确认大纲，再制作并演练一份小型汇报。\n\n第6天：完成一次数据分析。 阅读第6章，使用保留原件的样本数据完成清洗、汇总、可视化和结果核验。"}}}, {"id": "8840c084543a514d89d93cf2cf", "title": "C.3　核心术语速查：先懂大白话，再回到正式名称", "notes": {"plain": {"content": "这一节用于回查，不代替正文中的场景、步骤和边界说明。遇到陌生术语时，可以先看通俗解释，再回到所列章节理解它在真实任务中怎样使用。\n\n人工智能（Artificial Intelligence，AI）。 泛指让计算机完成识别、生成、预测、规划等任务的技术集合。书中谈到的AI并不是一个具有统一意图的“人”，不同模型、工具和产品能力必须分别核验。\n\n生成式AI。 根据输入和既有模式生成文字、图像、音频、视频或代码的系统。它擅长形成候选内容，但输出流畅不等于事实正确，参见第4、7和10章。\n\n大模型。 通过大规模数据和计算训练、能够处理多类语言或内容任务的基础模型。它提供理解与生成能力，但不是实时更新的事实数据库，也不能替代来源核验。\n\n智能体（Agent）。 围绕目标规划步骤，并在条件允许时调用工具推进任务的系统。能执行多步操作不等于可以独立承担判断和责任，参见第1和3章。"}}}]}, "notes": {"plain": {"content": "本附录保留三类可直接使用的内容：书内配套资料、14天实践路线和核心术语速查。它们分别用于快速定位工具、安排练习和回查概念，不代替各章中的场景、步骤与风险边界。"}}}]}, "notes": {"plain": {"content": "依据Word正文标题整理，涵盖五篇、15章、前言、结语与附录。"}}}</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),lookup=new Map(),parents=new Map(),closed=new Set();let matches=[],cursor=-1,w=0,h=0;
function index(n,parent,depth){lookup.set(n.id,n);n.depth=depth;if(parent)parents.set(n.id,parent);for(const c of n.children?.attached||[])index(c,n,depth+1);}index(data,null,0);
function level(max){closed.clear();for(const n of lookup.values())if(n.depth>=max)closed.add(n.id);render();}
function render(){const canvas=$('canvas');canvas.replaceChildren();const coords=[];let y=20;
function place(n){const kids=closed.has(n.id)?[]:n.children?.attached||[];const label=n.title;const height=Math.max(60,Math.ceil(label.length/16)*21+20);let cy;
if(kids.length){const positioned=kids.map(place);cy=(positioned[0].y+positioned[0].height/2+positioned.at(-1).y+positioned.at(-1).height/2)/2-height/2;}else{cy=y;y+=height+18;}
const item={n,x:20+n.depth*330,y:cy,height,width:285};coords.push(item);return item;}place(data);
w=Math.max(...coords.map(p=>p.x+p.width))+40;h=Math.max(y,...coords.map(p=>p.y+p.height))+30;

function reveal(id){let n=lookup.get(id);if(!n)return;for(let p=parents.get(id);p;p=parents.get(p.id))closed.delete(p.id);render();const box=$('node-'+id);box?.classList.add('hit');box?.scrollIntoView({block:'center',inline:'center'});}
